<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deskmate</title>
<style>
  :root {
    --bg: #0d1014;
    --panel: #161b22;
    --line: #232a33;
    --text: #c8d2de;
    --dim: #6b7684;
    --glow: #58c9ff;
    --warm: #ffb454;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  #stage { position: relative; }
  canvas#face {
    display: block;
    border-radius: 50%;
    background: #10151b;
    box-shadow: 0 0 0 1px var(--line), 0 18px 60px -20px #000;
    cursor: pointer;
  }

  #status {
    height: 20px;
    color: var(--dim);
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: 11px;
  }
  #status.live { color: var(--glow); }

  #said {
    max-width: 560px;
    min-height: 44px;
    text-align: center;
    padding: 0 16px;
    color: var(--text);
    font-size: 15px;
  }
  #said .you { color: var(--dim); }

  #bar {
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px;
  }
  button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  button.on { color: var(--bg); background: var(--glow); border-color: var(--glow); }
  button:disabled { opacity: .35; cursor: default; }

  #hint { color: var(--dim); font-size: 11px; }
  #hint kbd {
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--text);
  }

  #cost {
    position: fixed; top: 14px; right: 16px;
    color: var(--dim); font-size: 11px; text-align: right; line-height: 1.7;
  }
  #cost b { color: var(--warm); font-weight: normal; }

  #cam {
    position: fixed; top: 14px; left: 16px;
    width: 128px; border-radius: 8px; border: 1px solid var(--line);
    display: none; transform: scaleX(-1);
  }
  #cam.on { display: block; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 22px; width: min(460px, 92vw); font: inherit;
  }
  dialog::backdrop { background: #000a; }
  dialog h2 { font-size: 14px; font-weight: normal; margin-bottom: 4px; }
  dialog p { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  label { display: block; font-size: 11px; color: var(--dim); margin: 12px 0 4px; }
  input, select {
    width: 100%; font: inherit; font-size: 13px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px;
  }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  #approve {
    position: fixed; inset: auto 0 0 0; padding: 16px;
    display: none; justify-content: center;
  }
  #approve.on { display: flex; }
  #approve .card {
    background: var(--panel); border: 1px solid var(--warm);
    border-radius: 10px; padding: 14px 16px; max-width: 560px; width: 100%;
  }
  #approve .what { color: var(--warm); font-size: 12px; margin-bottom: 8px; }
  #approve pre {
    font-size: 12px; color: var(--text); white-space: pre-wrap;
    max-height: 120px; overflow: auto; margin-bottom: 12px;
  }
</style>
</head>
<body>

<img id="cam" alt="">
<div id="cost">
  session <b id="c-turns">0</b> turns<br>
  ~<b id="c-spend">$0.0000</b>
</div>

<div id="stage"><canvas id="face" width="520" height="520"></canvas></div>
<div id="status">asleep</div>
<div id="said"></div>

<div id="bar">
  <button id="talk">Hold to talk</button>
  <button id="eye">Eyes</button>
  <button id="cfg">Brain</button>
</div>
<div id="hint">hold <kbd>space</kbd> to talk &middot; <kbd>esc</kbd> to interrupt</div>

<div id="approve"><div class="card">
  <div class="what" id="ap-what"></div>
  <pre id="ap-body"></pre>
  <div class="row">
    <button id="ap-no">Nope</button>
    <button id="ap-yes" class="on">Do it</button>
  </div>
</div></div>

<dialog id="dlg">
  <h2>Where does the thinking happen?</h2>
  <p>Speech in and out is free — your browser does it. This is the only part that costs money, and it stays in this browser.</p>

  <label for="d-mode">Brain</label>
  <select id="d-mode">
    <option value="demo">Demo — no key, canned replies, free</option>
    <option value="anthropic">Anthropic API</option>
    <option value="openai">OpenAI-compatible (OpenAI, Groq, Ollama, LM Studio…)</option>
  </select>

  <div id="d-remote" hidden>
    <label for="d-url">Endpoint</label>
    <input id="d-url" spellcheck="false">
    <label for="d-model">Model</label>
    <input id="d-model" spellcheck="false">
    <label for="d-key">API key <span id="d-keynote"></span></label>
    <input id="d-key" type="password" spellcheck="false" placeholder="sk-…">
  </div>

  <div class="row">
    <button id="d-close">Close</button>
    <button id="d-save" class="on">Save</button>
  </div>
</dialog>

<script>
// ---------------------------------------------------------------- the face --
const cv = document.getElementById('face');
const cx = cv.getContext('2d');
const R = cv.width / 2;

// Everything the face does is one of these. Each drives the eyes and mouth
// toward a target; the drawing loop just chases those targets so transitions
// are smooth without any per-state animation code.
const MOODS = {
  asleep:    { lid: 0.92, pupil: 0.9,  mouth: 0.00, curve:  0.10, hue: 210, glow: 0.10 },
  idle:      { lid: 0.06, pupil: 1.0,  mouth: 0.04, curve:  0.30, hue: 200, glow: 0.55 },
  listening: { lid: 0.00, pupil: 1.35, mouth: 0.02, curve:  0.14, hue: 195, glow: 1.00 },
  thinking:  { lid: 0.34, pupil: 0.78, mouth: 0.03, curve: -0.16, hue: 265, glow: 0.60 },
  talking:   { lid: 0.05, pupil: 1.05, mouth: 0.45, curve:  0.34, hue: 200, glow: 0.85 },
  waiting:   { lid: 0.00, pupil: 1.2,  mouth: 0.06, curve:  0.05, hue:  35, glow: 0.95 },
  oops:      { lid: 0.44, pupil: 0.85, mouth: 0.10, curve: -0.42, hue:   5, glow: 0.70 },
};

let mood = 'asleep';
const now = { ...MOODS.asleep };      // what we're drawing
let gaze = { x: 0, y: 0, tx: 0, ty: 0 };
let blink = 0, nextBlink = 2000, t0 = performance.now(), speakEnergy = 0;

function setMood(m) {
  if (MOODS[m]) mood = m;
  const s = document.getElementById('status');
  s.textContent = { asleep: 'asleep', idle: 'here', listening: 'listening',
                    thinking: 'thinking', talking: 'talking',
                    waiting: 'waiting on you', oops: 'that went wrong' }[mood];
  s.classList.toggle('live', mood === 'listening' || mood === 'talking');
}

function draw(ts) {
  const dt = Math.min(64, ts - t0); t0 = ts;
  const k = 1 - Math.pow(0.001, dt / 1000);   // frame-rate independent easing
  const want = MOODS[mood];

  for (const p in want) now[p] += (want[p] - now[p]) * k;

  // Idle wandering gaze. Every so often, look somewhere else.
  if (ts > nextBlink) {
    blink = 1;
    nextBlink = ts + 1800 + Math.random() * 3600;
    gaze.tx = (Math.random() - 0.5) * 0.55;
    gaze.ty = (Math.random() - 0.5) * 0.35;
  }
  blink = Math.max(0, blink - dt / 90);
  gaze.x += (gaze.tx - gaze.x) * k * 0.6;
  gaze.y += (gaze.ty - gaze.y) * k * 0.6;

  speakEnergy *= 0.86;

  cx.clearRect(0, 0, cv.width, cv.height);
  const hue = now.hue, glow = now.glow;
  const breathe = 1 + Math.sin(ts / 1400) * 0.012;

  // faint aura so the whole face reads as lit from within
  const aura = cx.createRadialGradient(R, R, R * 0.15, R, R, R);
  aura.addColorStop(0, `hsla(${hue},80%,60%,${0.13 * glow})`);
  aura.addColorStop(1, 'transparent');
  cx.fillStyle = aura;
  cx.fillRect(0, 0, cv.width, cv.height);

  const eyeY = R - R * 0.06;
  const eyeDX = R * 0.30;
  const lid = Math.min(1, now.lid + blink);

  for (const side of [-1, 1]) {
    const ex = R + side * eyeDX + gaze.x * R * 0.07;
    const ey = eyeY + gaze.y * R * 0.05;
    const er = R * 0.175 * breathe;

    cx.save();
    // eye white / socket
    cx.beginPath(); cx.arc(ex, ey, er, 0, 7); cx.clip();
    cx.fillStyle = `hsl(${hue},22%,12%)`;
    cx.fillRect(ex - er, ey - er, er * 2, er * 2);

    // iris
    const ir = er * 0.72 * now.pupil;
    const g = cx.createRadialGradient(ex - ir * 0.25, ey - ir * 0.3, ir * 0.1, ex, ey, ir);
    g.addColorStop(0, `hsl(${hue},95%,${58 + glow * 16}%)`);
    g.addColorStop(0.75, `hsl(${hue},88%,${34 + glow * 10}%)`);
    g.addColorStop(1, `hsl(${hue},70%,16%)`);
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(ex, ey, ir, 0, 7); cx.fill();

    // pupil + catchlight
    cx.fillStyle = '#05070a';
    cx.beginPath(); cx.arc(ex, ey, ir * 0.42, 0, 7); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,.85)';
    cx.beginPath(); cx.arc(ex - ir * 0.3, ey - ir * 0.34, ir * 0.16, 0, 7); cx.fill();

    // eyelid drops from the top
    cx.fillStyle = '#10151b';
    cx.fillRect(ex - er, ey - er, er * 2, er * 2 * lid);
    cx.restore();
  }

  // mouth — one bezier, opened by mouth, bowed by curve
  const my = R + R * 0.36;
  const mw = R * 0.30;
  const open = R * 0.20 * (now.mouth + speakEnergy * 0.5);
  const bow  = R * 0.26 * now.curve;

  cx.strokeStyle = cx.fillStyle = `hsl(${hue},80%,${52 + glow * 14}%)`;
  cx.lineWidth = R * 0.035;
  cx.lineCap = 'round';
  cx.beginPath();
  cx.moveTo(R - mw, my);
  cx.quadraticCurveTo(R, my + bow + open, R + mw, my);
  if (open > R * 0.02) {
    cx.quadraticCurveTo(R, my + bow - open * 0.35, R - mw, my);
    cx.globalAlpha = 0.65; cx.fill(); cx.globalAlpha = 1;
  }
  cx.stroke();

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ------------------------------------------------------- ears (free, local) --
// Browser speech recognition and synthesis cost nothing. That is the single
// biggest reason this runs for pennies rather than $30/month.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, heard = '';

if (SR) {
  rec = new SR();
  rec.lang = 'en-GB';
  rec.interimResults = true;
  rec.continuous = false;

  rec.onresult = e => {
    heard = [...e.results].map(r => r[0].transcript).join('');
    show(heard, '');
  };
  rec.onerror = e => { if (e.error !== 'aborted' && e.error !== 'no-speech') fail(e.error); };
  rec.onend = () => {
    listening = false;
    document.getElementById('talk').classList.remove('on');
    if (heard.trim()) ask(heard.trim());
    else setMood('idle');
  };
}

function startListening() {
  if (!rec || listening) return;
  if (speaking) stopSpeaking();
  heard = '';
  try { rec.start(); } catch { return; }
  listening = true;
  setMood('listening');
  document.getElementById('talk').classList.add('on');
}
function stopListening() { if (listening) try { rec.stop(); } catch {} }

// --------------------------------------------------------- mouth (free too) --
let speaking = false, voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /Daniel|Serena|Google UK/i.test(v.name))
       || vs.find(v => v.lang.startsWith('en')) || vs[0];
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

function say(text) {
  return new Promise(res => {
    if (!text) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice; u.rate = 1.02; u.pitch = 1.06;
    // crude viseme: every boundary event nudges the mouth open
    u.onboundary = () => { speakEnergy = Math.min(1, speakEnergy + 0.55); };
    u.onstart = () => { speaking = true; setMood('talking'); };
    u.onend = u.onerror = () => { speaking = false; setMood('idle'); res(); };
    speechSynthesis.speak(u);
  });
}
function stopSpeaking() { speechSynthesis.cancel(); speaking = false; }

// --------------------------------------------------------------- the eyes ---
let stream = null;
const camEl = document.getElementById('cam');

async function toggleCam() {
  const btn = document.getElementById('eye');
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null; camEl.classList.remove('on'); btn.classList.remove('on');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640 } });
    const v = document.createElement('video');
    v.srcObject = stream; v.muted = true; await v.play();
    camEl._video = v; camEl.classList.add('on'); btn.classList.add('on');
    const tick = () => {
      if (!stream) return;
      const c = document.createElement('canvas');
      c.width = 320; c.height = 320 * v.videoHeight / v.videoWidth;
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      camEl.src = c.toDataURL('image/jpeg', 0.6);
      setTimeout(tick, 400);
    };
    tick();
  } catch { fail('no camera'); }
}

// A frame is only captured at the moment you ask something — never streamed.
// Vision tokens are the most expensive thing here, so they're strictly on demand.
function grabFrame() {
  if (!stream || !camEl.src) return null;
  return camEl.src.split(',')[1];
}
const WANTS_EYES = /\b(see|look|watch|this|holding|here|wearing|screen|show)\b/i;

// -------------------------------------------------------------- the brain ---
const cfg = JSON.parse(localStorage.getItem('deskmate') || '{}');
cfg.mode ??= 'demo';

const PRESETS = {
  anthropic: { url: 'https://api.anthropic.com/v1/messages', model: 'claude-haiku-4-5-20251001' },
  openai:    { url: 'https://api.openai.com/v1/chat/completions', model: 'gpt-4o-mini' },
};

const SYSTEM = `You are a small deskmate that lives on a screen on someone's desk.
You are spoken to out loud and your reply is read out loud, so: two or three
sentences at most, plain words, no lists, no markdown, no emoji. Warm and dry
rather than perky. If you can't do something, say so in one short line.
If you are shown a camera frame, mention what you actually see, briefly.`;

const history = [];
let turns = 0, spend = 0;

async function ask(text) {
  show(text, '');
  setMood('thinking');

  if (cfg.mode === 'demo') {
    await new Promise(r => setTimeout(r, 550));
    const reply = demoReply(text);
    tally(text.length / 4, reply.length / 4);
    show(text, reply);
    return say(reply);
  }

  const img = WANTS_EYES.test(text) ? grabFrame() : null;
  history.push({ role: 'user', text, img });
  if (history.length > 12) history.splice(0, history.length - 12);

  try {
    const reply = cfg.mode === 'anthropic' ? await callAnthropic() : await callOpenAI();
    history.push({ role: 'assistant', text: reply });
    show(text, reply);
    await say(reply);
  } catch (e) {
    history.pop();
    fail(String(e.message || e).slice(0, 120));
  }
}

async function callAnthropic() {
  const r = await fetch(cfg.url, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': cfg.key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: cfg.model, max_tokens: 300, system: SYSTEM,
      messages: history.map(m => ({
        role: m.role,
        content: m.img
          ? [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: m.img } },
             { type: 'text', text: m.text }]
          : m.text,
      })),
    }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || r.status);
  tally(j.usage?.input_tokens, j.usage?.output_tokens);
  return j.content.map(c => c.text || '').join('').trim();
}

async function callOpenAI() {
  const r = await fetch(cfg.url, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: `Bearer ${cfg.key || 'none'}` },
    body: JSON.stringify({
      model: cfg.model, max_tokens: 300,
      messages: [{ role: 'system', content: SYSTEM }, ...history.map(m => ({
        role: m.role,
        content: m.img
          ? [{ type: 'text', text: m.text },
             { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + m.img } }]
          : m.text,
      }))],
    }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || r.status);
  tally(j.usage?.prompt_tokens, j.usage?.completion_tokens);
  return j.choices[0].message.content.trim();
}

function demoReply(t) {
  const s = t.toLowerCase();
  if (/hello|hi\b|hey/.test(s)) return "Hello. I'm running on canned replies until you give me a brain — the Brain button, bottom right.";
  if (/how much|cost|money/.test(s)) return "Right now, nothing at all. The listening and the talking are done by your browser for free. Only the thinking costs anything.";
  if (/who|what are you/.test(s)) return "A face in a browser tab. Modest, but I'm here.";
  if (/\?$/.test(t)) return "I'd need a real brain wired up to answer that properly. Demo mode only knows a handful of lines.";
  return "Noted. I'm in demo mode though, so I'm mostly nodding along.";
}

// Rough running total so the number is never a surprise at the end of the month.
const RATES = { anthropic: [1, 5], openai: [0.15, 0.6], demo: [0, 0] };  // $ per Mtok
function tally(inTok = 0, outTok = 0) {
  turns++;
  const [ri, ro] = RATES[cfg.mode] || [0, 0];
  spend += (inTok * ri + outTok * ro) / 1e6;
  document.getElementById('c-turns').textContent = turns;
  document.getElementById('c-spend').textContent = '$' + spend.toFixed(4);
}

// ------------------------------------------------------ doing things safely --
// Nothing that changes a file or an email happens without you tapping yes.
// This is the hook the agent side plugs into later; it is deliberately the
// first thing built, not the last.
function requestApproval(what, body) {
  return new Promise(res => {
    setMood('waiting');
    document.getElementById('ap-what').textContent = what;
    document.getElementById('ap-body').textContent = body;
    document.getElementById('approve').classList.add('on');
    const done = ok => {
      document.getElementById('approve').classList.remove('on');
      setMood('idle'); res(ok);
    };
    document.getElementById('ap-yes').onclick = () => done(true);
    document.getElementById('ap-no').onclick = () => done(false);
  });
}
window.requestApproval = requestApproval;

// ------------------------------------------------------------------ wiring --
function show(you, me) {
  document.getElementById('said').innerHTML =
    (you ? `<div class="you">${esc(you)}</div>` : '') + (me ? esc(me) : '');
}
const esc = s => s.replace(/[<&]/g, c => ({ '<': '&lt;', '&': '&amp;' }[c]));

function fail(msg) {
  setMood('oops');
  show('', msg);
  setTimeout(() => setMood('idle'), 2200);
}

let woke = false;
function wake() {
  if (woke) return;
  woke = true; setMood('idle');
  say(cfg.mode === 'demo'
    ? "I'm awake, but I haven't got a brain yet. Hold space and talk to me anyway."
    : "I'm here. Hold space when you want me.");
}
cv.onclick = wake;

const talkBtn = document.getElementById('talk');
const press = e => { e.preventDefault(); wake(); startListening(); };
const release = e => { e.preventDefault(); stopListening(); };
talkBtn.addEventListener('pointerdown', press);
talkBtn.addEventListener('pointerup', release);
talkBtn.addEventListener('pointerleave', release);

addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && !document.querySelector('dialog[open]')) press(e);
  if (e.code === 'Escape') { stopSpeaking(); stopListening(); setMood('idle'); }
});
addEventListener('keyup', e => { if (e.code === 'Space') release(e); });

document.getElementById('eye').onclick = toggleCam;

// settings
const dlg = document.getElementById('dlg');
const $ = id => document.getElementById(id);
function syncDialog() {
  $('d-mode').value = cfg.mode;
  $('d-remote').hidden = cfg.mode === 'demo';
  const p = PRESETS[cfg.mode];
  if (p) {
    $('d-url').value = cfg.url || p.url;
    $('d-model').value = cfg.model || p.model;
    $('d-key').value = cfg.key || '';
    $('d-keynote').textContent = cfg.mode === 'openai'
      ? '— leave blank for Ollama / LM Studio on localhost' : '';
  }
}
$('cfg').onclick = () => { syncDialog(); dlg.showModal(); };
$('d-mode').onchange = () => {
  cfg.mode = $('d-mode').value;
  cfg.url = cfg.model = ''; syncDialog();
};
$('d-close').onclick = () => dlg.close();
$('d-save').onclick = () => {
  if (cfg.mode !== 'demo') {
    cfg.url = $('d-url').value.trim();
    cfg.model = $('d-model').value.trim();
    cfg.key = $('d-key').value.trim();
  }
  localStorage.setItem('deskmate', JSON.stringify(cfg));
  dlg.close();
  history.length = 0;
};

if (!SR) fail('this browser has no speech recognition — try Chrome');
setMood('asleep');
</script>
</body>
</html>
