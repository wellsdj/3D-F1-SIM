<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circuit 01 — Pinewood</title>
<style>
  :root{
    --ink:#0b0c0d;
    --paper:#eceae4;
    --amber:#f2a20c;
    --line:rgba(236,234,228,.18);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
  canvas#c{display:block;width:100%;height:100%}
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 120% 90% at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.42) 100%);
    mix-blend-mode:multiply;
  }
  .hud{position:fixed;pointer-events:none;font-family:var(--mono);color:var(--paper);
       text-shadow:0 1px 3px rgba(0,0,0,.55)}
  #tag{top:0;left:0;padding:16px 18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1.7}
  #tag b{font-weight:600}
  #tag span{opacity:.55;display:block;letter-spacing:.1em}
  #speed{left:0;bottom:0;padding:14px 20px 20px;display:flex;align-items:baseline;gap:8px}
  #kmh{font-size:clamp(44px,9vw,78px);font-weight:600;color:var(--amber);
       font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:.9}
  #unit{font-size:11px;letter-spacing:.22em;opacity:.65;text-transform:uppercase}
  #keys{right:0;bottom:0;padding:16px 20px 20px;text-align:right;font-size:10.5px;
        letter-spacing:.1em;line-height:2;opacity:.62;text-transform:uppercase}
  #keys kbd{font:inherit;border:1px solid var(--line);border-radius:3px;padding:1px 5px;
            background:rgba(0,0,0,.28);margin:0 1px}
  #status{right:0;top:0;padding:16px 20px;text-align:right;font-size:10.5px;
          letter-spacing:.14em;text-transform:uppercase;opacity:.6;line-height:1.9}
  #status em{font-style:normal;color:var(--amber);opacity:.9}
  #map{position:fixed;right:16px;top:86px;width:186px;height:186px;pointer-events:none;opacity:.9}
  #boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;
        background:var(--ink);color:var(--paper);font-family:var(--mono);z-index:9;
        transition:opacity .7s ease}
  #boot p{margin:0;font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.7}
  #bar{width:200px;height:2px;background:rgba(236,234,228,.14);overflow:hidden}
  #bar i{display:block;height:100%;width:0%;background:var(--amber);transition:width .3s ease}
  #boot.gone{opacity:0;pointer-events:none}
  @media (max-width:560px){ #keys{display:none} #map{width:120px;height:120px;top:74px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div class="hud" id="tag"><b>Circuit 01 — Pinewood</b><span id="tagsub">McLaren MCL39</span></div>
<div class="hud" id="status">Camera <em id="camname">Cockpit</em><br>Detail <em id="qname">High</em></div>
<canvas id="map" width="372" height="372"></canvas>
<div class="hud" id="speed"><div id="kmh">0</div><div id="unit">km/h</div></div>
<div class="hud" id="keys">
  <div><kbd>W</kbd><kbd>S</kbd> throttle · brake</div>
  <div><kbd>A</kbd><kbd>D</kbd> steering</div>
  <div><kbd>C</kbd> camera · <kbd>O</kbd> orbit · <kbd>Q</kbd> detail</div>
  <div>drag look · tap to cycle · scroll zoom</div>
</div>

<div id="boot"><p>Building circuit</p><div id="bar"><i></i></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="meshopt_decoder.js"></script>
<script src="GLTFLoader.js"></script>
<script>
const ASSETS = {
  geoManifest: null,                       // filled by boot() from trees.json
  geo:   "trees.bin",
  bark:  "bark.jpg",
  barkN: "barkn.jpg",
  leaf:  "leaf.png",
  road:  "road.jpg",
  rock:  "rock.jpg",
  car:   "car.glb",
  snd:   { accel:"accel.mp3", idle:"idle.mp3",
           brake:"brake.mp3", coast:"coast.mp3" }
};
</script>
<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- helpers */
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=>a+(b-a)*t;
const smoothstep = (e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const sRGB  = h=>new THREE.Color(h).convertSRGBToLinear();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n);}
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y,oct){
  let s=0,amp=1,f=1,tot=0;
  for(let i=0;i<(oct||4);i++){ s+=vnoise(x*f,y*f)*amp; tot+=amp; amp*=0.5; f*=2.03; }
  return s/tot;
}

/* road cross-section (metres, lateral offset from the centreline) */
const ROAD_HALF   = 4.5;    // asphalt half width
const LANE_EDGE   = 3.65;   // white edge line offset
const SHOULDER    = 6.1;    // gravel outer edge
const TREE_CLEAR  = 15.0;   // nearest trunk to the centreline
const LAP_TARGET  = 5000;   // circuit length, metres

const shadowCasters=[];
const treeCells=[];

/* ================================================================= TRACK ==
   The circuit is authored as a closed polyline in the units of the layout
   sketch, run through a centripetal Catmull-Rom, then uniformly scaled so the
   lap comes out at LAP_TARGET metres. Everything downstream — road ribbon,
   kerbs, posts, trees, terrain flattening, the car itself — is placed in
   (s, lateral) track space rather than world x/z, which is what lets the
   straight road become a circuit at all.

   Index 0 is the start of the main straight; index 4 is its far end.        */
const TRACK_PX=[
  [ 470,730],[ 620,730],[ 780,730],[ 900,730],[ 995,730],   // main straight
  [1092,712],[1148,662],[1128,606],[1062,566],[1020,528],   // right-hand loop + tight left
  [1058,486],[1116,442],[1148,414],[1132,370],[1052,330],   // back out and up
  [ 958,312],[ 868,332],[ 778,368],[ 690,398],[ 640,412],   // long top sweep
  [ 598,398],[ 558,352],[ 520,300],[ 458,282],[ 400,318],   // rise to the top-left crest
  [ 379,390],[ 402,440],[ 452,488],[ 424,536],[ 390,590],   // left flank with the inward kink
  [ 382,646],[ 406,692]                                     // final left onto the straight
];
const STRAIGHT_END_I = 4;

let LAP=0, NSAMP=0, DS=1;
let sx=null, sz=null, tanx=null, tanz=null, kap=null;
let START_S=6, FINISH_S=0;
let TRK_MINX=0, TRK_MAXX=0, TRK_MINZ=0, TRK_MAXZ=0;

(function buildTrack(){
  const pts=TRACK_PX.map(p=>new THREE.Vector3(p[0],0,p[1]));
  let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;
  pts.forEach(p=>{mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mnz=Math.min(mnz,p.z);mxz=Math.max(mxz,p.z);});
  const cx=(mnx+mxx)/2, cz=(mnz+mxz)/2;
  pts.forEach(p=>{p.x-=cx;p.z-=cz;});

  // centripetal parameterisation: the tight kinks on the left flank and the
  // right-hand loop would cusp or loop back under the uniform variant.
  const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal',0.5);

  const D=24000;
  const px=new Float64Array(D+1), pz=new Float64Array(D+1), cum=new Float64Array(D+1);
  const v=new THREE.Vector3();
  for(let i=0;i<=D;i++){ curve.getPoint(i/D,v); px[i]=v.x; pz[i]=v.z; }
  for(let i=0;i<D;i++) cum[i+1]=cum[i]+Math.hypot(px[i+1]-px[i],pz[i+1]-pz[i]);

  // one uniform scale takes the sketch to metres; the lap is then exact
  const SC=LAP_TARGET/cum[D];
  for(let i=0;i<=D;i++){ px[i]*=SC; pz[i]*=SC; cum[i]*=SC; }
  LAP=LAP_TARGET; NSAMP=Math.round(LAP); DS=LAP/NSAMP;

  sx=new Float32Array(NSAMP); sz=new Float32Array(NSAMP);
  let j=0;
  for(let i=0;i<NSAMP;i++){
    const t=i*DS;
    while(j<D-1 && cum[j+1]<t) j++;
    const f=(t-cum[j])/Math.max(cum[j+1]-cum[j],1e-9);
    sx[i]=px[j]+(px[j+1]-px[j])*f;
    sz[i]=pz[j]+(pz[j+1]-pz[j])*f;
  }

  // tangents by central difference on the arclength-uniform samples
  tanx=new Float32Array(NSAMP); tanz=new Float32Array(NSAMP);
  for(let i=0;i<NSAMP;i++){
    const a=(i-1+NSAMP)%NSAMP, b=(i+1)%NSAMP;
    let dx=sx[b]-sx[a], dz=sz[b]-sz[a];
    const L=Math.hypot(dx,dz)||1;
    tanx[i]=dx/L; tanz[i]=dz/L;
  }
  /* Signed curvature, +ve = turning left. theta = atan2(tx,tz) is the yaw about
     +y, and increasing it swings +z toward +x — which is the driver's left,
     because with forward = +z and up = +y the car's local +x points left.   */
  const raw=new Float32Array(NSAMP);
  for(let i=0;i<NSAMP;i++){
    const b=(i+1)%NSAMP;
    let d=Math.atan2(tanx[b],tanz[b])-Math.atan2(tanx[i],tanz[i]);
    while(d> Math.PI) d-=Math.PI*2;
    while(d<-Math.PI) d+=Math.PI*2;
    raw[i]=d/DS;
  }
  // box-filter it: the raw signal is noisy enough to make the kerbs stutter
  // and the steering wheel jitter on a straight.
  kap=new Float32Array(NSAMP);
  const R=7;
  for(let i=0;i<NSAMP;i++){
    let a=0;
    for(let k=-R;k<=R;k++) a+=raw[(i+k+NSAMP)%NSAMP];
    kap[i]=a/(R*2+1);
  }

  for(let i=0;i<NSAMP;i++){
    if(sx[i]<TRK_MINX||i===0)TRK_MINX=sx[i];
    if(sx[i]>TRK_MAXX||i===0)TRK_MAXX=sx[i];
    if(sz[i]<TRK_MINZ||i===0)TRK_MINZ=sz[i];
    if(sz[i]>TRK_MAXZ||i===0)TRK_MAXZ=sz[i];
  }

  // s of the far end of the main straight, found by matching the control point
  const ex=(TRACK_PX[STRAIGHT_END_I][0]-cx)*SC, ez=(TRACK_PX[STRAIGHT_END_I][1]-cz)*SC;
  let best=1e18, bi=0;
  for(let i=0;i<NSAMP;i++){
    const d=(sx[i]-ex)*(sx[i]-ex)+(sz[i]-ez)*(sz[i]-ez);
    if(d<best){best=d;bi=i;}
  }
  // start/finish sits two thirds down the straight — past the middle, with
  // enough road left to still be braking for turn one after it.
  FINISH_S = bi*DS*0.68;
  START_S  = 6;                      // lights out at the very start of the straight
})();

const _ta=new THREE.Vector2(), _td=new THREE.Vector2();
function trackAt(s,out){
  let u=s/DS; u%=NSAMP; if(u<0)u+=NSAMP;
  const i=u|0, f=u-i, j=(i+1)%NSAMP;
  out.x=sx[i]+(sx[j]-sx[i])*f;
  out.y=sz[i]+(sz[j]-sz[i])*f;
  return out;
}
/* tangent lerped as a vector then renormalised — interpolating the angle
   instead would need wrap handling and still misbehave through pi. */
function trackDir(s,out){
  let u=s/DS; u%=NSAMP; if(u<0)u+=NSAMP;
  const i=u|0, f=u-i, j=(i+1)%NSAMP;
  let x=tanx[i]+(tanx[j]-tanx[i])*f, z=tanz[i]+(tanz[j]-tanz[i])*f;
  const L=Math.hypot(x,z)||1;
  out.x=x/L; out.y=z/L;
  return out;
}
function trackK(s){
  let u=s/DS; u%=NSAMP; if(u<0)u+=NSAMP;
  const i=u|0, f=u-i, j=(i+1)%NSAMP;
  return kap[i]+(kap[j]-kap[i])*f;
}
/* world point at (s, lateral) — +lateral is the driver's left */
function trackPos(s,lat,y,out){
  trackAt(s,_ta); trackDir(s,_td);
  out.set(_ta.x+_td.y*lat, y, _ta.y-_td.x*lat);
  return out;
}

/* ---- distance-to-centreline field -------------------------------------
   Terrain flattening and tree rejection both need "how far is this world
   point from the track", tens of thousands of times. A uniform bucket grid
   over decimated centreline samples answers it in a fixed 7x7 cell scan,
   which is exact out to 3 cells (120 m) and saturates beyond — and 120 m is
   further than anything downstream cares about.                           */
const DCELL=40, DRING=3;
let dgX0=0, dgZ0=0, dgNX=0, dgNZ=0, dgBins=null;
(function buildDistGrid(){
  const pad=DCELL*(DRING+1);
  dgX0=TRK_MINX-pad; dgZ0=TRK_MINZ-pad;
  dgNX=Math.ceil((TRK_MAXX-TRK_MINX+pad*2)/DCELL);
  dgNZ=Math.ceil((TRK_MAXZ-TRK_MINZ+pad*2)/DCELL);
  dgBins=new Array(dgNX*dgNZ);
  for(let i=0;i<NSAMP;i+=4){
    const cx=Math.floor((sx[i]-dgX0)/DCELL), cz=Math.floor((sz[i]-dgZ0)/DCELL);
    if(cx<0||cz<0||cx>=dgNX||cz>=dgNZ) continue;
    const k=cz*dgNX+cx;
    (dgBins[k]||(dgBins[k]=[])).push(i);
  }
})();
const DFAR=1e6;
function distToTrack(x,z){
  const cx=Math.floor((x-dgX0)/DCELL), cz=Math.floor((z-dgZ0)/DCELL);
  let best=DFAR;
  for(let a=-DRING;a<=DRING;a++){
    const gz=cz+a; if(gz<0||gz>=dgNZ) continue;
    for(let b=-DRING;b<=DRING;b++){
      const gx=cx+b; if(gx<0||gx>=dgNX) continue;
      const bin=dgBins[gz*dgNX+gx]; if(!bin) continue;
      for(let n=0;n<bin.length;n++){
        const i=bin[n], dx=sx[i]-x, dz=sz[i]-z;
        const d=dx*dx+dz*dz;
        if(d<best) best=d;
      }
    }
  }
  return best===DFAR?DFAR:Math.sqrt(best);
}

/* terrain: dead flat across the whole circuit and its run-off, rolling only
   once you are well clear of the track. The track surface itself is flat. */
function terrainH(x,z){
  const k=smoothstep(34,115,distToTrack(x,z));
  if(k<=0) return 0;
  const big=(fbm(x*0.0022,z*0.0022,4)-0.5)*46;
  const mid=(fbm(x*0.011, z*0.011, 3)-0.5)*7;
  return (big+mid)*k;
}

/* ------------------------------------------------------------- decode geo */
let GEO_BUF=null;      // trees.bin, fetched before the trees are built
function buildGeometry(rec, buf){
  const n=rec.count;
  const qp=new Int16Array(buf, rec.pos, n*3);
  const qn=new Int8Array (buf, rec.nrm, n*3);
  const qu=new Uint16Array(buf, rec.uv,  n*2);
  const pos=new Float32Array(n*3), nrm=new Float32Array(n*3), uv=new Float32Array(n*2);
  const pmin=rec.pmin, prng=rec.prng, umin=rec.umin, urng=rec.urng;
  for(let i=0;i<n;i++){
    for(let a=0;a<3;a++){
      const t=(qp[i*3+a]+32767)/65534;
      pos[i*3+a]=pmin[a]+t*prng[a];
      nrm[i*3+a]=qn[i*3+a]/127;
    }
    uv[i*2  ]=umin[0]+(qu[i*2  ]/65535)*urng[0];
    uv[i*2+1]=umin[1]+(qu[i*2+1]/65535)*urng[1];
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  // r128 only multiplies vColor into the fragment when USE_COLOR is defined --
  // instanceColor alone is written in the vertex stage and then dropped. A
  // neutral white colour attribute turns USE_COLOR on so the per-tree tint
  // actually survives to the fragment. Without it every tree renders identical;
  // with vertexColors but no attribute, every tree renders black.
  const white=new Float32Array(n*3); white.fill(1);
  g.setAttribute('color',   new THREE.BufferAttribute(white,3));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(buf, rec.idx, rec.icount),1));
  g.computeBoundingSphere();
  return g;
}

/* ------------------------------------------------------- procedural maps */
function wrapDrawRect(ctx,W,H,x,y,pad,fn){
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
    if(dx&&Math.min(x,W-x)>pad) continue;
    if(dy&&Math.min(y,H-y)>pad) continue;
    ctx.save(); ctx.translate(x+dx*W, y+dy*H); fn(ctx); ctx.restore();
  }
}
function wrapDraw(ctx,size,x,y,fn){ wrapDrawRect(ctx,size,size,x,y,24,fn); }
function groundTexture(){
  const S=512, c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d');
  g.fillStyle='#545c30'; g.fillRect(0,0,S,S);
  const rand=mulberry32(7);
  const blotch=['#4a5329','#5d6634','#494f2a','#6a6f3c','#5b5330','#41482a'];
  for(let i=0;i<520;i++){
    const x=rand()*S,y=rand()*S,r=8+rand()*46;
    g.globalAlpha=.16+rand()*.22; g.fillStyle=blotch[(rand()*blotch.length)|0];
    wrapDraw(g,S,x,y,ctx=>{ctx.beginPath();ctx.ellipse(0,0,r,r*(.5+rand()*.8),rand()*6.28,0,6.28);ctx.fill();});
  }
  const blade=['#6e7a3c','#7d8846','#5a6430','#465027','#8a8f4e','#6b5f34'];
  g.lineCap='round';
  for(let i=0;i<9000;i++){
    const x=rand()*S,y=rand()*S,a=rand()*6.283,len=2+rand()*6;
    g.globalAlpha=.34+rand()*.5; g.strokeStyle=blade[(rand()*blade.length)|0];
    g.lineWidth=.8+rand()*1.3;
    wrapDraw(g,S,x,y,ctx=>{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.stroke();});
  }
  g.globalAlpha=1;
  const id=g.getImageData(0,0,S,S), d=id.data;
  for(let i=0;i<d.length;i+=4){
    const n=(rand()-.5)*26; d[i]+=n; d[i+1]+=n*1.05; d[i+2]+=n*.7;
  }
  g.putImageData(id,0,0);
  return c;
}
/* multiplied over the asphalt: wheel polish, patch repairs, hairline cracks */
function wearTexture(){
  const W=256,H=1024, c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);
  const rand=mulberry32(21);
  const uOf = x => (x/(ROAD_HALF*2)+0.5)*W;  // metres from centre -> px
  // polished wheel paths (lighter, worn smooth)
  [-2.6,-0.85,0.85,2.6].forEach(m=>{
    const gr=g.createLinearGradient(uOf(m-0.95),0,uOf(m+0.95),0);
    gr.addColorStop(0,'rgba(255,255,255,0)');
    gr.addColorStop(.5,'rgba(255,255,255,.85)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.globalCompositeOperation='lighten';
    g.fillRect(uOf(m-0.95),0,uOf(m+0.95)-uOf(m-0.95),H);
  });
  g.globalCompositeOperation='source-over';
  // dark centre grime + edge grime
  [[0,0.55,.20],[-ROAD_HALF+0.4,0.9,.26],[ROAD_HALF-0.4,0.9,.26]].forEach(([m,w,a])=>{
    const gr=g.createLinearGradient(uOf(m-w),0,uOf(m+w),0);
    gr.addColorStop(0,'rgba(0,0,0,0)');
    gr.addColorStop(.5,'rgba(0,0,0,'+a+')');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(uOf(m-w),0,uOf(m+w)-uOf(m-w),H);
  });
  // patch repairs — drawn wrapped so the strip tiles end-to-end
  for(let i=0;i<9;i++){
    const x=rand()*W, y=rand()*H, w=30+rand()*90, h=40+rand()*160;
    const al=.10+rand()*.13, fill=rand()>.5?'#000':'#fff';
    wrapDrawRect(g,W,H,x,y,180,ctx=>{
      ctx.globalAlpha=al; ctx.fillStyle=fill; ctx.fillRect(-w/2,-h/2,w,h);
    });
  }
  // hairline cracks
  g.globalAlpha=1;
  for(let i=0;i<34;i++){
    const x0=rand()*W, y0=rand()*H, lw=.6+rand()*1.1;
    const steps=6+(rand()*10|0), pts=[[0,0]];
    let px=0,py=0;
    for(let s=0;s<steps;s++){ px+=(rand()-.5)*34; py+=(rand()-.35)*40; pts.push([px,py]); }
    wrapDrawRect(g,W,H,x0,y0,420,ctx=>{
      ctx.strokeStyle='rgba(0,0,0,.30)'; ctx.lineWidth=lw;
      ctx.beginPath(); ctx.moveTo(0,0);
      for(const p of pts) ctx.lineTo(p[0],p[1]);
      ctx.stroke();
    });
  }
  // longitudinal seam where the two paving lanes meet
  g.globalAlpha=1;
  g.strokeStyle='rgba(0,0,0,.34)'; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(uOf(0),0); g.lineTo(uOf(0),H); g.stroke();
  return c;
}

let pending=0, loaded=0;
const bar=document.querySelector('#bar i');
function texture(src, srgb, rw, rh){
  pending++;
  const t=new THREE.Texture();
  t.userData={clones:[]};   // r128 does not create userData on Texture
  const img=new Image();
  img.onload=()=>{
    t.image=img; t.needsUpdate=true;
    // clones made before the image arrived are still empty -- fill them now
    for(const c of (t.userData.clones||[])){ c.image=img; c.needsUpdate=true; }
    loaded++;
    bar.style.width=Math.round(loaded/pending*100)+'%';
    if(loaded>=pending) ready();
  };
  img.src=src;
  t.wrapS = rw||THREE.RepeatWrapping;
  t.wrapT = rh||THREE.RepeatWrapping;
  t.anisotropy = MAXANISO;
  if(srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}
/* Texture.clone() copies .image by reference, so a clone taken before the
   image has decoded stays permanently blank. Register it instead. */
function cloneTex(t){
  const c=t.clone();
  c.needsUpdate=true;
  if(t.image){ c.image=t.image; return c; }
  if(!t.userData) t.userData={};
  if(!t.userData.clones) t.userData.clones=[];
  t.userData.clones.push(c);
  return c;
}

}).catch(e=>{

(function buildTerrain(){

/* ------------------------------------------------------------------- road */
const roadGroup=new THREE.Group(); scene.add(roadGroup);

/* Every texture that runs along the track has to close on itself at the
   start/finish, so each nominal tile length is rounded to the nearest whole
   number of repeats per lap. Same idea as the old 180 m road snap, but now
   the constraint is one lap instead of one recycle step. */
const fitTile = L => LAP/Math.round(LAP/L);
const ASPH_TILE = fitTile(3.0);
const GRAV_TILE = fitTile(2.4);
const WEAR_TILE = fitTile(60);

const RSTEP = 2;                       // metres between ribbon rings
const RN    = Math.round(LAP/RSTEP);

/* A flat ribbon swept along the centreline between two lateral offsets.
   la is the left edge, lb the right; winding is set so the face points up. */
function ribbonGeo(la, lb, y, ua, ub, vTile, wear){
  const n=RN+1;                        // the closing ring repeats ring 0 at s=LAP
  const pos=new Float32Array(n*2*3), nrm=new Float32Array(n*2*3),
        uv =new Float32Array(n*2*2);
  const aw = wear ? new Float32Array(n*2*2) : null;
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  for(let i=0;i<n;i++){
    const s=i*RSTEP;
    trackAt(s,p); trackDir(s,d);
    const nx=d.y, nz=-d.x;             // unit left normal
    const v=s/vTile;
    for(let k=0;k<2;k++){
      const lat=k?lb:la, o=(i*2+k);
      pos[o*3  ]=p.x+nx*lat;
      pos[o*3+1]=y;
      pos[o*3+2]=p.y+nz*lat;
      nrm[o*3+1]=1;
      uv[o*2  ]=k?ub:ua;
      uv[o*2+1]=v;
      if(aw){ aw[o*2]=k?0:1; aw[o*2+1]=s/WEAR_TILE; }
    }
  }
  // n*2 vertices; stay on 16-bit indices while that fits, so the ribbon does
  // not silently depend on OES_element_index_uint
  const idx=(n*2<=65536)?new Uint16Array(RN*6):new Uint32Array(RN*6);
  for(let i=0;i<RN;i++){
    const a=i*2, b=a+1, cc=a+2, dd=a+3;
    idx[i*6  ]=a; idx[i*6+1]=b; idx[i*6+2]=cc;
    idx[i*6+3]=b; idx[i*6+4]=dd; idx[i*6+5]=cc;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  if(aw) g.setAttribute('aWear',new THREE.BufferAttribute(aw,2));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeBoundingSphere();
  return g;
}

(function buildRoad(){
  texRoad.repeat.set(1,1);             // tiling is baked into the ribbon UVs

  const asphalt=new THREE.MeshStandardMaterial({
    map:texRoad, bumpMap:texRoad, bumpScale:0.035,
    roughnessMap:texRoad, roughness:0.97, metalness:0,
    color:sRGB(0xa8a8a8)
  });
  /* The wear strip needs its own 0..1 cross-track coordinate (the asphalt uv.x
     runs 0..3 for tiling) and its own much longer v period, so it rides on a
     dedicated attribute rather than being derived from uv. */
  asphalt.onBeforeCompile=sh=>{
    sh.uniforms.uWear={value:texWear};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nattribute vec2 aWear;\nvarying vec2 vWear;')
      .replace('#include <uv_vertex>','#include <uv_vertex>\nvWear=aWear;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform sampler2D uWear;\nvarying vec2 vWear;')
      .replace('#include <map_fragment>',
        '#include <map_fragment>\nvec3 wr=texture2D(uWear,vWear).rgb;\ndiffuseColor.rgb*=mix(vec3(1.0),wr,0.85);');
  };
  const road=new THREE.Mesh(
    ribbonGeo(ROAD_HALF,-ROAD_HALF, 0.12, 0,3, ASPH_TILE, true), asphalt);
  road.receiveShadow=true; road.frustumCulled=false;
  roadGroup.add(road);

  // gravel shoulders
  const gravel=new THREE.MeshStandardMaterial({map:cloneTex(texRock),roughness:1,metalness:0,color:sRGB(0x8d8578)});
  gravel.map.wrapS=gravel.map.wrapT=THREE.RepeatWrapping;
  gravel.map.repeat.set(1,1); gravel.map.encoding=THREE.sRGBEncoding;
  gravel.map.anisotropy=MAXANISO;
  [[SHOULDER,ROAD_HALF],[-ROAD_HALF,-SHOULDER]].forEach(([a,b])=>{
    const m=new THREE.Mesh(ribbonGeo(a,b,0.10,0,1.1,GRAV_TILE,false),gravel);
    m.receiveShadow=true; m.frustumCulled=false;
    roadGroup.add(m);
  });

  // edge lines
  const paint=new THREE.MeshStandardMaterial({
    color:sRGB(0xdedbd0), roughness:0.7, metalness:0,
    polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4
  });
  [[LANE_EDGE+0.075,LANE_EDGE-0.075],[-LANE_EDGE+0.075,-LANE_EDGE-0.075]].forEach(([a,b])=>{
    const m=new THREE.Mesh(ribbonGeo(a,b,0.14,0,1,ASPH_TILE,false),paint);
    m.frustumCulled=false;
    roadGroup.add(m);
  });

  /* Kerbs. Laid on the inside of anything tighter than a 150 m radius, as
     alternating red and white slabs — two instanced meshes for the whole
     circuit. The inside of a turn is the +lateral side when the signed
     curvature is positive, which is exactly how kap is defined. */
  const KSTEP=1.7, KW=1.15, KCEN=LANE_EDGE+0.10+KW/2;
  const kerbGeo=new THREE.BoxGeometry(KW,0.09,KSTEP*0.94);
  const redMat  =new THREE.MeshStandardMaterial({color:sRGB(0xb8321f),roughness:0.62});
  const whiteMat=new THREE.MeshStandardMaterial({color:sRGB(0xe6e3d8),roughness:0.62});
  const slots=[];
  for(let s=0;s<LAP;s+=KSTEP){
    const k=trackK(s+KSTEP*0.5);
    if(Math.abs(k)<1/150) continue;
    slots.push({s, side:k>0?1:-1, n:slots.length});
  }
  const nRed=Math.ceil(slots.length/2), nWhite=slots.length-nRed;
  const redM  =new THREE.InstancedMesh(kerbGeo,redMat,  Math.max(nRed,1));
  const whiteM=new THREE.InstancedMesh(kerbGeo,whiteMat,Math.max(nWhite,1));
  const mtx=new THREE.Matrix4(), q=new THREE.Quaternion(),
        v3=new THREE.Vector3(), one=new THREE.Vector3(1,1,1),
        p2=new THREE.Vector2(), d2=new THREE.Vector2();
  let ri=0, wi=0;
  slots.forEach((sl,i)=>{
    trackAt(sl.s,p2); trackDir(sl.s,d2);
    const lat=sl.side*KCEN;
    v3.set(p2.x+d2.y*lat, 0.155, p2.y-d2.x*lat);
    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(d2.x,d2.y));
    mtx.compose(v3,q,one);
    if(i&1){ whiteM.setMatrixAt(wi++,mtx); } else { redM.setMatrixAt(ri++,mtx); }
  });
  // unused tail instances would otherwise render as unit cubes at the origin
  mtx.compose(v3.set(0,-500,0),q.identity(),one);
  for(let i=ri;i<redM.count;i++)   redM.setMatrixAt(i,mtx);
  for(let i=wi;i<whiteM.count;i++) whiteM.setMatrixAt(i,mtx);
  redM.instanceMatrix.needsUpdate=whiteM.instanceMatrix.needsUpdate=true;
  redM.frustumCulled=whiteM.frustumCulled=false;
  redM.receiveShadow=whiteM.receiveShadow=true;
  roadGroup.add(redM,whiteM);

  // reflective marker posts, outside the gravel on both sides
  const postGeo=new THREE.BoxGeometry(0.11,1.05,0.07); postGeo.translate(0,0.525,0);
  const postMat=new THREE.MeshStandardMaterial({color:sRGB(0xe8e5da),roughness:0.6});
  const capMat =new THREE.MeshStandardMaterial({color:sRGB(0xb52d1c),roughness:0.45,
                                                emissive:sRGB(0x521008),emissiveIntensity:.5});
  const capGeo=new THREE.BoxGeometry(0.09,0.16,0.075); capGeo.translate(0,0.86,0);
  const cnt=Math.floor(LAP/45)*2;
  const posts=new THREE.InstancedMesh(postGeo,postMat,cnt);
  const caps =new THREE.InstancedMesh(capGeo, capMat, cnt);
  posts.castShadow=true;
  let k=0;
  for(let i=0;i<cnt/2;i++) for(const sgn of [-1,1]){
    const s=i*45;
    trackAt(s,p2); trackDir(s,d2);
    const lat=sgn*(SHOULDER+0.5);
    v3.set(p2.x+d2.y*lat, 0.02, p2.y-d2.x*lat);
    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(d2.x,d2.y));
    mtx.compose(v3,q,one);
    posts.setMatrixAt(k,mtx); caps.setMatrixAt(k,mtx); k++;
  }
  posts.instanceMatrix.needsUpdate=true; caps.instanceMatrix.needsUpdate=true;
  posts.frustumCulled=false; caps.frustumCulled=false;
  posts.userData.casts=true; shadowCasters.push(posts);
  roadGroup.add(posts,caps);
})();

  }
})();

/* -------------------------------------------------------------- mountains */
const mountainGroup=new THREE.Group(); scene.add(mountainGroup);
(function buildMountains(){
  const rand=mulberry32(90210);
  const chunks=[];
  let vTotal=0;

  function pyramid(R,H,seed){
    // square-based pyramid, subdivided and roughened into crags.
    // displacement stays modest so the four faces still read as a pyramid.
    let g=new THREE.ConeGeometry(R,H,4,10,false);
    g.translate(0,H/2,0);
    const p=g.attributes.position;
    const r2=mulberry32(seed);
    const ph=r2()*100;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
      const t=clamp(y/H,0,1);
      // pin the apex and the base ring, bulge the middle
      const env=Math.sin(Math.PI*t)*0.9+0.1;
      const n1=fbm(x*0.012+ph, z*0.012+ph,4)-0.5;
      const n2=fbm(x*0.05+ph,  z*0.05+ph, 3)-0.5;
      const d=(n1*0.16+n2*0.05)*env;
      const len=Math.hypot(x,z)||1;
      p.setX(i,x+(x/len)*d*R*0.85);
      p.setZ(i,z+(z/len)*d*R*0.85);
      p.setY(i,y+(n2*0.5)*env*H*0.05);
    }
    g=g.toNonIndexed();
    return g;
  }

  function faceUVsAndColour(g,H,uvScale,uOff,vOff,seed){
    g.computeVertexNormals();
    const p=g.attributes.position, nr=g.attributes.normal;
    const uv=new Float32Array(p.count*2), col=new Float32Array(p.count*3);
    // Near-white tints so the photo supplies the colour. A grey ramp here
    // multiplies the texture down to mush.
    const rock=new THREE.Color(1.14,1.09,1.02);   // sun-facing rock, slightly warm
    const dark=new THREE.Color(0.50,0.51,0.58);   // crevices, cool bounce light
    const c=new THREE.Color();
    const rr=mulberry32(seed);
    const jx=rr()*80, jz=rr()*80;
    for(let f=0;f<p.count;f+=3){
      const nx=Math.abs(nr.getX(f)), ny=Math.abs(nr.getY(f)), nz=Math.abs(nr.getZ(f));
      for(let k=0;k<3;k++){
        const i=f+k, x=p.getX(i), y=p.getY(i), z=p.getZ(i);
        let u,v;
        if(ny>nx&&ny>nz){ u=x; v=z; }
        else if(nx>nz){   u=z; v=y; }
        else {            u=x; v=y; }
        uv[i*2]  =(u+jx)*uvScale+uOff;
        uv[i*2+1]=(v+jz)*uvScale+vOff;
        const t=y/H;
        const grit=fbm(x*0.06+jx, z*0.06+jz,3);
        // shade by height, grit and how much the face points at the sky
        c.copy(dark).lerp(rock, clamp(t*0.55+grit*0.62+ny*0.30,0,1));
        col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
      }
    }
    g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    g.setAttribute('color',new THREE.BufferAttribute(col,3));
    return g;
  }

  function place(x,z,R,H,seed){
    const rr=mulberry32(seed+7);
    const uvS=0.0030+rr()*0.0015, uo=rr()*20, vo=rr()*20;
    let g=pyramid(R,H,seed);
    g=faceUVsAndColour(g,H,uvS,uo,vo,seed+3);
    g.rotateY(rr()*Math.PI*2);
    // sunk well below the rolling ground so no base ever pokes into view
    g.translate(x, terrainH(x,z)-H*0.05-26, z);
    chunks.push(g); vTotal+=g.attributes.position.count;
  }

  /* A ring right around the circuit, offset from the track's own bounding box
     so the peaks stay a consistent distance out on every side rather than
     bunching at the narrow ends. */
  const HX=(TRK_MAXX-TRK_MINX)/2, HZ=(TRK_MAXZ-TRK_MINZ)/2;
  function ringPos(a,near,depth,r){
    const g=near+r*depth;
    return [Math.cos(a)*(HX+g), Math.sin(a)*(HZ+g)];
  }
  // inner ridgeline — the peaks you actually see over the treetops
  for(let i=0;i<30;i++){
    const a=(i/30)*Math.PI*2+rand()*0.12;
    const [x,z]=ringPos(a,560,420,rand());
    place(x,z,150+rand()*170, 200+rand()*250, 1000+i);
  }
  // outer wall — taller, hazier
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2+0.11+rand()*0.14;
    const [x,z]=ringPos(a,1080,900,rand());
    place(x,z,220+rand()*260, 330+rand()*380, 2000+i);
  }
  // foothills tucked in front, breaking up the base of the ridge
  for(let i=0;i<22;i++){
    const a=rand()*Math.PI*2;
    const [x,z]=ringPos(a,400,300,rand());
    place(x,z,70+rand()*70, 55+rand()*110, 3000+i);
  }

  // merge into one draw call
  const pos=new Float32Array(vTotal*3), nrm=new Float32Array(vTotal*3),
        uv =new Float32Array(vTotal*2), col=new Float32Array(vTotal*3);
  let o=0;
  chunks.forEach(g=>{
    pos.set(g.attributes.position.array,o*3);
    nrm.set(g.attributes.normal.array,  o*3);
    uv .set(g.attributes.uv.array,      o*2);
    col.set(g.attributes.color.array,   o*3);
    o+=g.attributes.position.count;
  });
  const G=new THREE.BufferGeometry();
  G.setAttribute('position',new THREE.BufferAttribute(pos,3));
  G.setAttribute('normal',  new THREE.BufferAttribute(nrm,3));
  G.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  G.setAttribute('color',   new THREE.BufferAttribute(col,3));

  const rockMap=cloneTex(texRock);
  rockMap.wrapS=rockMap.wrapT=THREE.RepeatWrapping;
  rockMap.encoding=THREE.sRGBEncoding; rockMap.anisotropy=MAXANISO;
  const m=new THREE.MeshStandardMaterial({
    map:rockMap, vertexColors:true, roughness:0.98, metalness:0, flatShading:true
  });
  const mesh=new THREE.Mesh(G,m);
  mesh.frustumCulled=false;
  mountainGroup.add(mesh);
})();

/* -------------------------------------------------------------------- car */
/* The GLB was rebuilt so each wheel is its own node sitting exactly on its
   axle, with the mesh recentred -- so spinning a wheel is just rotation.x. */
const carGroup=new THREE.Group(); scene.add(carGroup);
const wheels=[];
let carObj=null, wheelR=0.357, steer=null, wingL=null, wingR=null;
const STEER_AXIS=new THREE.Vector3(0,0.456,0.890).normalize();
const CAR_LEN=5.60;                     // 2025-spec car length, metres
const WHEELBASE=3.60;

(function loadCar(){
  pending++;
  const loader=new THREE.GLTFLoader();
  if(self.MeshoptDecoder) loader.setMeshoptDecoder(self.MeshoptDecoder);
  loader.load(ASSETS.car, gltf=>{
    const car=gltf.scene;
    car.updateMatrixWorld(true);
    const b0=new THREE.Box3().setFromObject(car);
    car.scale.setScalar(CAR_LEN/(b0.max.z-b0.min.z));
    car.updateMatrixWorld(true);
    const b1=new THREE.Box3().setFromObject(car);
    car.position.y=-b1.min.y;           // drop the tyres onto the deck
    carGroup.add(car); carObj=car;

    for(const n of ['Wheel_FL','Wheel_FR','Wheel_RL','Wheel_RR']){
      const w=car.getObjectByName(n);
      if(!w) continue;
      w.userData.steers = (n==='Wheel_FL'||n==='Wheel_FR');
      wheels.push(w);
    }
    /* gltfpack's shared quantisation grid leaves each mesh at its authored
       position, so a pivot node's child still carries the full offset.
       Cancel it and the node rotates about its own origin.                */
    const pivotFix=o=>{
      if(!o) return null;
      const c=o.position.clone();
      o.children.forEach(ch=>ch.position.sub(c));
      return o;
    };
    steer=pivotFix(car.getObjectByName('SteerWheel'));
    // column axis measured off the rim: tilted back 27 deg, like the real car
    if(steer) STEER_AXIS.set(0,0.456,0.890).normalize();
    // the over-wheel winglets are mounted to the uprights: they steer but
    // must not roll with the tyre, so they get their own pivot nodes
    wingL=pivotFix(car.getObjectByName('Wing_FL'));
    wingR=pivotFix(car.getObjectByName('Wing_FR'));
    if(wheels.length){
      carGroup.updateMatrixWorld(true);
      const wb=new THREE.Box3().setFromObject(wheels[0]);
      const r=(wb.max.y-wb.min.y)/2;
      if(r>0.05) wheelR=r;              // rolling radius, for the spin rate
    }
    car.traverse(o=>{
      if(!o.isMesh) return;
      o.castShadow=true; o.receiveShadow=true;
      o.userData.casts=true; shadowCasters.push(o);
      const ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(m=>{ if(m && m.map) m.map.anisotropy=MAXANISO; });
    });
    carGroup.position.y=0.125;          // road deck sits at 0.12
    loaded++; bar.style.width=Math.round(loaded/pending*100)+'%';
    if(loaded>=pending) ready();
  }, undefined, err=>{
    console.error('car failed to load',err);
    loaded++; if(loaded>=pending) ready();
  });
})();

/* model-space point -> world, so cameras can be bolted to real car features */
const _cp=new THREE.Vector3();
function carPoint(x,y,z){
  _cp.set(x,y,z);
  if(carObj) return carObj.localToWorld(_cp);
  return _cp.set(carGroup.position.x,y,carGroup.position.z);
}

/* ------------------------------------------------------------------ trees */
const windU={value:0};
const treeGroup=new THREE.Group(); scene.add(treeGroup);

const TREE_MARGIN=650;                  // how far past the circuit the forest runs
const TCELL=500;                        // culling bucket size

function makeTrees(){
  const buf=GEO_BUF;
  const man=ASSETS.geoManifest;
  if(!buf||!man) return;

  const barkMat=new THREE.MeshStandardMaterial({
    map:texBark, normalMap:texBarkN, roughness:0.94, metalness:0,
    normalScale:new THREE.Vector2(1.1,1.1), vertexColors:true
  });
  const leafMat=new THREE.MeshStandardMaterial({
    map:texLeaf, alphaTest:0.5, side:THREE.DoubleSide,
    roughness:0.86, metalness:0, vertexColors:true
  });
  [barkMat,leafMat].forEach((m,idx)=>{
    m.onBeforeCompile=sh=>{
      sh.uniforms.uWind=windU;
      sh.vertexShader='uniform float uWind;\n'+sh.vertexShader.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
         #ifdef USE_INSTANCING
           vec3 wp=(instanceMatrix*vec4(transformed,1.0)).xyz;
         #else
           vec3 wp=transformed;
         #endif
         float amp=${idx===0?'0.010':'0.045'};
         float hgt=max(transformed.y,0.0);
         float s=sin(uWind*1.7+wp.x*0.22+wp.z*0.17)+0.45*sin(uWind*3.1+wp.x*0.55);
         transformed.x+=s*amp*hgt;
         transformed.z+=s*amp*hgt*0.55;`
      );
    };
  });

  const rand=mulberry32(20260727);
  const kinds=['small','medium','large'];
  const share={small:0.36, medium:0.36, large:0.28};

  /* Rejection sampling over the whole map — inside the circuit as well as
     outside it, exactly as the layout shows — with anything closer than
     TREE_CLEAR to the centreline thrown away so the run-off stays open. */
  const X0=TRK_MINX-TREE_MARGIN, X1=TRK_MAXX+TREE_MARGIN;
  const Z0=TRK_MINZ-TREE_MARGIN, Z1=TRK_MAXZ+TREE_MARGIN;
  const NX=Math.ceil((X1-X0)/TCELL), NZ=Math.ceil((Z1-Z0)/TCELL);

  const cells=new Array(NX*NZ);
  const WANT=7000;                      // ~1100/km2 — reads as forest, not scrub
  let tries=0, made=0;
  while(made<WANT && tries<WANT*6){
    tries++;
    const x=X0+rand()*(X1-X0), z=Z0+rand()*(Z1-Z0);
    if(distToTrack(x,z)<TREE_CLEAR) continue;
    const r=rand();
    const kind = r<share.small?'small':(r<share.small+share.medium?'medium':'large');
    const cx=clamp(Math.floor((x-X0)/TCELL),0,NX-1);
    const cz=clamp(Math.floor((z-Z0)/TCELL),0,NZ-1);
    const k=cz*NX+cx;
    (cells[k]||(cells[k]={small:[],medium:[],large:[]}))[kind].push({
      x, z,
      s:0.82+rand()*0.55,
      ry:rand()*Math.PI*2,
      tilt:(rand()-0.5)*0.09,
      tint:0.80+rand()*0.34,
      warm:(rand()-0.5)*0.16
    });
    made++;
  }

  const geos={};
  kinds.forEach(k=>{ geos[k]={bark:buildGeometry(man[k].bark,buf), leaf:buildGeometry(man[k].leaf,buf)}; });
  const leafDepth=new THREE.MeshDepthMaterial({
    depthPacking:THREE.RGBADepthPacking, map:texLeaf, alphaTest:0.5
  });

  const mtx=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(),
        v=new THREE.Vector3(), sc=new THREE.Vector3(), col=new THREE.Color();

  for(let ci=0;ci<cells.length;ci++){
    const cell=cells[ci]; if(!cell) continue;
    const cx=X0+((ci%NX)+0.5)*TCELL, cz=Z0+(Math.floor(ci/NX)+0.5)*TCELL;
    const meshes=[];
    kinds.forEach(kind=>{
      const list=cell[kind]; if(!list.length) return;
      const casts=(kind!=='small');
      const bark=new THREE.InstancedMesh(geos[kind].bark, barkMat, list.length);
      const leaf=new THREE.InstancedMesh(geos[kind].leaf, leafMat, list.length);
      list.forEach((t,n)=>{
        e.set(t.tilt,t.ry,t.tilt*0.6);
        q.setFromEuler(e);
        sc.set(t.s,t.s*(0.94+((t.tint*7)%1)*0.14),t.s);
        v.set(t.x, terrainH(t.x,t.z)-0.06, t.z);
        mtx.compose(v,q,sc);
        bark.setMatrixAt(n,mtx); leaf.setMatrixAt(n,mtx);
        col.setRGB(t.tint*(1+t.warm), t.tint, t.tint*(1-t.warm*0.7));
        bark.setColorAt(n,col); leaf.setColorAt(n,col);
      });
      bark.instanceMatrix.needsUpdate=true; leaf.instanceMatrix.needsUpdate=true;
      if(bark.instanceColor) bark.instanceColor.needsUpdate=true;
      if(leaf.instanceColor) leaf.instanceColor.needsUpdate=true;
      // instance offsets never make it into the bounding sphere, so three.js
      // cannot cull these itself -- we do it per cell in the frame loop
      bark.frustumCulled=false; leaf.frustumCulled=false;
      leaf.customDepthMaterial=leafDepth;   // leaves punch alpha through the shadow map
      bark.userData.casts=casts; leaf.userData.casts=casts;
      bark.castShadow=casts; leaf.castShadow=casts;
      bark.receiveShadow=true; leaf.receiveShadow=true;
      shadowCasters.push(bark,leaf);
      treeGroup.add(bark,leaf);
      meshes.push(bark,leaf);
    });
    if(meshes.length){
      treeCells.push({
        sphere:new THREE.Sphere(new THREE.Vector3(cx,12,cz), TCELL*0.708+24),
        cx, cz, meshes, vis:true
      });
    }
  }
}

/* ---------------------------------------------------------------- minimap */
const mapCan=document.getElementById('map'), mapCtx=mapCan.getContext('2d');
let mapBg=null, mapK=1, mapPX=0, mapPZ=0;
function buildMap(){
  const W=mapCan.width, H=mapCan.height, pad=22;
  const bw=TRK_MAXX-TRK_MINX, bh=TRK_MAXZ-TRK_MINZ;
  mapK=Math.min((W-pad*2)/bw,(H-pad*2)/bh);
  mapPX=(W-bw*mapK)/2-TRK_MINX*mapK;
  mapPZ=(H-bh*mapK)/2-TRK_MINZ*mapK;
  const o=document.createElement('canvas'); o.width=W; o.height=H;
  const g=o.getContext('2d');
  g.lineJoin=g.lineCap='round';
  g.beginPath();
  for(let i=0;i<=NSAMP;i+=10){
    const k=i%NSAMP, X=sx[k]*mapK+mapPX, Y=sz[k]*mapK+mapPZ;
    i?g.lineTo(X,Y):g.moveTo(X,Y);
  }
  g.closePath();
  g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=11; g.stroke();
  g.strokeStyle='rgba(236,234,228,.72)'; g.lineWidth=7; g.stroke();
  // start/finish tick, drawn across the track
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  trackAt(FINISH_S,p); trackDir(FINISH_S,d);
  g.strokeStyle='#f2a20c'; g.lineWidth=4;
  g.beginPath();
  g.moveTo((p.x+d.y*10)*mapK+mapPX,(p.y-d.x*10)*mapK+mapPZ);
  g.lineTo((p.x-d.y*10)*mapK+mapPX,(p.y+d.x*10)*mapK+mapPZ);
  g.stroke();
  mapBg=o;
}
const _mp=new THREE.Vector2();
function drawMap(){
  if(!mapBg) return;
  mapCtx.clearRect(0,0,mapCan.width,mapCan.height);
  mapCtx.drawImage(mapBg,0,0);
  const p=trackAt(carState.s,_mp);
  mapCtx.beginPath();
  mapCtx.arc(p.x*mapK+mapPX,p.y*mapK+mapPZ,7,0,6.2832);
  mapCtx.fillStyle='#f2a20c'; mapCtx.fill();
  mapCtx.lineWidth=3; mapCtx.strokeStyle='rgba(11,12,13,.85)'; mapCtx.stroke();
}

/* ----------------------------------------------------------------- audio */
/* Four looping engine beds crossfaded on a 0.1 s ramp. Each state gets a
   fresh source so it can be started at an offset -- a looping BufferSource
   cannot be seeked once running. */
const FADE=0.10;
let actx=null, sbuf={}, sndCur=null, sndSrc=null, sndGain=null, audioOn=false;

function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  actx=new AC();
  const ks=['accel','idle','brake','coast'];
  let done=0;
  ks.forEach(k=>{
    const fin=()=>{ if(++done===ks.length) audioOn=true; };
    fetch(ASSETS.snd[k]).then(r=>r.arrayBuffer())
      .then(ab=>actx.decodeAudioData(ab, b=>{ sbuf[k]=b; fin(); }, fin))
      .catch(fin);
  });
}
function unlockAudio(){
  initAudio();
  if(actx && actx.state==='suspended') actx.resume();
}
function setSound(name, offset){
  if(!audioOn || !actx || !sbuf[name] || sndCur===name) return;
  const now=actx.currentTime;
  if(sndGain){                       // fade the outgoing bed out, then drop it
    const g=sndGain, old=sndSrc;
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.linearRampToValueAtTime(0, now+FADE);
    try{ old.stop(now+FADE+0.02); }catch(e){}
  }
  const src=actx.createBufferSource();
  src.buffer=sbuf[name]; src.loop=true;
  const g=actx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(1, now+FADE);
  src.connect(g); g.connect(actx.destination);
  src.start(now, (offset||0)%sbuf[name].duration);
  sndCur=name; sndSrc=src; sndGain=g;
}

/* --------------------------------------------------------------- controls */
const keys=Object.create(null);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  unlockAudio();                    // browsers only allow audio after a gesture
  keys[k]=true;
  if(k==='c'){ camMode=(camMode+1)%CAMS.length; orbit=false; updateStatus(); }
  if(k==='o'){ orbit=!orbit; updateStatus(); }
  if(k==='q'){ setQuality(quality==='High'?'Low':'High'); }
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

/* Camera rig. Cockpit p is a point in the car model's own space (metres
   before the fit-to-5.6 m scale). Chase rides the centreline behind the car. */
const CAMS=[
  // Seated down in the tub: rim at 0.68 is just below the lens, the halo at
  // 0.87 arcs overhead, the wheel at 0.51-0.68 sits in the lower frame.
  {name:'Cockpit', p:[0,0.72,0.11], fov:70, zoom:10, shake:1.30},
  {name:'Chase',   chase:true, back:9.5, up:3.15, fov:64, zoom:8, shake:0.35}
];
let orbit=false, camMode=0, quality='High', shadowsOn=true;
function updateStatus(){
  document.getElementById('camname').textContent = orbit?'Orbit':CAMS[camMode].name;
  document.getElementById('qname').textContent   = quality;
}
function setQuality(q){
  quality=q;
  const hi = q==='High';
  shadowsOn=hi;
  renderer.shadowMap.enabled=hi;
  shadowCasters.forEach(m=>{ m.castShadow = hi && m.userData.casts!==false; });
  // this just overrode the per-cell tree gating below, so make the cull loop
  // reapply it on the next frame rather than leaving distant cells casting
  treeCells.forEach(b=>{ b.cast=undefined; });
  renderer.setPixelRatio(Math.min(devicePixelRatio, hi?1.75:1.1));
  scene.traverse(o=>{ if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true); } });
  updateStatus();
}

// orbit drag
let dragging=false, lastX=0, lastY=0, moved=0, orbYaw=Math.PI, orbPitch=0.22, orbDist=16;
canvas.addEventListener('pointerdown',e=>{
  unlockAudio();
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup',e=>{
  dragging=false;
  if(moved<8){                       // a tap, not a drag — cycle the view
    if(orbit) orbit=false; else camMode=(camMode+1)%CAMS.length;
    updateStatus();
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  moved+=Math.abs(dx)+Math.abs(dy);
  orbYaw   -= dx*0.005;
  orbPitch = clamp(orbPitch+dy*0.004,-0.12,1.15);
  lastX=e.clientX; lastY=e.clientY;
  if(!orbit && moved>8){ orbit=true; updateStatus(); }
});
canvas.addEventListener('wheel',e=>{ if(orbit){ orbDist=clamp(orbDist*(1+e.deltaY*0.0012),3.5,900); e.preventDefault(); } },{passive:false});

/* ------------------------------------------------------------ drive model */
/* The car is still railed to the crown of the road -- what changed is that the
   crown is now a curve, so s is distance along the lap instead of world z. */
const carState={ s:START_S, speed:0 };
let spin=0;                       // accumulated wheel angle, radians
let steerIn=0, steerAng=0;        // player input -1..1, and the wheel angle
let lockF=1;                      // eased speed-dependent lock multiplier
let pitch=0, roll=0, spdPrev=0;   // body attitude
const STEER_LOCK=2.36;            // rad at full lock (~135 deg each way)
const STEER_RATIO=7.1;            // rack ratio: 135 deg of wheel -> ~19 deg of tyre
const _qRoll=new THREE.Quaternion(), _qSteer=new THREE.Quaternion();
const _AXIS_X=new THREE.Vector3(1,0,0), _AXIS_Y=new THREE.Vector3(0,1,0);
const MAXSPEED=100;               // m/s = 360 km/h exactly
const kmhEl=document.getElementById('kmh');

function drive(dt){
  const thr = keys['w']||keys['arrowup'];
  const brk = keys['s']||keys['arrowdown'];
  const lft = keys['a']||keys['arrowleft'];
  const rgt = keys['d']||keys['arrowright'];

  /* Two stages of easing on the player's input: it ramps toward the key state,
     then the wheel angle chases it. Critically damped-ish, so it arrives
     smoothly and settles instead of snapping or overshooting. */
  const want = (lft?-1:0) + (rgt?1:0);
  const rate = want ? 3.4 : 5.0;                    // self-centres a bit quicker
  steerIn += (want-steerIn)*(1-Math.pow(0.0016,dt*rate/3.4));

  /* Available lock falls away with speed, like a real rack loading up.
     The bands are hard steps, so the factor is eased rather than applied
     raw -- otherwise the wheel snaps when crossing a threshold, and sitting
     exactly on one (say 100 kph) would flicker between two bands per frame. */
  const kph=carState.speed*3.6;
  const lockT = kph< 30 ? 1.00 : kph< 55 ? 0.60 : kph<100 ? 0.50
              : kph<150 ? 0.40 : kph<200 ? 0.30
              : kph<300 ? 0.2667 : 0.25;
  lockF += (lockT-lockF)*(1-Math.pow(0.02,dt));

  if(thr){
    // drag rises with v^2, so: hard launch, progressive knee, flat top end.
    // thrust and drag cancel at MAXSPEED, so it eases in instead of clamping.
    const v=carState.speed/MAXSPEED;
    carState.speed += 26.0*(1.0 - v*v)*dt;
  }
  else if(brk) carState.speed -= 46*dt;
  else carState.speed -= (0.8 + carState.speed*0.028)*dt;
  carState.speed=clamp(carState.speed,0,MAXSPEED);

  carState.s += carState.speed*dt;
  if(carState.s>=LAP) carState.s-=LAP;

  /* Steering. The rack now has a real job: hold the tyres at whatever angle
     the corner needs, from a bicycle model on the track's own curvature, a few
     metres ahead so the wheels lead the car into the turn the way they should.
     The player's A/D input rides on top of that and is still cosmetic --
     the car cannot leave the crown of the road. */
  const kNow=trackK(carState.s+6);
  const dTyre=Math.atan(WHEELBASE*kNow);            // +ve = left
  const target=clamp(-dTyre*STEER_RATIO + steerIn*STEER_LOCK*lockF, -STEER_LOCK, STEER_LOCK);
  steerAng += (target-steerAng)*(1-Math.pow(0.0009,dt));
  if(steer) steer.setRotationFromAxisAngle(STEER_AXIS, steerAng);

  /* Body attitude. Pitch is dive/squat off actual longitudinal acceleration
     rather than the key state, so it eases off by itself near top speed. Roll
     is lateral load, v^2 * curvature, leaning the shell to the outside of the
     corner. Both clamped then damped, so it rocks on its springs. */
  const along=(carState.speed-spdPrev)/Math.max(dt,1e-4);
  spdPrev=carState.speed;
  const pitchT=clamp(-along*0.00045, -0.014, 0.021);   // -0.8 deg .. +1.2 deg
  pitch += (pitchT-pitch)*(1-Math.pow(0.01,dt));

  const alat=carState.speed*carState.speed*trackK(carState.s);
  const rollT=clamp(alat*0.00085, -0.042, 0.042);      // up to ~2.4 deg
  roll += (rollT-roll)*(1-Math.pow(0.03,dt));
  if(carObj){ carObj.rotation.x=pitch; carObj.rotation.z=roll; }

  // Wheels roll at v/r -- faster car, faster spin, no slip.
  // Steer and roll are composed as quaternions on the axle node itself, in the
  // order steer-then-roll, so the roll axis follows the steered wheel the way a
  // real one does. Euler rotation.x/.y on one node would fight over axis order,
  // and rotating the child mesh would swing it in an arc -- its local origin is
  // ~2.8 m from the geometry. The node has no scale, so this stays rigid: no
  // stretch on the tyres, covers or discs at any angle.
  spin += (carState.speed/wheelR)*dt;
  if(spin>6.283185307) spin-=6.283185307;
  _qRoll.setFromAxisAngle(_AXIS_X, spin);
  _qSteer.setFromAxisAngle(_AXIS_Y, -steerAng/STEER_RATIO);
  for(let i=0;i<wheels.length;i++){
    const w=wheels[i];
    if(w.userData.steers) w.quaternion.copy(_qSteer).multiply(_qRoll);
    else                  w.quaternion.copy(_qRoll);
  }
  // winglets steer with the uprights but never roll
  if(wingL) wingL.quaternion.copy(_qSteer);
  if(wingR) wingR.quaternion.copy(_qSteer);

  /* engine bed: idle when stopped, otherwise brake > throttle > coast.
     Lifting off the brake back onto the throttle while still rolling means
     the engine is already spinning, so pick the accel loop up halfway in
     rather than replaying the rev sweep from nothing. */
  const st = carState.speed<0.6 ? 'idle' : brk ? 'brake' : thr ? 'accel' : 'coast';
  if(st!==sndCur){
    const rolling = (st==='accel' && sndCur==='brake' && carState.speed>0.6);
    setSound(st, rolling && sbuf.accel ? sbuf.accel.duration*0.5 : 0);
  }

  kmhEl.textContent = Math.round(carState.speed*3.6);
}

/* ------------------------------------------------------------- main loop */
const tmp=new THREE.Vector3();
const _p2=new THREE.Vector2(), _d2=new THREE.Vector2(), _aim=new THREE.Vector3();
const _frustum=new THREE.Frustum(), _pmv=new THREE.Matrix4();
let last=performance.now(), t=0, frames=0, acc=0, checked=false;

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05); last=now; t+=dt;
  drive(dt);
  windU.value=t;

  // put the car on the centreline, nose along the tangent. Matrices must be
  // current before carPoint() reads mount positions off the bodywork.
  trackAt(carState.s,_p2); trackDir(carState.s,_d2);
  carGroup.position.set(_p2.x,0.125,_p2.y);
  carGroup.rotation.y=Math.atan2(_d2.x,_d2.y);
  carGroup.updateMatrixWorld(true);

  const sp=carState.speed/MAXSPEED;
  const C=CAMS[camMode];

  if(orbit){
    const cx=carGroup.position.x, cz=carGroup.position.z;
    camera.position.set(
      cx+Math.sin(orbYaw)*Math.cos(orbPitch)*orbDist,
      1.0+Math.sin(orbPitch)*orbDist,
      cz+Math.cos(orbYaw)*Math.cos(orbPitch)*orbDist);
    camera.up.set(0,1,0);
    camera.lookAt(cx,0.9,cz);
    camera.fov=52;
  }else{
    /* The aim point rides the centreline ahead of the car rather than sitting
       straight out of the nose, so the view leads into a corner the way a
       driver's eyes do. Lookahead grows with speed. */
    const LA=14+carState.speed*0.8;
    trackAt(carState.s+LA,_p2);

    if(C.chase){
      trackAt(carState.s-C.back,_d2);
      camera.position.set(_d2.x, C.up, _d2.y);
      _aim.set(_p2.x, 1.1, _p2.y);
      camera.up.set(0,1,0);
      camera.lookAt(carGroup.position.x*0.55+_aim.x*0.45,
                    1.15, carGroup.position.z*0.55+_aim.z*0.45);
    }else{
      // mount point is a real feature on the model, so it tracks the bodywork
      const P=carPoint(C.p[0],C.p[1],C.p[2]);
      camera.position.copy(P);
      _aim.set(_p2.x, P.y+0.06, _p2.y);
      camera.up.set(0,1,0);
      camera.lookAt(_aim);
    }

    /* Cockpit vibration. Short and hard rather than floaty: 11-19 Hz stacked
       buzz, kept under the 30 Hz Nyquist limit at 60 fps or it just aliases
       back into a slow wobble. Three incommensurate tones plus irregular road
       noise so it never settles into a pure tone. Most of the violence is
       rotational -- it reads far harder than sliding the camera, and it can't
       shove the lens through the bodywork. */
    const amp=(0.10 + sp*0.26 + sp*sp*0.68)*C.shake*0.66;
    const b1=Math.sin(t*119.4), b2=Math.sin(t*71.0+1.3), b3=Math.sin(t*94.2+2.7);
    const n1=vnoise(t*19.0,0.0)-0.5, n2=vnoise(t*27.0,7.3)-0.5;
    camera.position.x += (b2*0.50 + n2*1.40)*0.0030*amp;
    camera.position.y += (b1*0.50 + b3*0.32 + n1*1.50)*0.0042*amp;
    // lookAt zeroes the roll, so the body's lean and dive are folded back in
    // here rather than being inherited from the shell
    camera.rotation.z += roll*0.85 + (b2*0.55 + n1*1.20)*0.0110*amp;
    camera.rotation.x += pitch*0.80 + (b1*0.50 + n2*1.30)*0.0090*amp;
    camera.fov = C.fov + sp*C.zoom;
  }
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  skyDome.position.copy(camera.position);   // the dome is finite; keep it centred

  // cull the forest a cell at a time -- instanced meshes carry no usable
  // bounding sphere, so the test has to be ours
  // renderer.render() is what normally refreshes matrixWorldInverse, and that
  // runs after this loop -- so derive it here or the cull tests a stale (on the
  // first frame, identity) view matrix.
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  _pmv.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_pmv);
  for(let i=0;i<treeCells.length;i++){
    const b=treeCells[i];
    const dx=b.cx-camera.position.x, dz=b.cz-camera.position.z;
    const vis = (dx*dx+dz*dz < 1250*1250) && _frustum.intersectsSphere(b.sphere);
    if(b.vis!==vis){
      b.vis=vis;
      for(let m=0;m<b.meshes.length;m++) b.meshes[m].visible=vis;
    }
    /* The shadow camera only spans 144 m around the car, so a distant cell
       costs a full instanced draw in the shadow pass and contributes nothing.
       Visibility alone will not save us here — the shadow pass walks the same
       graph, it just ignores the view frustum. */
    // the shadow box reaches 72 m from the car and a cell centre can sit 354 m
    // from a tree inside it, so 480 m is the tightest radius that keeps every
    // cell that could actually drop a shadow on the road
    const near = (b.cx-carGroup.position.x)**2 + (b.cz-carGroup.position.z)**2 < 480*480;
    const cast = shadowsOn && near;
    if(b.cast!==cast){
      b.cast=cast;
      for(let m=0;m<b.meshes.length;m++){
        const mesh=b.meshes[m];
        mesh.castShadow = cast && mesh.userData.casts!==false;
      }
    }
  }

  // sun rig follows the car so the shadow map stays tight
  tmp.copy(carGroup.position);
  sun.target.position.copy(tmp);
  sun.position.copy(tmp).addScaledVector(SUN_DIR,190);

  renderer.render(scene,camera);
  drawMap();

  // one-shot adaptive quality
  if(!checked){
    frames++; acc+=dt;
    if(acc>2.2){ checked=true; if(frames/acc < 34) setQuality('Low'); }
  }
}

/* ------------------------------------------------------------------ boot */
let booted=false;
function ready(){
  if(booted) return; booted=true;
  makeTrees();
  buildMap();
  setQuality('High');
  updateStatus();
  document.getElementById('tagsub').textContent =
    (LAP/1000).toFixed(3)+' km · McLaren MCL39';
  document.getElementById('boot').classList.add('gone');
  requestAnimationFrame(frame);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
});
})();
</script>
</body>
