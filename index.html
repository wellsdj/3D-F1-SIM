<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const ASSETS = {
  geoManifest: null,                       // filled by boot() from trees.json
  geo:   "trees.bin",
  bark:  "bark.jpg",
  barkN: "barkn.jpg",
  leaf:  "leaf.png",
  road:  "road.jpg",
  rock:  "rock.jpg",
  car:   "car.glb",
  snd:   { accel:"accel.mp3", idle:"idle.mp3",
           brake:"brake.mp3", coast:"coast.mp3" }
};
</script>
<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- helpers */
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=>a+(b-a)*t;
const smoothstep = (e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const sRGB  = h=>new THREE.Color(h).convertSRGBToLinear();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n);}
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y,oct){
  let s=0,amp=1,f=1,tot=0;
  for(let i=0;i<(oct||4);i++){ s+=vnoise(x*f,y*f)*amp; tot+=amp; amp*=0.5; f*=2.03; }
  return s/tot;
}

/* road cross-section (metres, lateral offset from the centreline) */
/* Now per-track rather than fixed: Pinewood is generated to these, while the
   imported circuit takes its own width from the mesh it was extracted from. */
let ROAD_HALF   = 7.6;      // asphalt half width — 15.2 m, wide modern F1 spec
let LANE_EDGE   = 6.75;     // white edge line offset
let KERB_W      = 2.0;      // kerb width, outboard of the edge line
let SHOULDER    = 11.4;     // gravel outer edge
let TREE_CLEAR  = 22.0;     // nearest trunk to the centreline
let LAP_TARGET  = 5000;     // circuit length, metres

/* ------------------------------------------------------------------ tracks */
/* Pinewood is authored from control points and driven in track space, so it
   has a lap, barriers and a racing line. Spa is an imported scan driven in
   free roam: you go where you like and the ground comes from the model. */
const TRACKS={
  pinewood:{
    id:'pinewood', name:'Pinewood', sub:'Generated · 5.00 km',
    procedural:true,
    roadHalf:7.6, laneEdge:6.75, kerbW:2.0, shoulder:11.4, treeClear:22.0,
    barrierOut:2.4, scenery:true
  },
  spa:{
    id:'spa', name:'Spa-Francorchamps', sub:'Imported · free roam',
    procedural:false, glb:'spa.glb', freeRoam:true, scenery:false,
    /* This model needs no scale guessing: its footprint measures 2554 x 2440 m
       and its road climbs 102.1 m, against a real Spa of about 2.5 km across
       with roughly 100 m of elevation. It is already 1 unit = 1 metre. The
       road surface is mesh 89 -- 83826 m2 of upward-facing triangles, which
       over the real 6968 m lap is a road 12.0 m wide. */
    roadMaterial:'ROAD1X_78', roadMetres:12.0,
    roadHalf:6.0, laneEdge:5.2, kerbW:1.6, shoulder:8.0, treeClear:26.0,
    barrierOut:2.6,
    // somewhere flat and unambiguously on the tarmac to be put down, in the
    // model's own Z-up coordinates; the height is resolved off the surface
    spawn:[-1285.4,-701.3]
  }
};
let TRACK=TRACKS.pinewood;
let FREEROAM=false;
/* Declared here rather than with the drive model: the racing line is built at
   load and needs both, and it is built long before that section is reached. */
const MAXSPEED    = 100;    // m/s = 360 km/h exactly
const A_GRIP      = 42;     // m/s^2 of lateral grip, ~4.3 g

const shadowCasters=[];
const treeCells=[];

/* ================================================================= TRACK ==
   The circuit is authored as a closed polyline in the units of the layout
   sketch, run through a centripetal Catmull-Rom, then uniformly scaled so the
   lap comes out at LAP_TARGET metres. Everything downstream — road ribbon,
   kerbs, posts, trees, terrain flattening, the car itself — is placed in
   (s, lateral) track space rather than world x/z, which is what lets the
   straight road become a circuit at all.

   Index 0 is the start of the main straight; index 4 is its far end.        */
/* A Catmull-Rom segment is exactly a straight line only when all four points
   it reads -- the two ends plus one either side -- are collinear. Eight
   collinear points therefore buy an exactly straight run from index 1 to
   index 6; the bends live entirely in the 0->1 and 6->7 segments, outside
   the part of the straight you actually drive down. */
const TRACK_PX=[
  [ 430,735],[ 513,735],[ 596,735],[ 679,735],                // main straight,
  [ 762,735],[ 845,735],[ 928,735],[1010,735],                // exactly collinear
  [1103,716],[1152,660],                                      // sweep up the right end
  [1125,600],[1062,563],[1022,527],                           // in to the tight notch
  [1058,484],[1118,442],[1151,412],                           // back out to the far right
  [1130,366],[1050,327],[ 957,311],                           // over the top-right crest
  [ 866,332],[ 776,369],[ 688,399],[ 639,413],                // long top sweep to the saddle
  [ 599,398],[ 557,351],[ 519,299],[ 457,281],                // rise to the top-left crest
  [ 399,317],[ 378,389],                                      // down the left flank
  [ 401,439],[ 452,489],                                      // the inward kink
  [ 423,537],[ 389,591],[ 381,647],[ 399,701]                 // final left onto the straight
];
const STRAIGHT_BEG_I = 1;
const STRAIGHT_END_I = 6;

let LAP=0, NSAMP=0, DS=1;
let sx=null, sz=null, tanx=null, tanz=null, kap=null;
let START_S=6, FINISH_S=0, STRAIGHT_S0=0, STRAIGHT_S1=0;
const trackShift=new THREE.Vector3();   // model units removed when centring
let TRK_MINX=0, TRK_MAXX=0, TRK_MINZ=0, TRK_MAXZ=0;

/* ---------------------------------------------------- ground height field --
   Free roam means the car can be anywhere, so its height has to come from the
   scenery itself rather than from a track model. Raycasting the whole circuit
   every frame is far too slow -- a quarter of a million triangles -- so the
   drivable ones are binned into a flat grid by their footprint once at load.
   A downward probe then only tests the handful sharing its cell.

   Only surfaces you could plausibly sit on are kept (normal.y > 0.3), which
   drops building walls, barrier faces and the backdrop, so the car cannot end
   up perched on the side of something. */
const HF={cell:6, minx:0, minz:0, nx:0, nz:0, bins:null, tri:null};
function buildHeightField(root){
  const tris=[]; const v=new THREE.Vector3();
  root.updateWorldMatrix(true,true);
  root.traverse(o=>{
    if(!o.isMesh||!o.geometry||!o.geometry.attributes.position) return;
    const g=o.geometry, pos=g.attributes.position, idx=g.index, m=o.matrixWorld;
    const n=idx?idx.count:pos.count;
    const P=new Float32Array(pos.count*3);
    for(let i=0;i<pos.count;i++){ v.fromBufferAttribute(pos,i).applyMatrix4(m);
      P[i*3]=v.x; P[i*3+1]=v.y; P[i*3+2]=v.z; }
    for(let t=0;t+2<n;t+=3){
      const a=idx?idx.getX(t):t, b=idx?idx.getX(t+1):t+1, c=idx?idx.getX(t+2):t+2;
      const ax=P[a*3],ay=P[a*3+1],az=P[a*3+2],bx=P[b*3],by=P[b*3+1],bz=P[b*3+2],
            cx=P[c*3],cy=P[c*3+1],cz=P[c*3+2];
      const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;
      const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      const L=Math.hypot(nx,ny,nz); if(L<1e-9) continue;
      if(ny/L<0.3 && -ny/L<0.3) continue;              // a wall, not a floor
      tris.push(ax,ay,az,bx,by,bz,cx,cy,cz);
    }
  });
  const T=new Float32Array(tris); const nt=T.length/9;
  let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;
  for(let i=0;i<nt;i++){ for(let k=0;k<3;k++){ const x=T[i*9+k*3], z=T[i*9+k*3+2];
    if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(z<mnz)mnz=z; if(z>mxz)mxz=z; } }
  HF.minx=mnx-4; HF.minz=mnz-4;
  HF.nx=Math.max(1,Math.ceil((mxx-mnx+8)/HF.cell));
  HF.nz=Math.max(1,Math.ceil((mxz-mnz+8)/HF.cell));
  const counts=new Uint32Array(HF.nx*HF.nz);
  const span=i=>{ let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
    for(let k=0;k<3;k++){ const x=T[i*9+k*3], z=T[i*9+k*3+2];
      if(x<x0)x0=x; if(x>x1)x1=x; if(z<z0)z0=z; if(z>z1)z1=z; }
    return [Math.max(0,((x0-HF.minx)/HF.cell)|0), Math.min(HF.nx-1,((x1-HF.minx)/HF.cell)|0),
            Math.max(0,((z0-HF.minz)/HF.cell)|0), Math.min(HF.nz-1,((z1-HF.minz)/HF.cell)|0)]; };
  for(let i=0;i<nt;i++){ const [a,b,c,d]=span(i);
    for(let gx=a;gx<=b;gx++) for(let gz=c;gz<=d;gz++) counts[gz*HF.nx+gx]++; }
  const start=new Uint32Array(HF.nx*HF.nz+1);
  for(let i=0;i<counts.length;i++) start[i+1]=start[i]+counts[i];
  const items=new Uint32Array(start[counts.length]); const fill=start.slice();
  for(let i=0;i<nt;i++){ const [a,b,c,d]=span(i);
    for(let gx=a;gx<=b;gx++) for(let gz=c;gz<=d;gz++) items[fill[gz*HF.nx+gx]++]=i; }
  HF.tri=T; HF.bins={start,items};
  return {tris:nt, cells:HF.nx*HF.nz, refs:items.length};
}

/* Highest surface at (x,z) at or below refY+2, so driving under a bridge does
   not snap the car onto its deck. Falls back to the highest surface found. */
const _gnd={y:0,nx:0,ny:1,nz:0,hit:false};
function groundAt(x,z,refY){
  _gnd.hit=false; _gnd.y=0; _gnd.nx=0; _gnd.ny=1; _gnd.nz=0;
  if(!HF.bins) return _gnd;
  const gx=((x-HF.minx)/HF.cell)|0, gz=((z-HF.minz)/HF.cell)|0;
  if(gx<0||gz<0||gx>=HF.nx||gz>=HF.nz) return _gnd;
  const {start,items}=HF.bins, T=HF.tri;
  /* Pick the surface nearest the height we were already at, rather than the
     highest one below a fixed window. The window was the bug: climbing more
     than its 2 m put the road out of reach, and this model has a single large
     terrain slab running underneath the circuit, so that slab then won and the
     car was placed *below* the road it was driving on.

     Continuity gets every case right for one rule -- on a climb the road ahead
     is the closest surface, on a bridge the deck is closest from above and the
     ground is closest from underneath. A very large refY means "no history,
     give me the topmost", which is what the initial placement wants. */
  const fresh=!(refY<1e8);
  let bestD=Infinity, bI=-1, hiY=-1e9, hiI=-1;
  for(let p=start[gz*HF.nx+gx]; p<start[gz*HF.nx+gx+1]; p++){
    const i=items[p];
    const ax=T[i*9],ay=T[i*9+1],az=T[i*9+2],bx=T[i*9+3],by=T[i*9+4],bz=T[i*9+5],
          cx=T[i*9+6],cy=T[i*9+7],cz=T[i*9+8];
    const d=(bx-ax)*(cz-az)-(cx-ax)*(bz-az); if(Math.abs(d)<1e-12) continue;
    const w0=((bx-x)*(cz-z)-(cx-x)*(bz-z))/d;
    const w1=((cx-x)*(az-z)-(ax-x)*(cz-z))/d;
    const w2=1-w0-w1;
    if(w0<-1e-4||w1<-1e-4||w2<-1e-4) continue;
    const y=w0*ay+w1*by+w2*cy;
    if(y>hiY){hiY=y;hiI=i;}
    const dd=Math.abs(y-refY);
    if(dd<bestD){bestD=dd;bI=i;_gnd.y=y;}
  }
  if(fresh){ bI=hiI; _gnd.y=hiY; }
  const i=bI; if(i<0) return _gnd;
  _gnd.hit=true;
  const ax=T[i*9],ay=T[i*9+1],az=T[i*9+2],bx=T[i*9+3],by=T[i*9+4],bz=T[i*9+5],
        cx=T[i*9+6],cy=T[i*9+7],cz=T[i*9+8];
  let nx=(by-ay)*(cz-az)-(bz-az)*(cy-ay), ny=(bz-az)*(cx-ax)-(bx-ax)*(cz-az),
      nz=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);
  const L=Math.hypot(nx,ny,nz)||1; nx/=L; ny/=L; nz/=L;
  if(ny<0){nx=-nx;ny=-ny;nz=-nz;}
  _gnd.nx=nx; _gnd.ny=ny; _gnd.nz=nz;
  return _gnd;
}

/* ------------------------------------------- centreline from a road mesh --
   The imported circuit has no path or spline in it, only geometry, so the
   racing surface itself is the source of truth. The road is a flat slab: a
   top face, a bottom face 37 units under it, and vertical sides joining them.
   Taking only the triangles on the top face and walking the edges used by
   exactly one triangle gives the two rims of the ribbon; pairing them across
   gives the centre.

   The two rims are told apart by perimeter, not by winding, so it does not
   matter which way round the model was built. As a check, a closed ribbon of
   width W turning through one full revolution must have its rims differ in
   length by 2*pi*W -- for this mesh that predicts 578 units against a 581
   measured, which is what confirms the pairing is real and not two edges of
   the same rim. */
function centrelineFromMesh(mesh){
  mesh.updateWorldMatrix(true,false);
  const g=mesh.geometry, pos=g.attributes.position, idx=g.index;
  const m=mesh.matrixWorld, v=new THREE.Vector3();
  const n=pos.count;
  const X=new Float64Array(n), Y=new Float64Array(n), Z=new Float64Array(n);
  for(let i=0;i<n;i++){
    v.fromBufferAttribute(pos,i).applyMatrix4(m);
    X[i]=v.x; Y[i]=v.y; Z[i]=v.z;
  }
  // weld: the exporter splits vertices for normals and uvs, which would leave
  // every interior edge looking like a boundary
  const key=i=>X[i].toFixed(2)+'_'+Y[i].toFixed(2)+'_'+Z[i].toFixed(2);
  const seen=new Map(), rep=new Int32Array(n);
  const ux=[],uy=[],uz=[];
  for(let i=0;i<n;i++){
    const k=key(i);
    if(!seen.has(k)){ seen.set(k,ux.length); ux.push(X[i]); uy.push(Y[i]); uz.push(Z[i]); }
    rep[i]=seen.get(k);
  }
  // split the slab: everything above the midpoint of its height is the top
  let lo=Infinity, hi=-Infinity;
  for(let i=0;i<uy.length;i++){ if(uy[i]<lo)lo=uy[i]; if(uy[i]>hi)hi=uy[i]; }
  const cut=(lo+hi)*0.5;
  const ec=new Map(), ek=(a,b)=>a<b?a+':'+b:b+':'+a;
  const ni=idx?idx.count:n;
  for(let t=0;t<ni;t+=3){
    const a=rep[idx?idx.getX(t):t], b=rep[idx?idx.getX(t+1):t+1], c=rep[idx?idx.getX(t+2):t+2];
    if(a===b||b===c||a===c) continue;                       // exporter slivers
    if(uy[a]<=cut||uy[b]<=cut||uy[c]<=cut) continue;
    for(const [p,q] of [[a,b],[b,c],[c,a]]){ const k=ek(p,q); ec.set(k,(ec.get(k)||0)+1); }
  }
  const adj=new Map();
  ec.forEach((count,k)=>{
    if(count!==1) return;                                   // interior edge
    const [a,b]=k.split(':').map(Number);
    if(!adj.has(a)) adj.set(a,[]); if(!adj.has(b)) adj.set(b,[]);
    adj.get(a).push(b); adj.get(b).push(a);
  });
  const used=new Set(), loops=[];
  adj.forEach((_,s)=>{
    if(used.has(s)) return;
    const loop=[s]; used.add(s);
    let prev=-1, cur=s;
    for(let guard=0;guard<200000;guard++){
      const nx=(adj.get(cur)||[]).find(x=>x!==prev&&!used.has(x));
      if(nx===undefined) break;
      loop.push(nx); used.add(nx); prev=cur; cur=nx;
    }
    if(loop.length>24) loops.push(loop);
  });
  if(loops.length<2) return null;
  const per=l=>{ let s=0; for(let i=0;i<l.length;i++){ const a=l[i],b=l[(i+1)%l.length];
    s+=Math.hypot(ux[a]-ux[b],uz[a]-uz[b]); } return s; };
  /* Keep only loops that go most of the way round before choosing. The mesh
     also yields short loops around small holes and a doubled lip along each
     rim, and simply taking the shortest and longest of everything picked a
     stray 150 m sliver instead of the circuit. Both real rims are within a
     factor of two of the longest loop; nothing else comes close. */
  const maxPer=Math.max(...loops.map(per));
  const rims=loops.filter(l=>per(l)>=maxPer*0.5).sort((a,b)=>per(a)-per(b));
  if(rims.length<2) return null;
  const inner=rims[0], outer=rims[rims.length-1];
  // pair across: nearest outer rim point to each ordered inner rim point
  const pts=[];
  let wsum=0;
  for(const a of inner){
    let bb=-1, best=Infinity;
    for(const b of outer){
      const d=(ux[a]-ux[b])**2+(uz[a]-uz[b])**2;
      if(d<best){ best=d; bb=b; }
    }
    wsum+=Math.sqrt(best);
    pts.push([(ux[a]+ux[bb])*0.5, (uy[a]+uy[bb])*0.5, (uz[a]+uz[bb])*0.5]);
  }
  return {pts, width:wsum/inner.length, surfaceY:(lo+hi)*0.5+ (hi-lo)*0.5};
}

/* Takes either the authored control points or a centreline recovered from an
   imported mesh. Both end up as one closed Catmull-Rom resampled at even
   arclength, so everything downstream is blind to where the shape came from.
   `srcPts` is an array of [x,z] already in metres and already centred. */
function buildTrack(srcPts, exactLap){
  const srcRaw = srcPts || TRACK_PX;
  const pts=srcRaw.map(p=>new THREE.Vector3(p[0],0,p[1]));
  let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;
  pts.forEach(p=>{mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mnz=Math.min(mnz,p.z);mxz=Math.max(mxz,p.z);});
  const cx=(mnx+mxx)/2, cz=(mnz+mxz)/2;
  pts.forEach(p=>{p.x-=cx;p.z-=cz;});
  trackShift.set(cx,0,cz);

  /* centripetal parameterisation: the tight kinks on Pinewood's left flank and
     its right-hand loop would cusp or loop back under the uniform variant, and
     an imported rim can be just as unevenly spaced. */
  const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal',0.5);

  const D=24000;
  const px=new Float64Array(D+1), pz=new Float64Array(D+1), cum=new Float64Array(D+1);
  const v=new THREE.Vector3();
  for(let i=0;i<=D;i++){ curve.getPoint(i/D,v); px[i]=v.x; pz[i]=v.z; }
  for(let i=0;i<D;i++) cum[i+1]=cum[i]+Math.hypot(px[i+1]-px[i],pz[i+1]-pz[i]);

  /* Pinewood is scaled so the lap comes out at exactly LAP_TARGET. An imported
     circuit is already in metres and must not be stretched, so it keeps
     whatever length it measures. */
  const SC = exactLap ? LAP_TARGET/cum[D] : 1;
  for(let i=0;i<=D;i++){ px[i]*=SC; pz[i]*=SC; cum[i]*=SC; }
  LAP=cum[D]; NSAMP=Math.max(64,Math.round(LAP)); DS=LAP/NSAMP;

  sx=new Float32Array(NSAMP); sz=new Float32Array(NSAMP);
  let j=0;
  for(let i=0;i<NSAMP;i++){
    const t=i*DS;
    while(j<D-1 && cum[j+1]<t) j++;
    const f=(t-cum[j])/Math.max(cum[j+1]-cum[j],1e-9);
    sx[i]=px[j]+(px[j+1]-px[j])*f;
    sz[i]=pz[j]+(pz[j+1]-pz[j])*f;
  }

  // tangents by central difference on the arclength-uniform samples
  tanx=new Float32Array(NSAMP); tanz=new Float32Array(NSAMP);
  for(let i=0;i<NSAMP;i++){
    const a=(i-1+NSAMP)%NSAMP, b=(i+1)%NSAMP;
    let dx=sx[b]-sx[a], dz=sz[b]-sz[a];
    const L=Math.hypot(dx,dz)||1;
    tanx[i]=dx/L; tanz[i]=dz/L;
  }
  /* Signed curvature, +ve = turning left. theta = atan2(tx,tz) is the yaw about
     +y, and increasing it swings +z toward +x — which is the driver's left,
     because with forward = +z and up = +y the car's local +x points left.   */
  const raw=new Float32Array(NSAMP);
  for(let i=0;i<NSAMP;i++){
    const b=(i+1)%NSAMP;
    let d=Math.atan2(tanx[b],tanz[b])-Math.atan2(tanx[i],tanz[i]);
    while(d> Math.PI) d-=Math.PI*2;
    while(d<-Math.PI) d+=Math.PI*2;
    raw[i]=d/DS;
  }
  // box-filter it: the raw signal is noisy enough to make the kerbs stutter
  // and the steering wheel jitter on a straight.
  kap=new Float32Array(NSAMP);
  const R=7;
  for(let i=0;i<NSAMP;i++){
    let a=0;
    for(let k=-R;k<=R;k++) a+=raw[(i+k+NSAMP)%NSAMP];
    kap[i]=a/(R*2+1);
  }

  for(let i=0;i<NSAMP;i++){
    if(sx[i]<TRK_MINX||i===0)TRK_MINX=sx[i];
    if(sx[i]>TRK_MAXX||i===0)TRK_MAXX=sx[i];
    if(sz[i]<TRK_MINZ||i===0)TRK_MINZ=sz[i];
    if(sz[i]>TRK_MAXZ||i===0)TRK_MAXZ=sz[i];
  }

  if(srcPts){
    /* An imported circuit has no authored straight to point at, so find its
       longest genuinely straight run and treat that as the pit straight. Same
       intent as the control-point lookup below, arrived at by measurement. */
    const TH=1/400;
    let bs=0,bl=0,cs=-1;
    for(let i=0;i<NSAMP*2;i++){
      const k=i%NSAMP;
      if(Math.abs(kap[k])<TH){ if(cs<0) cs=i; }
      else { if(cs>=0 && i-cs>bl){ bl=i-cs; bs=cs; } cs=-1; }
    }
    if(cs>=0 && NSAMP*2-cs>bl){ bl=NSAMP*2-cs; bs=cs; }
    bl=Math.min(bl,NSAMP-1);
    STRAIGHT_S0=(bs%NSAMP)*DS;
    STRAIGHT_S1=STRAIGHT_S0+bl*DS;
  }else{
    // s of a control point, found by matching its scaled position to a sample
    const sOfPoint=i=>{
      const ex=(TRACK_PX[i][0]-cx)*SC, ez=(TRACK_PX[i][1]-cz)*SC;
      let best=1e18, bi=0;
      for(let k=0;k<NSAMP;k++){
        const d=(sx[k]-ex)*(sx[k]-ex)+(sz[k]-ez)*(sz[k]-ez);
        if(d<best){best=d;bi=k;}
      }
      return bi*DS;
    };
    STRAIGHT_S0=sOfPoint(STRAIGHT_BEG_I);
    STRAIGHT_S1=sOfPoint(STRAIGHT_END_I);
  }
  // start/finish sits about seven tenths down the straight — past the middle,
  // with enough road left to still be braking for turn one after it.
  const wrap=v=>{ v%=LAP; return v<0?v+LAP:v; };
  FINISH_S = wrap(STRAIGHT_S0 + (STRAIGHT_S1-STRAIGHT_S0)*0.70);
  START_S  = wrap(STRAIGHT_S0);      // lights out at the start of the dead-straight run
}

const _ta=new THREE.Vector2(), _td=new THREE.Vector2();
function trackAt(s,out){
  let u=s/DS; u%=NSAMP; if(u<0)u+=NSAMP;
  const i=u|0, f=u-i, j=(i+1)%NSAMP;
  out.x=sx[i]+(sx[j]-sx[i])*f;
  out.y=sz[i]+(sz[j]-sz[i])*f;
  return out;
}
/* tangent lerped as a vector then renormalised — interpolating the angle
   instead would need wrap handling and still misbehave through pi. */
function trackDir(s,out){
  let u=s/DS; u%=NSAMP; if(u<0)u+=NSAMP;
  const i=u|0, f=u-i, j=(i+1)%NSAMP;
  let x=tanx[i]+(tanx[j]-tanx[i])*f, z=tanz[i]+(tanz[j]-tanz[i])*f;
  const L=Math.hypot(x,z)||1;
  out.x=x/L; out.y=z/L;
  return out;
}
function trackK(s){
  let u=s/DS; u%=NSAMP; if(u<0)u+=NSAMP;
  const i=u|0, f=u-i, j=(i+1)%NSAMP;
  return kap[i]+(kap[j]-kap[i])*f;
}
/* world point at (s, lateral) — +lateral is the driver's left */
function trackPos(s,lat,y,out){
  trackAt(s,_ta); trackDir(s,_td);
  out.set(_ta.x+_td.y*lat, y, _ta.y-_td.x*lat);
  return out;
}

/* ---- distance-to-centreline field -------------------------------------
   Terrain flattening and tree rejection both need "how far is this world
   point from the track", tens of thousands of times. A uniform bucket grid
   over decimated centreline samples answers it in a fixed 7x7 cell scan,
   which is exact out to 3 cells (120 m) and saturates beyond — and 120 m is
   further than anything downstream cares about.                           */
const DCELL=40, DRING=3;
let dgX0=0, dgZ0=0, dgNX=0, dgNZ=0, dgBins=null;
function buildDistGrid(){
  const pad=DCELL*(DRING+1);
  dgX0=TRK_MINX-pad; dgZ0=TRK_MINZ-pad;
  dgNX=Math.ceil((TRK_MAXX-TRK_MINX+pad*2)/DCELL);
  dgNZ=Math.ceil((TRK_MAXZ-TRK_MINZ+pad*2)/DCELL);
  dgBins=new Array(dgNX*dgNZ);
  for(let i=0;i<NSAMP;i+=4){
    const cx=Math.floor((sx[i]-dgX0)/DCELL), cz=Math.floor((sz[i]-dgZ0)/DCELL);
    if(cx<0||cz<0||cx>=dgNX||cz>=dgNZ) continue;
    const k=cz*dgNX+cx;
    (dgBins[k]||(dgBins[k]=[])).push(i);
  }
}
const DFAR=1e6;
function distToTrack(x,z){
  const cx=Math.floor((x-dgX0)/DCELL), cz=Math.floor((z-dgZ0)/DCELL);
  let best=DFAR;
  for(let a=-DRING;a<=DRING;a++){
    const gz=cz+a; if(gz<0||gz>=dgNZ) continue;
    for(let b=-DRING;b<=DRING;b++){
      const gx=cx+b; if(gx<0||gx>=dgNX) continue;
      const bin=dgBins[gz*dgNX+gx]; if(!bin) continue;
      for(let n=0;n<bin.length;n++){
        const i=bin[n], dx=sx[i]-x, dz=sz[i]-z;
        const d=dx*dx+dz*dz;
        if(d<best) best=d;
      }
    }
  }
  return best===DFAR?DFAR:Math.sqrt(best);
}

/* terrain: dead flat across the whole circuit and its run-off, rolling only
   once you are well clear of the track. The track surface itself is flat. */
function terrainH(x,z){
  const k=smoothstep(34,115,distToTrack(x,z));
  if(k<=0) return 0;
  const big=(fbm(x*0.0022,z*0.0022,4)-0.5)*46;
  const mid=(fbm(x*0.011, z*0.011, 3)-0.5)*7;
  return (big+mid)*k;
}

/* ------------------------------------------------------------- decode geo */
let GEO_BUF=null;      // trees.bin, fetched before the trees are built
function buildGeometry(rec, buf){
  const n=rec.count;
  const qp=new Int16Array(buf, rec.pos, n*3);
  const qn=new Int8Array (buf, rec.nrm, n*3);
  const qu=new Uint16Array(buf, rec.uv,  n*2);
  const pos=new Float32Array(n*3), nrm=new Float32Array(n*3), uv=new Float32Array(n*2);
  const pmin=rec.pmin, prng=rec.prng, umin=rec.umin, urng=rec.urng;
  for(let i=0;i<n;i++){
    for(let a=0;a<3;a++){
      const t=(qp[i*3+a]+32767)/65534;
      pos[i*3+a]=pmin[a]+t*prng[a];
      nrm[i*3+a]=qn[i*3+a]/127;
    }
    uv[i*2  ]=umin[0]+(qu[i*2  ]/65535)*urng[0];
    uv[i*2+1]=umin[1]+(qu[i*2+1]/65535)*urng[1];
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  // r128 only multiplies vColor into the fragment when USE_COLOR is defined --
  // instanceColor alone is written in the vertex stage and then dropped. A
  // neutral white colour attribute turns USE_COLOR on so the per-tree tint
  // actually survives to the fragment. Without it every tree renders identical;
  // with vertexColors but no attribute, every tree renders black.
  const white=new Float32Array(n*3); white.fill(1);
  g.setAttribute('color',   new THREE.BufferAttribute(white,3));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(buf, rec.idx, rec.icount),1));
  g.computeBoundingSphere();
  return g;
}

/* ------------------------------------------------------- procedural maps */
function wrapDrawRect(ctx,W,H,x,y,pad,fn){
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
    if(dx&&Math.min(x,W-x)>pad) continue;
    if(dy&&Math.min(y,H-y)>pad) continue;
    ctx.save(); ctx.translate(x+dx*W, y+dy*H); fn(ctx); ctx.restore();
  }
}
function wrapDraw(ctx,size,x,y,fn){ wrapDrawRect(ctx,size,size,x,y,24,fn); }
function groundTexture(){
  const S=512, c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d');
  g.fillStyle='#545c30'; g.fillRect(0,0,S,S);
  const rand=mulberry32(7);
  const blotch=['#4a5329','#5d6634','#494f2a','#6a6f3c','#5b5330','#41482a'];
  for(let i=0;i<520;i++){
    const x=rand()*S,y=rand()*S,r=8+rand()*46;
    g.globalAlpha=.16+rand()*.22; g.fillStyle=blotch[(rand()*blotch.length)|0];
    wrapDraw(g,S,x,y,ctx=>{ctx.beginPath();ctx.ellipse(0,0,r,r*(.5+rand()*.8),rand()*6.28,0,6.28);ctx.fill();});
  }
  const blade=['#6e7a3c','#7d8846','#5a6430','#465027','#8a8f4e','#6b5f34'];
  g.lineCap='round';
  for(let i=0;i<9000;i++){
    const x=rand()*S,y=rand()*S,a=rand()*6.283,len=2+rand()*6;
    g.globalAlpha=.34+rand()*.5; g.strokeStyle=blade[(rand()*blade.length)|0];
    g.lineWidth=.8+rand()*1.3;
    wrapDraw(g,S,x,y,ctx=>{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.stroke();});
  }
  g.globalAlpha=1;
  const id=g.getImageData(0,0,S,S), d=id.data;
  for(let i=0;i<d.length;i+=4){
    const n=(rand()-.5)*26; d[i]+=n; d[i+1]+=n*1.05; d[i+2]+=n*.7;
  }
  g.putImageData(id,0,0);
  return c;
}
/* multiplied over the asphalt: wheel polish, patch repairs, hairline cracks */
function wearTexture(){
  const W=256,H=1024, c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);
  const rand=mulberry32(21);
  const uOf = x => (x/(ROAD_HALF*2)+0.5)*W;  // metres from centre -> px
  // polished wheel paths (lighter, worn smooth)
  [-2.6,-0.85,0.85,2.6].forEach(m=>{
    const gr=g.createLinearGradient(uOf(m-0.95),0,uOf(m+0.95),0);
    gr.addColorStop(0,'rgba(255,255,255,0)');
    gr.addColorStop(.5,'rgba(255,255,255,.85)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.globalCompositeOperation='lighten';
    g.fillRect(uOf(m-0.95),0,uOf(m+0.95)-uOf(m-0.95),H);
  });
  g.globalCompositeOperation='source-over';
  // dark centre grime + edge grime
  [[0,0.55,.20],[-ROAD_HALF+0.4,0.9,.26],[ROAD_HALF-0.4,0.9,.26]].forEach(([m,w,a])=>{
    const gr=g.createLinearGradient(uOf(m-w),0,uOf(m+w),0);
    gr.addColorStop(0,'rgba(0,0,0,0)');
    gr.addColorStop(.5,'rgba(0,0,0,'+a+')');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(uOf(m-w),0,uOf(m+w)-uOf(m-w),H);
  });
  // patch repairs — drawn wrapped so the strip tiles end-to-end
  for(let i=0;i<9;i++){
    const x=rand()*W, y=rand()*H, w=30+rand()*90, h=40+rand()*160;
    const al=.10+rand()*.13, fill=rand()>.5?'#000':'#fff';
    wrapDrawRect(g,W,H,x,y,180,ctx=>{
      ctx.globalAlpha=al; ctx.fillStyle=fill; ctx.fillRect(-w/2,-h/2,w,h);
    });
  }
  // hairline cracks
  g.globalAlpha=1;
  for(let i=0;i<34;i++){
    const x0=rand()*W, y0=rand()*H, lw=.6+rand()*1.1;
    const steps=6+(rand()*10|0), pts=[[0,0]];
    let px=0,py=0;
    for(let s=0;s<steps;s++){ px+=(rand()-.5)*34; py+=(rand()-.35)*40; pts.push([px,py]); }
    wrapDrawRect(g,W,H,x0,y0,420,ctx=>{
      ctx.strokeStyle='rgba(0,0,0,.30)'; ctx.lineWidth=lw;
      ctx.beginPath(); ctx.moveTo(0,0);
      for(const p of pts) ctx.lineTo(p[0],p[1]);
      ctx.stroke();
    });
  }
  // longitudinal seam where the two paving lanes meet
  g.globalAlpha=1;
  g.strokeStyle='rgba(0,0,0,.34)'; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(uOf(0),0); g.lineTo(uOf(0),H); g.stroke();
  return c;
}

/* Kerb stripes. Generated rather than photographed: every texture host in
   reach is blocked here, and a procedural map tiles exactly along the kerb
   (which a photo would not) so the stripes cannot drift or seam at the joins.
   v runs along the kerb, u across it. */
function kerbTexture(){
  const W=128, H=256, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  const rand=mulberry32(4242);
  // two stripes per tile, so one tile = one red + one white block
  const red='#b4291a', white='#e9e6dc';
  for(let i=0;i<2;i++){
    g.fillStyle = i?white:red;
    g.fillRect(0, i*H/2, W, H/2);
  }
  // shade the outer third darker: that edge sits lower once the ramp tilts it
  const gr=g.createLinearGradient(0,0,W,0);
  gr.addColorStop(0,'rgba(0,0,0,0)');
  gr.addColorStop(0.62,'rgba(0,0,0,0.05)');
  gr.addColorStop(1,'rgba(0,0,0,0.30)');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // rubber scrub along the inner edge, where the cars actually clip it
  const gr2=g.createLinearGradient(0,0,W*0.34,0);
  gr2.addColorStop(0,'rgba(24,20,20,0.44)');
  gr2.addColorStop(1,'rgba(24,20,20,0)');
  g.fillStyle=gr2; g.fillRect(0,0,W*0.34,H);
  // grime and chipping, wrapped so the tile stays seamless
  for(let i=0;i<260;i++){
    const x=rand()*W, y=rand()*H, r=1+rand()*4.5;
    g.globalAlpha=0.05+rand()*0.17;
    g.fillStyle=rand()>0.45?'#000':'#fff';
    wrapDrawRect(g,W,H,x,y,10,ctx=>{ctx.beginPath();ctx.arc(0,0,r,0,6.2832);ctx.fill();});
  }
  // crisp dark seam between the blocks so they read as separate slabs
  g.globalAlpha=1; g.fillStyle='rgba(0,0,0,.34)';
  g.fillRect(0,H/2-1.5,W,3); g.fillRect(0,0,W,1.5); g.fillRect(0,H-1.5,W,1.5);
  return c;
}

/* Barrier facing. u runs along the barrier, v up it. One tile is a white
   panel plus a red one, so the stripes count off distance as they go by. */
function barrierTexture(){
  const W=256,H=64,c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#e9e7df'; g.fillRect(0,0,W,H);
  g.fillStyle='#bf2a1b'; g.fillRect(W/2,0,W/2,H);
  // armco corrugation: a bright waist with shaded lips top and bottom
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0.00,'rgba(0,0,0,.34)');
  gr.addColorStop(0.20,'rgba(255,255,255,.14)');
  gr.addColorStop(0.50,'rgba(0,0,0,.22)');
  gr.addColorStop(0.80,'rgba(255,255,255,.10)');
  gr.addColorStop(1.00,'rgba(0,0,0,.46)');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // support posts, one per half panel
  g.fillStyle='rgba(0,0,0,.28)';
  for(let i=0;i<4;i++) g.fillRect(i*W/4+W/8-3,0,6,H);
  const rand=mulberry32(31);
  for(let i=0;i<220;i++){
    g.globalAlpha=.04+rand()*.10;
    g.fillStyle=rand()>.5?'#000':'#fff';
    const x=rand()*W,y=rand()*H,r=1+rand()*5;
    wrapDrawRect(g,W,H,x,y,8,ctx=>{ctx.beginPath();ctx.arc(0,0,r,0,6.2832);ctx.fill();});
  }
  return c;
}
/* Distance board. Drawn once per number and used as its own material. */

}

/* --------------------------------------------------------- texture loader */
let pending=0, loaded=0;
const bar=document.querySelector('#bar i');
function texture(src, srgb, rw, rh){
  pending++;
  const t=new THREE.Texture();
  t.userData={clones:[]};   // r128 does not create userData on Texture
  const img=new Image();
  img.onload=()=>{
    t.image=img; t.needsUpdate=true;
    // clones made before the image arrived are still empty -- fill them now
    for(const c of (t.userData.clones||[])){ c.image=img; c.needsUpdate=true; }
    loaded++;
    bar.style.width=Math.round(loaded/pending*100)+'%';
    if(loaded>=pending) ready();
  };
  img.src=src;
  t.wrapS = rw||THREE.RepeatWrapping;
  t.wrapT = rh||THREE.RepeatWrapping;
  t.anisotropy = MAXANISO;
  if(srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}
/* Texture.clone() copies .image by reference, so a clone taken before the
   image has decoded stays permanently blank. Register it instead. */
function cloneTex(t){
  const c=t.clone();
  c.needsUpdate=true;
  if(t.image){ c.image=t.image; return c; }
  if(!t.userData) t.userData={};
  if(!t.userData.clones) t.userData.clones=[];
  t.userData.clones.push(c);
  return c;
}
/* trees.json + trees.bin must be in hand before makeTrees() runs. Both are

]).then(([man,buf])=>{

  loaded++; bar.style.width=Math.round(loaded/pending*100)+'%';
  if(loaded>=pending) ready();
}).catch(e=>{
  console.error('tree assets failed',e);
  loaded++; if(loaded>=pending) ready();
});

const texRoad = texture(ASSETS.road, true);
const texRock = texture(ASSETS.rock, true);
const texBark = texture(ASSETS.bark, true);
const texBarkN= texture(ASSETS.barkN,false);
const texLeaf = texture(ASSETS.leaf, true);

const texGround = new THREE.CanvasTexture(groundTexture());
texGround.wrapS=texGround.wrapT=THREE.RepeatWrapping;
texGround.anisotropy=MAXANISO; texGround.encoding=THREE.sRGBEncoding;

const texWear = new THREE.CanvasTexture(wearTexture());
texWear.wrapS=THREE.ClampToEdgeWrapping; texWear.wrapT=THREE.RepeatWrapping;
texWear.anisotropy=MAXANISO;

const texBarrier = new THREE.CanvasTexture(barrierTexture());
texBarrier.wrapS=THREE.RepeatWrapping; texBarrier.wrapT=THREE.ClampToEdgeWrapping;
texBarrier.anisotropy=MAXANISO; texBarrier.encoding=THREE.sRGBEncoding;

const texKerb = new THREE.CanvasTexture(kerbTexture());
texKerb.wrapS=THREE.ClampToEdgeWrapping; texKerb.wrapT=THREE.RepeatWrapping;
texKerb.anisotropy=MAXANISO; texKerb.encoding=THREE.sRGBEncoding;

/* ---------------------------------------------------------------- terrain */
const terrainGroup=new THREE.Group(); scene.add(terrainGroup);
function buildTerrain(){
  const SEG=300, SIZE=9000;
  texGround.repeat.set(SIZE/8,SIZE/8);          // 8 m tile
  const g=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
  g.rotateX(-Math.PI/2);
  const p=g.attributes.position, col=new Float32Array(p.count*3);
  const dry=new THREE.Color(0.62,0.56,0.36), green=new THREE.Color(0.44,0.55,0.30);
  const dirt=new THREE.Color(0.50,0.44,0.33);
  const c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i);
    const d=distToTrack(x,z);
    const k=smoothstep(34,115,d);
    let h=0;
    if(k>0){
      h=((fbm(x*0.0022,z*0.0022,4)-0.5)*46 + (fbm(x*0.011,z*0.011,3)-0.5)*7)*k;
    }
    p.setY(i,h);
    const t=fbm(x*0.006,z*0.006,3);
    c.copy(green).lerp(dry, clamp(t*1.5-0.25,0,1));
    const verge=1-smoothstep(7,32,d);            // scuffed dirt beside the tarmac
    c.lerp(dirt, verge*0.75);
    const sh=0.82+fbm(x*0.02,z*0.02,2)*0.4;
    col[i*3]=c.r*sh; col[i*3+1]=c.g*sh; col[i*3+2]=c.b*sh;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.computeVertexNormals();
  const m=new THREE.MeshStandardMaterial({map:texGround,vertexColors:true,roughness:1,metalness:0});
  const mesh=new THREE.Mesh(g,m);
  mesh.receiveShadow=true;
  mesh.frustumCulled=false;
  terrainGroup.add(mesh);
}

/* ------------------------------------------------------------------- road */
const roadGroup=new THREE.Group(); scene.add(roadGroup);

/* Every texture that runs along the track has to close on itself at the
   start/finish, so each nominal tile length is rounded to the nearest whole
   number of repeats per lap. Same idea as the old 180 m road snap, but now
   the constraint is one lap instead of one recycle step. */
const fitTile = L => LAP/Math.round(LAP/L);
const ASPH_TILE = fitTile(3.0);
const GRAV_TILE = fitTile(2.4);
const WEAR_TILE = fitTile(60);

const RSTEP = 2;                       // metres between ribbon rings
const RN    = Math.round(LAP/RSTEP);

/* A flat ribbon swept along the centreline between two lateral offsets.
   la is the left edge, lb the right; winding is set so the face points up. */
function ribbonGeo(la, lb, y, ua, ub, vTile, wear){
  const n=RN+1;                        // the closing ring repeats ring 0 at s=LAP
  const pos=new Float32Array(n*2*3), nrm=new Float32Array(n*2*3),
        uv =new Float32Array(n*2*2);
  const aw = wear ? new Float32Array(n*2*2) : null;
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  for(let i=0;i<n;i++){
    const s=i*RSTEP;
    trackAt(s,p); trackDir(s,d);
    const nx=d.y, nz=-d.x;             // unit left normal
    const v=s/vTile;
    for(let k=0;k<2;k++){
      const lat=k?lb:la, o=(i*2+k);
      pos[o*3  ]=p.x+nx*lat;
      pos[o*3+1]=y;
      pos[o*3+2]=p.y+nz*lat;
      nrm[o*3+1]=1;
      uv[o*2  ]=k?ub:ua;
      uv[o*2+1]=v;
      if(aw){ aw[o*2]=k?0:1; aw[o*2+1]=s/WEAR_TILE; }
    }
  }
  // n*2 vertices; stay on 16-bit indices while that fits, so the ribbon does
  // not silently depend on OES_element_index_uint
  const idx=(n*2<=65536)?new Uint16Array(RN*6):new Uint32Array(RN*6);
  for(let i=0;i<RN;i++){
    const a=i*2, b=a+1, cc=a+2, dd=a+3;
    idx[i*6  ]=a; idx[i*6+1]=b; idx[i*6+2]=cc;
    idx[i*6+3]=b; idx[i*6+4]=dd; idx[i*6+5]=cc;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  if(aw) g.setAttribute('aWear',new THREE.BufferAttribute(aw,2));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeBoundingSphere();
  return g;
}

function buildRoad(){
  texRoad.repeat.set(1,1);             // tiling is baked into the ribbon UVs

  const asphalt=new THREE.MeshStandardMaterial({
    map:texRoad, bumpMap:texRoad, bumpScale:0.035,
    roughnessMap:texRoad, roughness:0.97, metalness:0,
    color:sRGB(0xa8a8a8)
  });
  /* The wear strip needs its own 0..1 cross-track coordinate (the asphalt uv.x
     runs 0..3 for tiling) and its own much longer v period, so it rides on a
     dedicated attribute rather than being derived from uv. */
  asphalt.onBeforeCompile=sh=>{
    sh.uniforms.uWear={value:texWear};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nattribute vec2 aWear;\nvarying vec2 vWear;')
      .replace('#include <uv_vertex>','#include <uv_vertex>\nvWear=aWear;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform sampler2D uWear;\nvarying vec2 vWear;')
      .replace('#include <map_fragment>',
        '#include <map_fragment>\nvec3 wr=texture2D(uWear,vWear).rgb;\ndiffuseColor.rgb*=mix(vec3(1.0),wr,0.85);');
  };
  const road=new THREE.Mesh(
    ribbonGeo(ROAD_HALF,-ROAD_HALF, 0.12, 0,3, ASPH_TILE, true), asphalt);
  road.receiveShadow=true; road.frustumCulled=false;
  roadGroup.add(road);

  // gravel shoulders
  const gravel=new THREE.MeshStandardMaterial({map:cloneTex(texRock),roughness:1,metalness:0,color:sRGB(0x8d8578)});
  gravel.map.wrapS=gravel.map.wrapT=THREE.RepeatWrapping;
  gravel.map.repeat.set(1,1); gravel.map.encoding=THREE.sRGBEncoding;
  gravel.map.anisotropy=MAXANISO;
  [[SHOULDER,ROAD_HALF],[-ROAD_HALF,-SHOULDER]].forEach(([a,b])=>{
    const m=new THREE.Mesh(ribbonGeo(a,b,0.10,0,1.1,GRAV_TILE,false),gravel);
    m.receiveShadow=true; m.frustumCulled=false;
    roadGroup.add(m);
  });

  // edge lines
  const paint=new THREE.MeshStandardMaterial({
    color:sRGB(0xdedbd0), roughness:0.7, metalness:0,
    polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4
  });
  [[LANE_EDGE+0.075,LANE_EDGE-0.075],[-LANE_EDGE+0.075,-LANE_EDGE-0.075]].forEach(([a,b])=>{
    const m=new THREE.Mesh(ribbonGeo(a,b,0.14,0,1,ASPH_TILE,false),paint);
    m.frustumCulled=false;
    roadGroup.add(m);
  });

  /* Kerbs. Laid on the inside of anything tighter than a 170 m radius. The
     inside of a turn is the +lateral side when the signed curvature is
     positive, which is exactly how kap is defined.

     Built as a swept ramp rather than a row of slabs: three lateral stations
     (flush with the asphalt, raised mid, raised outer lip) so the profile
     catches the light and reads as a real kerb from inside the cockpit. Each
     corner run gets its stripe period rounded to a whole number of blocks so
     the pattern starts and ends on a block edge instead of mid-stripe. */
  const KERB_TH=1/170, KBLOCK=1.35;              // nominal red/white block length
  const kerbRuns=[];
  {
    let cur=null;
    for(let s=0;s<LAP;s+=1){
      const k=trackK(s);
      const on=Math.abs(k)>KERB_TH;
      if(on){
        const side=k>0?1:-1;
        if(cur && cur.side!==side){ kerbRuns.push(cur); cur=null; }
        if(!cur) cur={s0:s, side};
        cur.s1=s;
      } else if(cur){ kerbRuns.push(cur); cur=null; }
    }
    if(cur) kerbRuns.push(cur);
  }
  const KP=[                                     // lateral offset, height, u
    [LANE_EDGE+0.02,        0.125, 0.00],
    [LANE_EDGE+KERB_W*0.5,  0.215, 0.50],
    [LANE_EDGE+KERB_W,      0.245, 1.00]
  ];
  {
    const pos=[], nrm=[], uv=[], idx=[];
    const p2=new THREE.Vector2(), d2=new THREE.Vector2();
    let base=0;
    kerbRuns.forEach(run=>{
      const len=run.s1-run.s0;
      if(len<6) return;                          // too short to read as a kerb
      const blocks=Math.max(2,Math.round(len/KBLOCK));
      const rings=blocks*3;                      // 3 rings per block keeps curves smooth
      const stripes=blocks/2;                    // one texture tile = red + white
      for(let i=0;i<=rings;i++){
        const t=i/rings, s=run.s0+t*len;
        trackAt(s,p2); trackDir(s,d2);
        const nx=d2.y, nz=-d2.x;                 // unit left normal
        for(let k=0;k<3;k++){
          // mirror the profile for a right-hand kerb, and walk the stations in
          // left-to-right order either way so the winding still faces up
          const st=KP[run.side>0 ? 2-k : k];
          const lat=run.side*st[0];
          pos.push(p2.x+nx*lat, st[1], p2.y+nz*lat);
          nrm.push(0,1,0);
          // u follows the station, never the emission order: u=0 is the
          // rubber-scrubbed track edge on both hands of kerb
          uv.push(st[2], t*stripes);
        }
      }
      for(let i=0;i<rings;i++) for(let k=0;k<2;k++){
        const a=base+i*3+k, b=a+1, c=a+3, d=a+4;
        idx.push(a,b,c, b,d,c);
      }
      base+=(rings+1)*3;
    });
    if(idx.length){
      const G=new THREE.BufferGeometry();
      G.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      G.setAttribute('normal',  new THREE.Float32BufferAttribute(nrm,3));
      G.setAttribute('uv',      new THREE.Float32BufferAttribute(uv,2));
      G.setIndex(pos.length/3>65000 ? new THREE.Uint32BufferAttribute(idx,1)
                                    : new THREE.Uint16BufferAttribute(idx,1));
      G.computeVertexNormals();                  // the ramp faces need real normals
      const kerbMat=new THREE.MeshStandardMaterial({
        map:texKerb, roughness:0.58, metalness:0
      });
      const kerbMesh=new THREE.Mesh(G,kerbMat);
      kerbMesh.frustumCulled=false; kerbMesh.receiveShadow=true;
      roadGroup.add(kerbMesh);
    }
  }

  // reflective marker posts, outside the gravel on both sides
  const mtx=new THREE.Matrix4(), q=new THREE.Quaternion(),
        v3=new THREE.Vector3(), one=new THREE.Vector3(1,1,1),
        p2=new THREE.Vector2(), d2=new THREE.Vector2();
  const postGeo=new THREE.BoxGeometry(0.11,1.05,0.07); postGeo.translate(0,0.525,0);
  const postMat=new THREE.MeshStandardMaterial({color:sRGB(0xe8e5da),roughness:0.6});
  const capMat =new THREE.MeshStandardMaterial({color:sRGB(0xb52d1c),roughness:0.45,
                                                emissive:sRGB(0x521008),emissiveIntensity:.5});
  const capGeo=new THREE.BoxGeometry(0.09,0.16,0.075); capGeo.translate(0,0.86,0);
  const cnt=Math.floor(LAP/45)*2;
  const posts=new THREE.InstancedMesh(postGeo,postMat,cnt);
  const caps =new THREE.InstancedMesh(capGeo, capMat, cnt);
  posts.castShadow=true;
  let k=0;
  for(let i=0;i<cnt/2;i++) for(const sgn of [-1,1]){
    const s=i*45;
    trackAt(s,p2); trackDir(s,d2);
    const lat=sgn*(SHOULDER+0.5);
    v3.set(p2.x+d2.y*lat, 0.02, p2.y-d2.x*lat);
    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(d2.x,d2.y));
    mtx.compose(v3,q,one);
    posts.setMatrixAt(k,mtx); caps.setMatrixAt(k,mtx); k++;
  }
  posts.instanceMatrix.needsUpdate=true; caps.instanceMatrix.needsUpdate=true;
  posts.frustumCulled=false; caps.frustumCulled=false;
  posts.userData.casts=true; shadowCasters.push(posts);
  roadGroup.add(posts,caps);
}

/* --------------------------------------------------------------- barriers */
/* The point of these is visibility, not safety. The track is dead flat, so at
   an eye height of 0.85 m a point 200 m away sits a quarter of a degree below
   the horizon -- the whole 100-300 m braking zone collapses into about four
   pixels, and every flat cue (tarmac, kerbs, painted lines) collapses with it.
   Anything with height does not: a waist-high wall following the track edge
   draws the corner as a line in the air long after the road surface has gone,
   which is what lets you read how sharp the next corner is from the cockpit. */
let BARRIER_LAT=SHOULDER+2.4;
const BARRIER_Y0=0.28, BARRIER_Y1=1.08;
const BARRIER_TILE=fitTile(8);

/* A vertical ribbon: fixed lateral offset, swept between two heights. The
   horizontal ribbonGeo above sweeps between two lateral offsets at one height,
   which is the other half of the same idea. */
function wallGeo(lat,y0,y1,uTile){
  const n=RN+1;
  const pos=new Float32Array(n*2*3), uv=new Float32Array(n*2*2);
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  for(let i=0;i<n;i++){
    const s=i*RSTEP;
    trackAt(s,p); trackDir(s,d);
    const X=p.x+d.y*lat, Z=p.y-d.x*lat, u=s/uTile;
    for(let k=0;k<2;k++){
      const o=i*2+k;
      pos[o*3]=X; pos[o*3+1]=k?y1:y0; pos[o*3+2]=Z;
      uv[o*2]=u;  uv[o*2+1]=k?1:0;
    }
  }
  const idx=(n*2<=65536)?new Uint16Array(RN*6):new Uint32Array(RN*6);
  for(let i=0;i<RN;i++){
    const a=i*2,b=a+1,c=a+2,d2=a+3;
    idx[i*6  ]=a; idx[i*6+1]=c; idx[i*6+2]=b;
    idx[i*6+3]=b; idx[i*6+4]=c; idx[i*6+5]=d2;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

function buildBarriers(){
  // DoubleSide so the winding never matters and the far barrier still reads
  // through a corner from either hand
  const mat=new THREE.MeshStandardMaterial({
    map:texBarrier, side:THREE.DoubleSide, roughness:0.62, metalness:0.15
  });
  [-1,1].forEach(sg=>{
    const m=new THREE.Mesh(wallGeo(sg*BARRIER_LAT,BARRIER_Y0,BARRIER_Y1,BARRIER_TILE),mat);
    m.frustumCulled=false; m.receiveShadow=true;
    m.castShadow=true; m.userData.casts=true; shadowCasters.push(m);
    roadGroup.add(m);
  });
}

/* ------------------------------------------------------- distance boards */
/* Corner entries, and the 200/150/100/50 m boards on the approach to each.
   Boards stand clear of the ground so they keep their angular height at
   distance, which is the same reason the barriers work. */
const CORNER_TH=1/260;                 // anything tighter than 260 m counts
function cornerEntries(){
  const out=[]; let inC=false, startS=0, peak=0;
  for(let s=0;s<LAP;s+=2){
    const k=trackK(s), on=Math.abs(k)>CORNER_TH;
    if(on&&!inC){ inC=true; startS=s; peak=k; }
    else if(on){ if(Math.abs(k)>Math.abs(peak)) peak=k; }
    else if(inC){ inC=false; out.push({s:startS,peak}); }
  }
  if(inC) out.push({s:startS,peak});
  return out;
}

function buildBoards(){
  const ENTRIES=cornerEntries();
  const DISTS=[200,150,100,50];
  const BW=1.7, BH=1.25, POST_H=0.95;
  const slots=DISTS.map(()=>[]);
  const posts=[];
  ENTRIES.forEach(c=>{
    // outside of the corner: the inside is +lateral when curvature is positive
    const side=c.peak>0?-1:1;
    DISTS.forEach((d,di)=>{
      let s=c.s-d; if(s<0) s+=LAP;
      // a board only makes sense on the approach, not buried inside the
      // previous corner, where it would be behind you before it was readable
      if(Math.abs(trackK(s))>CORNER_TH) return;
      slots[di].push({s,side});
      posts.push({s,side});
    });
  });

  const mtx=new THREE.Matrix4(), q=new THREE.Quaternion(),
        v3=new THREE.Vector3(), one=new THREE.Vector3(1,1,1),
        p2=new THREE.Vector2(), d2=new THREE.Vector2(),
        AXIS=new THREE.Vector3(0,1,0);
  const place=(s,side,y)=>{
    trackAt(s,p2); trackDir(s,d2);
    const lat=side*(SHOULDER+1.9);
    v3.set(p2.x+d2.y*lat, y, p2.y-d2.x*lat);
    // face back down the track so it is readable on the approach
    q.setFromAxisAngle(AXIS, Math.atan2(-d2.x,-d2.y));
    mtx.compose(v3,q,one);
    return mtx;
  };

  const boardGeo=new THREE.PlaneGeometry(BW,BH);
  DISTS.forEach((d,di)=>{
    const list=slots[di];
    if(!list.length) return;
    const tex=new THREE.CanvasTexture(boardTexture(d));
    tex.anisotropy=MAXANISO; tex.encoding=THREE.sRGBEncoding;
    const mat=new THREE.MeshStandardMaterial({map:tex,side:THREE.DoubleSide,roughness:0.7});
    const im=new THREE.InstancedMesh(boardGeo,mat,list.length);
    list.forEach((b,i)=>im.setMatrixAt(i,place(b.s,b.side,POST_H+BH/2)));
    im.instanceMatrix.needsUpdate=true;
    im.frustumCulled=false;
    im.castShadow=true; im.userData.casts=true; shadowCasters.push(im);
    roadGroup.add(im);
  });

  if(posts.length){
    const pg=new THREE.BoxGeometry(0.1,POST_H,0.1); pg.translate(0,POST_H/2,0);
    const pm=new THREE.MeshStandardMaterial({color:sRGB(0x2a2e32),roughness:0.6});
    const im=new THREE.InstancedMesh(pg,pm,posts.length);
    posts.forEach((b,i)=>im.setMatrixAt(i,place(b.s,b.side,0)));
    im.instanceMatrix.needsUpdate=true;
    im.frustumCulled=false;
    roadGroup.add(im);
  }
}

/* ----------------------------------------------------------- racing line */
/* A real line, not the centreline painted a different colour -- with the car
   free to steer, a line you can actually take is finally worth drawing.

   Built by minimum-curvature relaxation: start on the centreline, then
   repeatedly pull each point toward the midpoint of its neighbours and clamp
   it back inside the track. Straightening a path is exactly what lowering its
   curvature means, so this converges on the classic outside-apex-outside
   shape on its own, without any corner-detection heuristics.

   Colour is the speed profile, so it doubles as the braking guide: the
   backward pass is the one that finds braking points, since it walks back
   from each corner asking how early you must be off the brakes to arrive at
   the speed the corner allows. */
const RL_STEP=4;                            // metres between line points
const RL_N=Math.round(LAP/RL_STEP);
const RL_MARGIN=1.35;                       // keep the car's width off the kerb
const RL_LIMIT=ROAD_HALF-RL_MARGIN;
const RL_ITER=1200;
const A_BRAKE=40, A_ACCEL=13;               // m/s^2 used for the profile
let rlN=null, rlV=null, rlState=null, rlMesh=null;

function buildRacingLine(){
  rlN=new Float32Array(RL_N);
  const cx=new Float32Array(RL_N), cz=new Float32Array(RL_N),
        nx=new Float32Array(RL_N), nz=new Float32Array(RL_N);
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  for(let i=0;i<RL_N;i++){
    const s=i*RL_STEP;
    trackAt(s,p); trackDir(s,d);
    cx[i]=p.x; cz[i]=p.y; nx[i]=d.y; nz[i]=-d.x;   // unit left normal
  }
  // relax. Each sweep moves every point a little way toward the midpoint of
  // its neighbours, measured back onto that point's own cross-section.
  const alpha=0.35;
  for(let it=0;it<RL_ITER;it++){
    for(let i=0;i<RL_N;i++){
      const a=(i-1+RL_N)%RL_N, b=(i+1)%RL_N;
      const ax=cx[a]+nx[a]*rlN[a], az=cz[a]+nz[a]*rlN[a];
      const bx=cx[b]+nx[b]*rlN[b], bz=cz[b]+nz[b]*rlN[b];
      const mx=(ax+bx)*0.5, mz=(az+bz)*0.5;
      // lateral offset of that midpoint on this point's cross-section
      const t=(mx-cx[i])*nx[i]+(mz-cz[i])*nz[i];
      rlN[i]=clamp(rlN[i]+alpha*(t-rlN[i]), -RL_LIMIT, RL_LIMIT);
    }
  }

  // curvature of the resulting line, from the circle through each triple
  const kap2=new Float32Array(RL_N);
  const px=new Float32Array(RL_N), pz=new Float32Array(RL_N);
  for(let i=0;i<RL_N;i++){ px[i]=cx[i]+nx[i]*rlN[i]; pz[i]=cz[i]+nz[i]*rlN[i]; }
  for(let i=0;i<RL_N;i++){
    const a=(i-1+RL_N)%RL_N, b=(i+1)%RL_N;
    const x1=px[a],z1=pz[a], x2=px[i],z2=pz[i], x3=px[b],z3=pz[b];
    const A=Math.hypot(x2-x1,z2-z1), B=Math.hypot(x3-x2,z3-z2), C=Math.hypot(x3-x1,z3-z1);
    const area=Math.abs((x2-x1)*(z3-z1)-(x3-x1)*(z2-z1))*0.5;
    kap2[i]= (A*B*C>1e-6) ? (4*area)/(A*B*C) : 0;      // 1/R via the circumradius
  }

  /* Speed profile. Corner limit first, then a backward pass for braking and a
     forward pass for how fast you can actually get back up to it -- run twice
     because the two constrain each other around a corner. */
  rlV=new Float32Array(RL_N);
  const segLen=new Float32Array(RL_N);
  for(let i=0;i<RL_N;i++){
    const b=(i+1)%RL_N;
    segLen[i]=Math.hypot(px[b]-px[i],pz[b]-pz[i]);
    rlV[i]=Math.min(MAXSPEED, kap2[i]>1e-6?Math.sqrt(A_GRIP/kap2[i]):MAXSPEED);
  }
  for(let pass=0;pass<2;pass++){
    for(let k=0;k<RL_N;k++){                          // backward: braking
      const i=(RL_N-1-k), b=(i+1)%RL_N;
      rlV[i]=Math.min(rlV[i], Math.sqrt(rlV[b]*rlV[b]+2*A_BRAKE*segLen[i]));
    }
    for(let i=0;i<RL_N*2;i++){                        // forward: power
      const c=i%RL_N, a=(c-1+RL_N)%RL_N;
      rlV[c]=Math.min(rlV[c], Math.sqrt(rlV[a]*rlV[a]+2*A_ACCEL*segLen[a]));
    }
  }

  // classify: braking / at the limit / full throttle
  rlState=new Uint8Array(RL_N);
  for(let i=0;i<RL_N;i++){
    const b=(i+1)%RL_N;
    const dv=(rlV[b]-rlV[i])/Math.max(segLen[i],0.01);
    rlState[i] = dv<-0.035 ? 2 : (rlV[i]<MAXSPEED*0.97 ? 1 : 0);
  }

  // ribbon, laid just above the asphalt and tinted by that classification
  const W=0.30;                                        // half width
  const pos=new Float32Array((RL_N+1)*2*3), col=new Float32Array((RL_N+1)*2*3);
  const idx=new Uint32Array(RL_N*6);
  const C_GO=sRGB(0x35d84a), C_LIM=sRGB(0xf2c40c), C_BRK=sRGB(0xe12d1b);
  for(let i=0;i<=RL_N;i++){
    const j=i%RL_N;
    const c=rlState[j]===2?C_BRK:(rlState[j]===1?C_LIM:C_GO);
    for(let k=0;k<2;k++){
      const o=i*2+k, lat=rlN[j]+(k?-W:W);
      pos[o*3  ]=cx[j]+nx[j]*lat;
      pos[o*3+1]=0.135;
      pos[o*3+2]=cz[j]+nz[j]*lat;
      col[o*3]=c.r; col[o*3+1]=c.g; col[o*3+2]=c.b;
    }
  }
  for(let i=0;i<RL_N;i++){
    const a=i*2,b=a+1,c=a+2,d2=a+3;
    idx[i*6  ]=a; idx[i*6+1]=b; idx[i*6+2]=c;
    idx[i*6+3]=b; idx[i*6+4]=d2; idx[i*6+5]=c;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',   new THREE.BufferAttribute(col,3));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeVertexNormals();
  const m=new THREE.MeshBasicMaterial({
    vertexColors:true, transparent:true, opacity:0.78,
    polygonOffset:true, polygonOffsetFactor:-10, polygonOffsetUnits:-10
  });
  rlMesh=new THREE.Mesh(g,m);
  rlMesh.frustumCulled=false;
  rlMesh.visible=false;                                // off until L is pressed
  roadGroup.add(rlMesh);
}

/* ---------------------------------------------------- start / finish line */
function buildStartLine(){
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  trackAt(FINISH_S,p); trackDir(FINISH_S,d);
  const yaw=Math.atan2(d.x,d.y);

  const g=new THREE.Group();
  g.position.set(p.x,0,p.y);
  g.rotation.y=yaw;
  scene.add(g);
  // inside the group, +z is along the track and +x is the driver's left

  const white=sRGB(0xf2f0e8), dark=sRGB(0x121417);
  const flat=(col,off)=>new THREE.MeshStandardMaterial({
    color:col, roughness:0.62, metalness:0,
    polygonOffset:true, polygonOffsetFactor:off, polygonOffsetUnits:off
  });

  /* A single painted stripe vanishes at racing speed, so the line is a broad
     chequered band: a solid bar either side of a two-row chequer, run right
     across the asphalt. Drawn as one instanced mesh of squares. */
  const BAND=2.6, SQ=0.65, ROWS=2;
  const cols=Math.floor(ROAD_HALF*2/SQ);
  const sqGeo=new THREE.PlaneGeometry(SQ,SQ); sqGeo.rotateX(-Math.PI/2);
  const darkSq=new THREE.InstancedMesh(sqGeo,flat(dark,-8),cols*ROWS);
  const liteSq=new THREE.InstancedMesh(sqGeo,flat(white,-8),cols*ROWS);
  const m4=new THREE.Matrix4(), qq=new THREE.Quaternion(), one=new THREE.Vector3(1,1,1);
  const vv=new THREE.Vector3();
  let di=0, li=0;
  for(let r=0;r<ROWS;r++) for(let cI=0;cI<cols;cI++){
    vv.set(-ROAD_HALF+SQ*0.5+cI*SQ, 0.150, (r-(ROWS-1)/2)*SQ);
    m4.compose(vv,qq,one);
    if((r+cI)&1) liteSq.setMatrixAt(li++,m4); else darkSq.setMatrixAt(di++,m4);
  }
  m4.compose(vv.set(0,-500,0),qq,one);
  for(let i=di;i<darkSq.count;i++) darkSq.setMatrixAt(i,m4);
  for(let i=li;i<liteSq.count;i++) liteSq.setMatrixAt(i,m4);
  darkSq.instanceMatrix.needsUpdate=liteSq.instanceMatrix.needsUpdate=true;
  darkSq.frustumCulled=liteSq.frustumCulled=false;
  g.add(darkSq,liteSq);
  // solid bars bracketing the chequer
  [-1,1].forEach(s=>{
    const bar=new THREE.Mesh(new THREE.PlaneGeometry(ROAD_HALF*2,0.42),flat(white,-8));
    bar.rotation.x=-Math.PI/2;
    bar.position.set(0,0.150,s*(BAND*0.5-0.21));
    g.add(bar);
  });

  // gantry: two uprights outside the gravel and a deep beam over the road
  const steel=new THREE.MeshStandardMaterial({color:sRGB(0x24282c),roughness:0.5,metalness:0.6});
  const H=7.6, LEGX=SHOULDER+1.4, SPAN=LEGX*2+0.9;
  [-1,1].forEach(s=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.46,H,0.46),steel);
    leg.position.set(s*LEGX,H/2,0);
    leg.castShadow=true; leg.userData.casts=true; shadowCasters.push(leg);
    g.add(leg);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.35,1.5),steel);
    foot.position.set(s*LEGX,0.175,0); g.add(foot);
  });
  const beam=new THREE.Mesh(new THREE.BoxGeometry(SPAN,1.5,0.62),steel);
  beam.position.y=H-0.75;
  beam.castShadow=true; beam.userData.casts=true; shadowCasters.push(beam);
  g.add(beam);
  // chequered facing on the beam, on the approach side, so it reads head-on
  const bcols=Math.floor(SPAN/0.75);
  const face=new THREE.PlaneGeometry(0.75,0.5);
  const fD=new THREE.InstancedMesh(face,new THREE.MeshStandardMaterial({color:dark,roughness:.6}),bcols*2);
  const fL=new THREE.InstancedMesh(face,new THREE.MeshStandardMaterial({color:white,roughness:.6}),bcols*2);
  let ai=0,bi=0;
  for(let r=0;r<2;r++) for(let cI=0;cI<bcols;cI++){
    vv.set(-SPAN/2+0.375+cI*0.75, H-0.35-r*0.5, -0.32);
    m4.compose(vv,qq,one);
    if((r+cI)&1) fL.setMatrixAt(bi++,m4); else fD.setMatrixAt(ai++,m4);
  }
  m4.compose(vv.set(0,-500,0),qq,one);
  for(let i=ai;i<fD.count;i++) fD.setMatrixAt(i,m4);
  for(let i=bi;i<fL.count;i++) fL.setMatrixAt(i,m4);
  fD.instanceMatrix.needsUpdate=fL.instanceMatrix.needsUpdate=true;
  fD.frustumCulled=fL.frustumCulled=false;
  g.add(fD,fL);

  // five start lights, dark — decoration, not a sequence
  const bulbGeo=new THREE.SphereGeometry(0.26,12,8);
  const bulbMat=new THREE.MeshStandardMaterial({color:sRGB(0x2a0705),roughness:0.35,
                                                emissive:sRGB(0x3d0b06),emissiveIntensity:0.6});
  for(let i=0;i<5;i++){
    const b=new THREE.Mesh(bulbGeo,bulbMat);
    b.position.set((i-2)*0.95, H-1.75, -0.42);
    g.add(b);
  }

  /* Boards either side of the line. Deliberately tall and close to the
     asphalt: from the cockpit these flick past at the exact moment you cross,
     which is what actually makes the line obvious at 300 kph. */
  [-1,1].forEach(s=>{
    const post=new THREE.Mesh(new THREE.BoxGeometry(0.18,2.7,0.18),steel);
    post.position.set(s*(ROAD_HALF+1.5),1.35,0); g.add(post);
    const board=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.25),
      new THREE.MeshStandardMaterial({color:white,roughness:0.6,side:THREE.DoubleSide}));
    board.position.set(s*(ROAD_HALF+1.5),2.6,0);
    board.rotation.y=Math.PI/2;
    board.castShadow=true; board.userData.casts=true; shadowCasters.push(board);
    g.add(board);
    const stripe=new THREE.Mesh(new THREE.PlaneGeometry(2.4,0.32),
      new THREE.MeshStandardMaterial({color:sRGB(0xb4291a),roughness:0.6,side:THREE.DoubleSide}));
    stripe.position.set(s*(ROAD_HALF+1.5)+0.02*s,2.6,0);
    stripe.rotation.y=Math.PI/2;
    g.add(stripe);
  });
}

/* ------------------------------------------------------- start-light rig */
/* The start/finish gantry is 580 m up the road from the grid, far too distant
   to read a light sequence off, so the lights get their own gantry just ahead
   of the car -- which is also where they sit on a real grid. Five columns of
   two, matching the real panel. Each column owns its material so it can be
   lit independently. */
const bulbMats=[];
const L_ON_C =sRGB(0xff5a22), L_ON_E =sRGB(0xff2f0a);
const L_OFF_C=sRGB(0x300d08), L_OFF_E=sRGB(0x120302);
const LIGHTS_AHEAD=40;   // close enough that the halo strut does not hide the panel

function buildStartLights(){
  const s=START_S+LIGHTS_AHEAD;
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  trackAt(s,p); trackDir(s,d);
  const g=new THREE.Group();
  g.position.set(p.x,0,p.y);
  g.rotation.y=Math.atan2(d.x,d.y);
  scene.add(g);
  // in group space +z is the direction of travel, so the car sits at -z and
  // the panel has to face back toward it
  const steel=new THREE.MeshStandardMaterial({color:sRGB(0x24282c),roughness:0.5,metalness:0.6});
  const H=7.2, LEGX=SHOULDER+1.4;
  [-1,1].forEach(sg=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.4,H,0.4),steel);
    leg.position.set(sg*LEGX,H/2,0);
    leg.castShadow=true; leg.userData.casts=true; shadowCasters.push(leg);
    g.add(leg);
  });
  const beam=new THREE.Mesh(new THREE.BoxGeometry(LEGX*2+0.8,0.5,0.45),steel);
  beam.position.y=H-0.25;
  beam.castShadow=true; beam.userData.casts=true; shadowCasters.push(beam);
  g.add(beam);

  const COLS=5, GAPX=1.28, GAPY=1.08, R=0.43;
  const panel=new THREE.Mesh(
    new THREE.BoxGeometry(COLS*GAPX+0.5, GAPY+R*2+0.5, 0.24),
    new THREE.MeshStandardMaterial({color:sRGB(0x0d0b0a),roughness:0.8}));
  panel.position.set(0, H-1.55, -0.16);
  panel.castShadow=true; panel.userData.casts=true; shadowCasters.push(panel);
  g.add(panel);

  const bulbGeo=new THREE.SphereGeometry(R,14,10);
  for(let i=0;i<COLS;i++){
    const m=new THREE.MeshStandardMaterial({
      color:L_OFF_C, emissive:L_OFF_E, emissiveIntensity:0.35, roughness:0.32
    });
    bulbMats.push(m);
    for(let r=0;r<2;r++){
      const b=new THREE.Mesh(bulbGeo,m);
      b.position.set((i-(COLS-1)/2)*GAPX, H-1.55+(r?-GAPY/2:GAPY/2), -0.30);
      g.add(b);
    }
  }
}

/* -------------------------------------------------------------- mountains */
const mountainGroup=new THREE.Group(); scene.add(mountainGroup);
function buildMountains(){
  const rand=mulberry32(90210);
  const chunks=[];
  let vTotal=0;

  function pyramid(R,H,seed){
    // square-based pyramid, subdivided and roughened into crags.
    // displacement stays modest so the four faces still read as a pyramid.
    let g=new THREE.ConeGeometry(R,H,4,10,false);
    g.translate(0,H/2,0);
    const p=g.attributes.position;
    const r2=mulberry32(seed);
    const ph=r2()*100;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
      const t=clamp(y/H,0,1);
      // pin the apex and the base ring, bulge the middle
      const env=Math.sin(Math.PI*t)*0.9+0.1;
      const n1=fbm(x*0.012+ph, z*0.012+ph,4)-0.5;
      const n2=fbm(x*0.05+ph,  z*0.05+ph, 3)-0.5;
      const d=(n1*0.16+n2*0.05)*env;
      const len=Math.hypot(x,z)||1;
      p.setX(i,x+(x/len)*d*R*0.85);
      p.setZ(i,z+(z/len)*d*R*0.85);
      p.setY(i,y+(n2*0.5)*env*H*0.05);
    }
    g=g.toNonIndexed();
    return g;
  }

  function faceUVsAndColour(g,H,uvScale,uOff,vOff,seed){
    g.computeVertexNormals();
    const p=g.attributes.position, nr=g.attributes.normal;
    const uv=new Float32Array(p.count*2), col=new Float32Array(p.count*3);
    // Near-white tints so the photo supplies the colour. A grey ramp here
    // multiplies the texture down to mush.
    const rock=new THREE.Color(1.14,1.09,1.02);   // sun-facing rock, slightly warm
    const dark=new THREE.Color(0.50,0.51,0.58);   // crevices, cool bounce light
    const c=new THREE.Color();
    const rr=mulberry32(seed);
    const jx=rr()*80, jz=rr()*80;
    for(let f=0;f<p.count;f+=3){
      const nx=Math.abs(nr.getX(f)), ny=Math.abs(nr.getY(f)), nz=Math.abs(nr.getZ(f));
      for(let k=0;k<3;k++){
        const i=f+k, x=p.getX(i), y=p.getY(i), z=p.getZ(i);
        let u,v;
        if(ny>nx&&ny>nz){ u=x; v=z; }
        else if(nx>nz){   u=z; v=y; }
        else {            u=x; v=y; }
        uv[i*2]  =(u+jx)*uvScale+uOff;
        uv[i*2+1]=(v+jz)*uvScale+vOff;
        const t=y/H;
        const grit=fbm(x*0.06+jx, z*0.06+jz,3);
        // shade by height, grit and how much the face points at the sky
        c.copy(dark).lerp(rock, clamp(t*0.55+grit*0.62+ny*0.30,0,1));
        col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
      }
    }
    g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    g.setAttribute('color',new THREE.BufferAttribute(col,3));
    return g;
  }

  function place(x,z,R,H,seed){
    const rr=mulberry32(seed+7);
    const uvS=0.0030+rr()*0.0015, uo=rr()*20, vo=rr()*20;
    let g=pyramid(R,H,seed);
    g=faceUVsAndColour(g,H,uvS,uo,vo,seed+3);
    g.rotateY(rr()*Math.PI*2);
    // sunk well below the rolling ground so no base ever pokes into view
    g.translate(x, terrainH(x,z)-H*0.05-26, z);
    chunks.push(g); vTotal+=g.attributes.position.count;
  }

  /* A ring right around the circuit, offset from the track's own bounding box
     so the peaks stay a consistent distance out on every side rather than
     bunching at the narrow ends. */
  const HX=(TRK_MAXX-TRK_MINX)/2, HZ=(TRK_MAXZ-TRK_MINZ)/2;
  function ringPos(a,near,depth,r){
    const g=near+r*depth;
    return [Math.cos(a)*(HX+g), Math.sin(a)*(HZ+g)];
  }
  // inner ridgeline — the peaks you actually see over the treetops
  for(let i=0;i<30;i++){
    const a=(i/30)*Math.PI*2+rand()*0.12;
    const [x,z]=ringPos(a,560,420,rand());
    place(x,z,150+rand()*170, 200+rand()*250, 1000+i);
  }
  // outer wall — taller, hazier
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2+0.11+rand()*0.14;
    const [x,z]=ringPos(a,1080,900,rand());
    place(x,z,220+rand()*260, 330+rand()*380, 2000+i);
  }
  // foothills tucked in front, breaking up the base of the ridge
  for(let i=0;i<22;i++){
    const a=rand()*Math.PI*2;
    const [x,z]=ringPos(a,400,300,rand());
    place(x,z,70+rand()*70, 55+rand()*110, 3000+i);
  }

  // merge into one draw call
  const pos=new Float32Array(vTotal*3), nrm=new Float32Array(vTotal*3),
        uv =new Float32Array(vTotal*2), col=new Float32Array(vTotal*3);
  let o=0;
  chunks.forEach(g=>{
    pos.set(g.attributes.position.array,o*3);
    nrm.set(g.attributes.normal.array,  o*3);
    uv .set(g.attributes.uv.array,      o*2);
    col.set(g.attributes.color.array,   o*3);
    o+=g.attributes.position.count;
  });
  const G=new THREE.BufferGeometry();
  G.setAttribute('position',new THREE.BufferAttribute(pos,3));
  G.setAttribute('normal',  new THREE.BufferAttribute(nrm,3));
  G.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  G.setAttribute('color',   new THREE.BufferAttribute(col,3));

  const rockMap=cloneTex(texRock);
  rockMap.wrapS=rockMap.wrapT=THREE.RepeatWrapping;
  rockMap.encoding=THREE.sRGBEncoding; rockMap.anisotropy=MAXANISO;
  const m=new THREE.MeshStandardMaterial({
    map:rockMap, vertexColors:true, roughness:0.98, metalness:0, flatShading:true
  });
  const mesh=new THREE.Mesh(G,m);
  mesh.frustumCulled=false;
  mountainGroup.add(mesh);
}

/* -------------------------------------------------------------------- car */
/* The GLB was rebuilt so each wheel is its own node sitting exactly on its
   axle, with the mesh recentred -- so spinning a wheel is just rotation.x. */
const carGroup=new THREE.Group(); scene.add(carGroup);
const wheels=[];
let carObj=null, wheelR=0.357, steer=null, wingL=null, wingR=null;
/* Contact patches and low points of the bodywork, in carGroup space, measured
   from the model once it loads rather than assumed. */
const CARPTS=[], CARLOW=[];
let CAR_WB=3.4, CAR_TR=1.9, RIDE=0.125;
const STEER_AXIS=new THREE.Vector3(0,0.456,0.890).normalize();
const CAR_LEN=5.60;                     // 2025-spec car length, metres
const WHEELBASE=3.60;

(function loadCar(){
  pending++;
  const loader=new THREE.GLTFLoader();
  if(self.MeshoptDecoder) loader.setMeshoptDecoder(self.MeshoptDecoder);
  loader.load(ASSETS.car, gltf=>{
    const car=gltf.scene;
    car.updateMatrixWorld(true);
    const b0=new THREE.Box3().setFromObject(car);
    car.scale.setScalar(CAR_LEN/(b0.max.z-b0.min.z));
    car.updateMatrixWorld(true);
    const b1=new THREE.Box3().setFromObject(car);
    car.position.y=-b1.min.y;           // drop the tyres onto the deck
    carGroup.add(car); carObj=car;

    for(const n of ['Wheel_FL','Wheel_FR','Wheel_RL','Wheel_RR']){
      const w=car.getObjectByName(n);
      if(!w) continue;
      w.userData.steers = (n==='Wheel_FL'||n==='Wheel_FR');
      wheels.push(w);
    }
    /* gltfpack's shared quantisation grid leaves each mesh at its authored
       position, so a pivot node's child still carries the full offset.
       Cancel it and the node rotates about its own origin.                */
    const pivotFix=o=>{
      if(!o) return null;
      const c=o.position.clone();
      o.children.forEach(ch=>ch.position.sub(c));
      return o;
    };
    steer=pivotFix(car.getObjectByName('SteerWheel'));
    // column axis measured off the rim: tilted back 27 deg, like the real car
    if(steer) STEER_AXIS.set(0,0.456,0.890).normalize();

    /* The dash display and the rev-light strip are primitives of the Body
       mesh, not of SteerWheel -- there is no node for them in the GLB at all,
       so the rim turned and they stayed put. Every glTF primitive arrives as
       its own Mesh, so they can simply be reparented onto the wheel node,
       which is where the rotation is applied.

       Found by containment in the wheel's own bounds rather than by index, so
       this survives a re-export: the parts that belong to the wheel are
       exactly the ones that fit inside it. The cockpit surround and halo
       overlap the wheel but always spill outside that box, so they are left
       alone. attach() preserves world transform, so nothing moves -- the
       parts just start turning. */
    if(steer){
      carGroup.updateMatrixWorld(true);
      const wb=new THREE.Box3().setFromObject(steer);
      const body=car.getObjectByName('Body');
      if(body && !wb.isEmpty()){
        wb.expandByScalar(0.02);
        const cand=[];
        body.traverse(o=>{ if(o.isMesh) cand.push(o); });
        const bb=new THREE.Box3();
        let adopted=0;
        // collect first, then reparent -- mutating during a traverse is unsafe
        for(const m of cand){
          bb.setFromObject(m);
          if(!bb.isEmpty() && wb.containsBox(bb)){ steer.attach(m); adopted++; }
        }
        if(!adopted) console.warn('steering wheel: no dash parts adopted');
      }
    }
    // the over-wheel winglets are mounted to the uprights: they steer but
    // must not roll with the tyre, so they get their own pivot nodes
    wingL=pivotFix(car.getObjectByName('Wing_FL'));
    wingR=pivotFix(car.getObjectByName('Wing_FR'));
    if(wheels.length){
      carGroup.updateMatrixWorld(true);
      const wb=new THREE.Box3().setFromObject(wheels[0]);
      const r=(wb.max.y-wb.min.y)/2;
      if(r>0.05) wheelR=r;              // rolling radius, for the spin rate
    }
    car.traverse(o=>{
      if(!o.isMesh) return;
      o.castShadow=true; o.receiveShadow=true;
      o.userData.casts=true; shadowCasters.push(o);
      const ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(m=>{ if(m && m.map) m.map.anisotropy=MAXANISO; });
    });
    /* The ground code needs to know the shape of the thing it is standing up.
       Guessing it was the bug: the surface was sampled 1.6 m fore and aft while
       the car is 5.6 m long, and the body was then rotated about its middle, so
       the nose and tail swung well outside anything that had been measured and
       dug into the road. These are the real contact patches -- each wheel's
       centre dropped by its own radius -- plus the lowest corners of the
       bodywork, all in the group's own space. */
    carGroup.updateMatrixWorld(true);
    const _lp=new THREE.Vector3();
    CARPTS.length=0; CARLOW.length=0;
    wheels.forEach(w=>{
      const wb=new THREE.Box3().setFromObject(w);
      wb.getCenter(_lp); carGroup.worldToLocal(_lp);
      CARPTS.push({x:_lp.x, y:_lp.y-(wb.max.y-wb.min.y)/2, z:_lp.z});
    });
    CARPTS.forEach(c=>CARLOW.push(c));
    if(CARPTS.length===4){
      CAR_WB=Math.abs(CARPTS[0].z-CARPTS[2].z)||3.4;
      CAR_TR=Math.abs(CARPTS[0].x-CARPTS[1].x)||1.9;
      // order them so the plane fit knows which end is which
      CARPTS.sort((a,b)=>b.z-a.z);
      if(CARPTS[0].x<CARPTS[1].x) CARPTS.splice(0,2,CARPTS[1],CARPTS[0]);
      if(CARPTS[2].x<CARPTS[3].x) CARPTS.splice(2,2,CARPTS[3],CARPTS[2]);
      CAR_WB=Math.abs((CARPTS[0].z+CARPTS[1].z)/2-(CARPTS[2].z+CARPTS[3].z)/2)||3.4;
      CAR_TR=Math.abs((CARPTS[0].x+CARPTS[2].x)/2-(CARPTS[1].x+CARPTS[3].x)/2)||1.9;
    }
    RIDE = -(CARPTS.length?Math.min(...CARPTS.map(c=>c.y)):-0.125);
    console.log('car footprint: wheelbase '+CAR_WB.toFixed(2)+' m, track '+CAR_TR.toFixed(2)
                +' m, ride offset '+RIDE.toFixed(3)+' m, '+CARLOW.length+' low points');
    carGroup.position.y=RIDE;           // wheels exactly on the deck
    loaded++; bar.style.width=Math.round(loaded/pending*100)+'%';
    if(loaded>=pending) ready();
  }, undefined, err=>{
    console.error('car failed to load',err);
    loaded++; if(loaded>=pending) ready();
  });
})();

/* model-space point -> world, so cameras can be bolted to real car features */
const _cp=new THREE.Vector3();
function carPoint(x,y,z){
  _cp.set(x,y,z);
  if(carObj) return carObj.localToWorld(_cp);
  return _cp.set(carGroup.position.x,y,carGroup.position.z);
}

/* ----------------------------------------------------------------- debris */
/* Bodywork that comes off in a barrier hit. A single instanced mesh with a
   pool of pieces: a hit wakes as many as the impact deserves, they tumble
   under gravity, bounce once or twice and lie there until their life runs
   out. Retired pieces are parked far under the world rather than resized to
   nothing, which would still cost the same draw. */
/* Pieces come off as recognisable bodywork rather than generic blocks: a
   wing element, an endplate or barge board, and small chunks like mirrors and
   winglets. Each shape needs its own geometry and so its own instanced mesh,
   so the pool is split three ways and a hit draws from all of them. */
const DEBRIS_KINDS=[
  { // wing element: long, wide and very thin
    dim:[1.15,0.045,0.26], n:16, weight:3, spin:9,
    cols:[0xd6600f,0xd6600f,0x151517,0xe8e6de] },
  { // endplate / barge board: an upright panel
    dim:[0.30,0.50,0.035], n:16, weight:3, spin:11,
    cols:[0x151517,0x1d1d20,0xd6600f,0x0d3f56] },
  { // mirror, vent, winglet: small solid chunks
    dim:[0.24,0.15,0.19], n:16, weight:2, spin:16,
    cols:[0x151517,0x0d3f56,0xd6600f,0x1d1d20] }
];
const debrisPools=[];

(function initDebris(){
  const mtx=new THREE.Matrix4(), q=new THREE.Quaternion(),
        v=new THREE.Vector3(0,-800,0), one=new THREE.Vector3(1,1,1);
  mtx.compose(v,q,one);
  DEBRIS_KINDS.forEach(k=>{
    const g=new THREE.BoxGeometry(k.dim[0],k.dim[1],k.dim[2]);
    // r128 drops instanceColor unless USE_COLOR is on, and that needs a real
    // colour attribute present -- a neutral white one turns it on
    const white=new Float32Array(g.attributes.position.count*3); white.fill(1);
    g.setAttribute('color',new THREE.BufferAttribute(white,3));
    const m=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.52,metalness:0.2});
    const mesh=new THREE.InstancedMesh(g,m,k.n);
    mesh.frustumCulled=false;
    mesh.castShadow=true; mesh.userData.casts=true; shadowCasters.push(mesh);
    scene.add(mesh);
    const items=[];
    for(let i=0;i<k.n;i++){ items.push({life:0}); mesh.setMatrixAt(i,mtx); }
    mesh.instanceMatrix.needsUpdate=true;
    debrisPools.push({mesh, items, spin:k.spin, weight:k.weight,
                      cols:k.cols.map(c=>sRGB(c))});
  });
})();

const _dmtx=new THREE.Matrix4(), _dq=new THREE.Quaternion(), _de=new THREE.Euler(),
      _dv=new THREE.Vector3(), _ds=new THREE.Vector3();

function spawnPiece(vIn){
  // pick a shape by weight, then the first free slot in that pool
  let total=0; debrisPools.forEach(p=>total+=p.weight);
  let r=Math.random()*total, pool=debrisPools[0];
  for(const p of debrisPools){ r-=p.weight; if(r<=0){ pool=p; break; } }
  const items=pool.items;
  let slot=0, oldest=1e9;
  for(let i=0;i<items.length;i++){
    if(items[i].life<=0){ slot=i; oldest=-1; break; }
    if(items[i].life<oldest){ oldest=items[i].life; slot=i; }
  }
  const d=items[slot];
  const h=carGroup.rotation.y, fx=Math.sin(h), fz=Math.cos(h);
  d.x=carGroup.position.x+(Math.random()-0.5)*1.8;
  d.y=0.45+Math.random()*0.6;
  d.z=carGroup.position.z+(Math.random()-0.5)*1.8;
  const carry=carState.speed*(0.35+Math.random()*0.35);
  d.vx=fx*carry+(Math.random()-0.5)*vIn*1.8;
  d.vy=1.6+Math.random()*(1.2+vIn*0.35);
  d.vz=fz*carry+(Math.random()-0.5)*vIn*1.8;
  const sp=pool.spin;
  d.wx=(Math.random()-0.5)*sp; d.wy=(Math.random()-0.5)*sp; d.wz=(Math.random()-0.5)*sp;
  d.rx=Math.random()*6.283; d.ry=Math.random()*6.283; d.rz=Math.random()*6.283;
  d.sc=0.85+Math.random()*0.5;
  d.life=6+Math.random()*4;
  pool.mesh.setColorAt(slot, pool.cols[(Math.random()*pool.cols.length)|0]);
  if(pool.mesh.instanceColor) pool.mesh.instanceColor.needsUpdate=true;
}
function hitBarrier(vIn){
  const n=clamp(Math.round(vIn*0.75),1,8);
  for(let i=0;i<n;i++) spawnPiece(vIn);
}
function clearDebris(){
  _dv.set(0,-800,0); _dq.identity(); _ds.set(1,1,1);
  _dmtx.compose(_dv,_dq,_ds);
  debrisPools.forEach(p=>{
    for(let i=0;i<p.items.length;i++){ p.items[i].life=0; p.mesh.setMatrixAt(i,_dmtx); }
    p.mesh.instanceMatrix.needsUpdate=true;
  });
}
function updateDebris(dt){
  debrisPools.forEach(pool=>{
    let live=false;
    const items=pool.items;
    for(let i=0;i<items.length;i++){
      const d=items[i];
      if(d.life<=0) continue;
      live=true;
      d.life-=dt;
      d.vy-=9.81*dt;
      d.x+=d.vx*dt; d.y+=d.vy*dt; d.z+=d.vz*dt;
      const floor=terrainH(d.x,d.z)+0.05;
      if(d.y<floor){
        d.y=floor;
        if(d.vy<-0.6){ d.vy=-d.vy*0.32; }      // bounce, losing most of it
        else { d.vy=0; d.vx*=0.72; d.vz*=0.72; d.wx*=0.5; d.wy*=0.5; d.wz*=0.5; }
        d.vx*=0.78; d.vz*=0.78;
      }
      d.rx+=d.wx*dt; d.ry+=d.wy*dt; d.rz+=d.wz*dt;
      if(d.life<=0){ _dv.set(0,-800,0); _dq.identity(); _ds.set(1,1,1); }
      else{
        _dv.set(d.x,d.y,d.z);
        _de.set(d.rx,d.ry,d.rz); _dq.setFromEuler(_de);
