        // shrink away over the last second rather than vanishing mid-frame
        const f=d.sc*Math.min(1,d.life);
        _ds.set(f,f,f);
      }
      _dmtx.compose(_dv,_dq,_ds);
      pool.mesh.setMatrixAt(i,_dmtx);
    }
    if(live) pool.mesh.instanceMatrix.needsUpdate=true;
  });
}

/* ------------------------------------------------------------------ trees */
const windU={value:0};
const treeGroup=new THREE.Group(); scene.add(treeGroup);

const TREE_MARGIN=650;                  // how far past the circuit the forest runs
const TCELL=500;                        // culling bucket size

function makeTrees(){
  const buf=GEO_BUF;
  const man=ASSETS.geoManifest;
  if(!buf||!man) return;

  const barkMat=new THREE.MeshStandardMaterial({
    map:texBark, normalMap:texBarkN, roughness:0.94, metalness:0,
    normalScale:new THREE.Vector2(1.1,1.1), vertexColors:true
  });
  const leafMat=new THREE.MeshStandardMaterial({
    map:texLeaf, alphaTest:0.5, side:THREE.DoubleSide,
    roughness:0.86, metalness:0, vertexColors:true
  });
  [barkMat,leafMat].forEach((m,idx)=>{
    m.onBeforeCompile=sh=>{
      sh.uniforms.uWind=windU;
      sh.vertexShader='uniform float uWind;\n'+sh.vertexShader.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
         #ifdef USE_INSTANCING
           vec3 wp=(instanceMatrix*vec4(transformed,1.0)).xyz;
         #else
           vec3 wp=transformed;
         #endif
         float amp=${idx===0?'0.010':'0.045'};
         float hgt=max(transformed.y,0.0);
         float s=sin(uWind*1.7+wp.x*0.22+wp.z*0.17)+0.45*sin(uWind*3.1+wp.x*0.55);
         transformed.x+=s*amp*hgt;
         transformed.z+=s*amp*hgt*0.55;`
      );
    };
  });

  const rand=mulberry32(20260727);
  const kinds=['small','medium','large'];
  const share={small:0.36, medium:0.36, large:0.28};

  /* Rejection sampling over the whole map — inside the circuit as well as
     outside it, exactly as the layout shows — with anything closer than
     TREE_CLEAR to the centreline thrown away so the run-off stays open. */
  const X0=TRK_MINX-TREE_MARGIN, X1=TRK_MAXX+TREE_MARGIN;
  const Z0=TRK_MINZ-TREE_MARGIN, Z1=TRK_MAXZ+TREE_MARGIN;
  const NX=Math.ceil((X1-X0)/TCELL), NZ=Math.ceil((Z1-Z0)/TCELL);

  const cells=new Array(NX*NZ);
  const WANT=7000;                      // ~1100/km2 — reads as forest, not scrub
  let tries=0, made=0;
  while(made<WANT && tries<WANT*6){
    tries++;
    const x=X0+rand()*(X1-X0), z=Z0+rand()*(Z1-Z0);
    if(distToTrack(x,z)<TREE_CLEAR) continue;
    const r=rand();
    const kind = r<share.small?'small':(r<share.small+share.medium?'medium':'large');
    const cx=clamp(Math.floor((x-X0)/TCELL),0,NX-1);
    const cz=clamp(Math.floor((z-Z0)/TCELL),0,NZ-1);
    const k=cz*NX+cx;
    (cells[k]||(cells[k]={small:[],medium:[],large:[]}))[kind].push({
      x, z,
      s:0.82+rand()*0.55,
      ry:rand()*Math.PI*2,
      tilt:(rand()-0.5)*0.09,
      tint:0.80+rand()*0.34,
      warm:(rand()-0.5)*0.16
    });
    made++;
  }

  const geos={};
  kinds.forEach(k=>{ geos[k]={bark:buildGeometry(man[k].bark,buf), leaf:buildGeometry(man[k].leaf,buf)}; });
  const leafDepth=new THREE.MeshDepthMaterial({
    depthPacking:THREE.RGBADepthPacking, map:texLeaf, alphaTest:0.5
  });

  const mtx=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(),
        v=new THREE.Vector3(), sc=new THREE.Vector3(), col=new THREE.Color();

  for(let ci=0;ci<cells.length;ci++){
    const cell=cells[ci]; if(!cell) continue;
    const cx=X0+((ci%NX)+0.5)*TCELL, cz=Z0+(Math.floor(ci/NX)+0.5)*TCELL;
    const meshes=[];
    kinds.forEach(kind=>{
      const list=cell[kind]; if(!list.length) return;
      const casts=(kind!=='small');
      const bark=new THREE.InstancedMesh(geos[kind].bark, barkMat, list.length);
      const leaf=new THREE.InstancedMesh(geos[kind].leaf, leafMat, list.length);
      list.forEach((t,n)=>{
        e.set(t.tilt,t.ry,t.tilt*0.6);
        q.setFromEuler(e);
        sc.set(t.s,t.s*(0.94+((t.tint*7)%1)*0.14),t.s);
        v.set(t.x, terrainH(t.x,t.z)-0.06, t.z);
        mtx.compose(v,q,sc);
        bark.setMatrixAt(n,mtx); leaf.setMatrixAt(n,mtx);
        col.setRGB(t.tint*(1+t.warm), t.tint, t.tint*(1-t.warm*0.7));
        bark.setColorAt(n,col); leaf.setColorAt(n,col);
      });
      bark.instanceMatrix.needsUpdate=true; leaf.instanceMatrix.needsUpdate=true;
      if(bark.instanceColor) bark.instanceColor.needsUpdate=true;
      if(leaf.instanceColor) leaf.instanceColor.needsUpdate=true;
      // instance offsets never make it into the bounding sphere, so three.js
      // cannot cull these itself -- we do it per cell in the frame loop
      bark.frustumCulled=false; leaf.frustumCulled=false;
      leaf.customDepthMaterial=leafDepth;   // leaves punch alpha through the shadow map
      bark.userData.casts=casts; leaf.userData.casts=casts;
      bark.castShadow=casts; leaf.castShadow=casts;
      bark.receiveShadow=true; leaf.receiveShadow=true;
      shadowCasters.push(bark,leaf);
      treeGroup.add(bark,leaf);
      meshes.push(bark,leaf);
    });
    if(meshes.length){
      treeCells.push({
        sphere:new THREE.Sphere(new THREE.Vector3(cx,12,cz), TCELL*0.708+24),
        cx, cz, meshes, vis:true
      });
    }
  }
}

/* ---------------------------------------------------------------- minimap */
const mapCan=document.getElementById('map'), mapCtx=mapCan.getContext('2d');
let mapBg=null, mapK=1, mapPX=0, mapPZ=0;
function buildMap(){
  const W=mapCan.width, H=mapCan.height, pad=22;
  const bw=TRK_MAXX-TRK_MINX, bh=TRK_MAXZ-TRK_MINZ;
  mapK=Math.min((W-pad*2)/bw,(H-pad*2)/bh);
  mapPX=(W-bw*mapK)/2-TRK_MINX*mapK;
  mapPZ=(H-bh*mapK)/2-TRK_MINZ*mapK;
  const o=document.createElement('canvas'); o.width=W; o.height=H;
  const g=o.getContext('2d');
  g.lineJoin=g.lineCap='round';
  g.beginPath();
  for(let i=0;i<=NSAMP;i+=10){
    const k=i%NSAMP, X=sx[k]*mapK+mapPX, Y=sz[k]*mapK+mapPZ;
    i?g.lineTo(X,Y):g.moveTo(X,Y);
  }
  g.closePath();
  g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=11; g.stroke();
  g.strokeStyle='rgba(236,234,228,.72)'; g.lineWidth=7; g.stroke();
  // start/finish tick, drawn across the track
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  trackAt(FINISH_S,p); trackDir(FINISH_S,d);
  g.strokeStyle='#f2a20c'; g.lineWidth=4;
  g.beginPath();
  g.moveTo((p.x+d.y*10)*mapK+mapPX,(p.y-d.x*10)*mapK+mapPZ);
  g.lineTo((p.x-d.y*10)*mapK+mapPX,(p.y+d.x*10)*mapK+mapPZ);
  g.stroke();
  mapBg=o;
}
const _mp=new THREE.Vector2();
function drawMap(){
  if(!mapBg) return;
  mapCtx.clearRect(0,0,mapCan.width,mapCan.height);
  mapCtx.drawImage(mapBg,0,0);
  // the car's own position now, not a point on the centreline
  mapCtx.beginPath();
  mapCtx.arc(carGroup.position.x*mapK+mapPX,carGroup.position.z*mapK+mapPZ,7,0,6.2832);
  mapCtx.fillStyle='#f2a20c'; mapCtx.fill();
  mapCtx.lineWidth=3; mapCtx.strokeStyle='rgba(11,12,13,.85)'; mapCtx.stroke();
}

/* ------------------------------------------------------ next-corner view */
/* A heading-up slice of the road ahead: the centreline from just behind the
   car to CM_AHEAD metres in front, rotated so up is always where the nose is
   pointing, and tinted by how fast each part of it can be taken. This is the
   piece that actually answers "how sharp is the next one" -- from the cockpit
   the corner itself is only a few pixels tall until you are on top of it. */
const cmapCan=document.getElementById('cmap'), cmapCtx=cmapCan.getContext('2d');
const CM_AHEAD=380, CM_BEHIND=24, CM_STEP=5;
const A_LAT=34;                       // m/s^2 of grip assumed when colouring

/* corner speed from radius: v = sqrt(a/k). Bands are in kph so the colours
   line up with what the speedo is reading on the approach. */
function cornerHue(k){
  const kk=Math.abs(k);
  if(kk<1/900) return '#7fdd63';
  const kph=Math.sqrt(A_LAT/kk)*3.6;
  if(kph>260) return '#7fdd63';
  if(kph>195) return '#dfd94a';
  if(kph>135) return '#f2a20c';
  return '#e8483a';
}
function severity(radius){
  return radius<32?1:radius<55?2:radius<85?3:radius<130?4:radius<210?5:6;
}
/* the next corner worth naming, and how far away its entry is */
function nextCorner(s0){
  for(let d=10;d<620;d+=4){
    const k=trackK(s0+d);
    if(Math.abs(k)<=CORNER_TH) continue;
    let peak=k;
    for(let e=d;e<d+340;e+=4){
      const kk=trackK(s0+e);
      if(Math.abs(kk)<=CORNER_TH*0.7) break;
      if(Math.abs(kk)>Math.abs(peak)) peak=kk;
    }
    return {dist:d, left:peak>0, radius:1/Math.abs(peak)};
  }
  return null;
}

const _cmP=new THREE.Vector2(), _cmD=new THREE.Vector2(), _cmQ=new THREE.Vector2();
function drawCornerMap(){
  const W=cmapCan.width, H=cmapCan.height, HEAD=62;
  const g=cmapCtx;
  g.clearRect(0,0,W,H);
  // opaque enough to read against a sunlit mountain, which is what sits behind
  // this corner of the screen for much of the lap
  g.fillStyle='rgba(11,12,13,.86)';
  g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(236,234,228,.16)'; g.lineWidth=2;
  g.strokeRect(1,1,W-2,H-2);

  const scale=(H-HEAD-26)/(CM_AHEAD+CM_BEHIND);
  const cx=W/2, cy=H-18-CM_BEHIND*scale;

  // centred and rotated on the car itself, so the panel stays heading-up even
  // when you are well off the centreline
  const ox=carGroup.position.x, oz=carGroup.position.z;
  const ch=carGroup.rotation.y, tx=Math.sin(ch), tz=Math.cos(ch);
  // world delta -> car frame. forward is +z_local, and the driver's left is
  // +x_local, so left maps to screen-left.
  const toScreen=(px,pz,out)=>{
    const dx=px-ox, dz=pz-oz;
    out.x = cx - (dx*tz - dz*tx)*scale;   // lateral, + is the driver's left
    out.y = cy - (dx*tx + dz*tz)*scale;   // forward, up the screen
  };

  /* How far to draw. A fixed 380 m through a 60 m corner wraps the road more
     than a full quarter turn and it spirals off the side of the panel, so the
     path also stops once it has bent about 130 degrees -- far enough to show
     the whole of the next corner and where it lets you out, and no further. */
  const ends=[];
  let turn=0, kPrev=trackK(carState.s);
  for(let d=-CM_BEHIND; d<=CM_AHEAD; d+=CM_STEP){
    if(d>0){
      const k=trackK(carState.s+d);
      turn+=Math.abs((k+kPrev)*0.5)*CM_STEP; kPrev=k;
      if(turn>2.27) break;
    }
    trackAt(carState.s+d,_cmQ); toScreen(_cmQ.x,_cmQ.y,_cmQ);
    ends.push({x:_cmQ.x, y:_cmQ.y, k:trackK(carState.s+d-CM_STEP*0.5)});
  }

  g.lineCap='round'; g.lineJoin='round';
  const wide=Math.max(3, ROAD_HALF*2*scale);
  // dark casing first so the ribbon reads against the panel
  g.strokeStyle='rgba(0,0,0,.6)'; g.lineWidth=wide+5;
  g.beginPath();
  ends.forEach((p,i)=> i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));
  g.stroke();
  // then one short stroke per step, tinted by that step's curvature
  g.lineWidth=wide;
  for(let i=1;i<ends.length;i++){
    g.strokeStyle=cornerHue(ends[i].k);
    g.beginPath(); g.moveTo(ends[i-1].x,ends[i-1].y); g.lineTo(ends[i].x,ends[i].y); g.stroke();
  }

  // the car, always at the same spot facing up
  g.fillStyle='#f2a20c';
  g.beginPath();
  g.moveTo(cx,cy-11); g.lineTo(cx-7,cy+7); g.lineTo(cx+7,cy+7);
  g.closePath(); g.fill();

  // header: which way the next corner goes, how tight, how far
  const nc=nextCorner(carState.s);
  g.fillStyle='rgba(0,0,0,.62)'; g.fillRect(0,0,W,HEAD);
  if(nc){
    const col=cornerHue(1/nc.radius);
    g.fillStyle=col;
    g.font='bold 40px ui-monospace, Menlo, Consolas, monospace';
    g.textBaseline='middle';
    g.textAlign='left';  g.fillText(nc.left?'◀':'▶', 14, HEAD/2);
    g.textAlign='center';g.fillText(String(severity(nc.radius)), W/2-14, HEAD/2);
    g.fillStyle='#eceae4';
    g.font='600 30px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign='right';
    g.fillText(Math.round(nc.dist/10)*10+' m', W-14, HEAD/2);
  }else{
    g.fillStyle='rgba(236,234,228,.5)';
    g.font='600 24px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('CLEAR', W/2, HEAD/2);
  }
}

/* ----------------------------------------------------------------- audio */
/* Four looping engine beds crossfaded on a 0.1 s ramp. Each state gets a
   fresh source so it can be started at an offset -- a looping BufferSource
   cannot be seeked once running. */
const FADE=0.10;
let actx=null, sbuf={}, sndCur=null, sndSrc=null, sndGain=null, audioOn=false;
const sbufTrim={};                 // per-bed loop points, see trimPoints()

/* Every one of these beds carries dead air at the head -- 148 ms on accel,
   128 on brake, 127 on coast -- partly the encoder's own delay and partly
   real silence in the source. Looped raw that is an audible dropout on every
   pass, which on the 3.9 s coast bed lands every 3.9 seconds.

   Rather than re-encode the assets, find the first and last samples that
   actually carry signal and hand those to the source as loopStart/loopEnd,
   so the loop cycles the sounding part and never replays the gap. The trim is
   capped so a genuinely quiet intro can never be cut short. */
function trimPoints(buf){
  const d=buf.getChannelData(0), n=d.length, sr=buf.sampleRate;
  const thr=0.004, cap=Math.round(sr*0.40);
  let a=0; while(a<n && a<cap && Math.abs(d[a])<thr) a++;
  let b=n-1, lim=n-1-cap; while(b>a && b>lim && Math.abs(d[b])<thr) b--;
  const start=a/sr, end=(b+1)/sr;
  return (end-start>0.25) ? {start,end,len:end-start}
                          : {start:0, end:buf.duration, len:buf.duration};
}

function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  actx=new AC();
  const ks=['accel','idle','brake','coast'];
  let done=0;
  ks.forEach(k=>{
    const fin=()=>{ if(++done===ks.length) audioOn=true; };
    fetch(ASSETS.snd[k]).then(r=>r.arrayBuffer())
      .then(ab=>actx.decodeAudioData(ab, b=>{ sbuf[k]=b; sbufTrim[k]=trimPoints(b); fin(); }, fin))
      .catch(fin);
  });
}
function unlockAudio(){
  initAudio();
  if(actx && actx.state==='suspended') actx.resume();
}
function setSound(name, offset){
  if(!audioOn || !actx || !sbuf[name] || sndCur===name) return;
  const now=actx.currentTime;
  if(sndGain){                       // fade the outgoing bed out, then drop it
    const g=sndGain, old=sndSrc;
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.linearRampToValueAtTime(0, now+FADE);
    try{ old.stop(now+FADE+0.02); }catch(e){}
  }
  const src=actx.createBufferSource();
  src.buffer=sbuf[name]; src.loop=true;
  // loop only the sounding part, skipping the dead air at the head
  const tr=sbufTrim[name]||{start:0,end:sbuf[name].duration,len:sbuf[name].duration};
  src.loopStart=tr.start; src.loopEnd=tr.end;
  const g=actx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(1, now+FADE);
  src.connect(g); g.connect(actx.destination);
  src.start(now, tr.start + ((offset||0)%tr.len));
  sndCur=name; sndSrc=src; sndGain=g;
}

/* --------------------------------------------------------------- controls */
const keys=Object.create(null);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  unlockAudio();                    // browsers only allow audio after a gesture
  keys[k]=true;
  if(k==='c'){ camMode=(camMode+1)%CAMS.length; orbit=false; freeLook=false; updateStatus(); }
  if(k==='o'){ orbit=!orbit; if(orbit) freeLook=false; updateStatus(); }
  if(k==='v'){ freeLook=!freeLook; if(freeLook){ orbit=false; camMode=0; } resetFree(); updateStatus(); }
  if(k==='x') resetFree();                           // recentre the head
  if(k==='l'){ if(rlMesh){ rlMesh.visible=!rlMesh.visible; updateStatus(); } }
  if(k==='r') resetToTrack();                        // back onto the road, stopped
  if(k==='g') armStart();                            // back to the grid, new sequence
  // the eye is moved in the frame loop, not here -- see EYE_RATE
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

/* Camera rig. Cockpit p is a point in the car model's own space (metres
   before the fit-to-5.6 m scale). Chase rides the centreline behind the car. */
/* How hard the view leans with the ground. Above 1 so a descent is opened
   up rather than merely followed -- looking exactly along the slope still
   buries the far end of the road behind the nose. */
const CAM_SLOPE=1.35;
const CAMS=[
  // Seated down in the tub: rim at 0.68 is just below the lens, the halo at
  // 0.87 arcs overhead, the wheel at 0.51-0.68 sits in the lower frame.
  {name:'Cockpit', p:[0,0.72,0.11], fov:70, zoom:10, shake:1.30},
  {name:'Chase',   chase:true, back:9.5, up:3.15, fov:64, zoom:8, shake:0.35}
];
let orbit=false, camMode=0, shadowsOn=true;
function updateStatus(){
  document.getElementById('camname').textContent =
    orbit?'Orbit':(freeLook?'Free look':CAMS[camMode].name);
  document.getElementById('lname').textContent = (rlMesh&&rlMesh.visible)?'On':'Off';
}
/* Full detail, always. There is no longer a quality toggle and nothing
   downgrades it behind your back -- the old adaptive check could drop the
   scene to Low a couple of seconds after load on a slow first frame and never
   put it back. */
function applyDetail(){
  shadowsOn=true;
  renderer.shadowMap.enabled=true;
  shadowCasters.forEach(m=>{ m.castShadow = m.userData.casts!==false; });
  // this just overrode the per-cell tree gating in the frame loop, so make the
  // cull loop reapply it on the next frame rather than leaving distant cells casting
  treeCells.forEach(b=>{ b.cast=undefined; });
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
  updateStatus();
}

/* ------------------------------------------------- seat height + free look */
/* The up and down arrows are the only thing that moves the eye, and they move
   it slowly and continuously while held rather than in steps -- a keypress
   step reads as a jolt, and key auto-repeat makes the rate depend on the OS.
   Integrating a rate against dt instead gives the same gentle travel on every
   machine. It applies in the normal cockpit view as well as in free look, so
   you can trim your seating position at any time.

   V additionally frees the gaze: drag to look around from the seat. Offsets
   live in the car's own space, so they ride the shell through corners. */
let freeLook=false;
let fYaw=0, fPitch=0, fUp=0, fFwd=0, fwdDir=1;
const F_YAW=1.15, F_PITCH_UP=0.42, F_PITCH_DN=0.55;   // rad
// Deliberately tight, and deliberately slow: the whole travel takes about six
// seconds to walk end to end, so a tap is a barely-perceptible trim.
const F_UP_MIN=-0.10, F_UP_MAX=0.22;                  // m
const EYE_RATE=0.055;                                 // m per second, held
/* Shift slides the eye up the tub toward the nose. It reverses at each end
   rather than stopping, so one key covers the whole travel in both directions:
   hold it and the eye runs forward to the front edge of the cockpit, turns
   round and comes back. The forward stop is just past the steering wheel
   (which sits at z = 0.31 in model space) -- far enough to lean over the
   wheel and see the road, not so far that the eye leaves the tub. */
const F_FWD_MIN=-0.05, F_FWD_MAX=0.38;                // m, +ve = toward the nose
const FWD_RATE=0.07;                                  // m per second, held
function resetFree(){ fYaw=0; fPitch=0; fUp=0; fFwd=0; fwdDir=1; }

// orbit drag
let dragging=false, lastX=0, lastY=0, moved=0, orbYaw=Math.PI, orbPitch=0.22, orbDist=16;
canvas.addEventListener('pointerdown',e=>{
  unlockAudio();
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup',e=>{
  dragging=false;
  if(moved<8 && !freeLook){          // a tap, not a drag — cycle the view
    if(orbit) orbit=false; else camMode=(camMode+1)%CAMS.length;
    updateStatus();
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  moved+=Math.abs(dx)+Math.abs(dy);
  lastX=e.clientX; lastY=e.clientY;
  if(freeLook){                      // look around from the seat
    fYaw   = clamp(fYaw   - dx*0.0042, -F_YAW, F_YAW);
    fPitch = clamp(fPitch - dy*0.0032, -F_PITCH_DN, F_PITCH_UP);
    return;
  }
  orbYaw   -= dx*0.005;
  orbPitch = clamp(orbPitch+dy*0.004,-0.12,1.15);
  if(!orbit && moved>8){ orbit=true; updateStatus(); }
});
// the wheel only zooms the orbit camera; nothing but the arrows moves the eye
canvas.addEventListener('wheel',e=>{
  if(orbit){ orbDist=clamp(orbDist*(1+e.deltaY*0.0012),3.5,900); e.preventDefault(); }
},{passive:false});

/* -------------------------------------------------------- start procedure */
/* Real F1 sequence: the five columns light one per second, hold all five for
   an interval nobody can anticipate, then go out together -- lights out is
   the start, not a green. The hold is redrawn every time, so the launch
   cannot be learned. The car is pinned to the grid until they go out; the
   throttle still works on the engine note, so you can sit there holding W and
   go the instant the panel clears. */
const LIGHT_STEP=1.0;                  // seconds between columns
const HOLD_MIN=1.0, HOLD_MAX=5.0;      // random hold, seconds
let startPhase='armed';                // armed -> lighting -> hold -> go
let startT=0, litCols=-1, holdFor=0;
const lightsEl=document.getElementById('lights');
const goEl=document.getElementById('golabel');
const lightCols=Array.prototype.slice.call(lightsEl.querySelectorAll('.col'));

function setLights(n){
  if(n===litCols) return;
  litCols=n;
  for(let i=0;i<lightCols.length;i++){
    const on=i<n;
    lightCols[i].classList.toggle('on',on);
    const m=bulbMats[i];
    if(!m) continue;
    m.color.copy(on?L_ON_C:L_OFF_C);
    m.emissive.copy(on?L_ON_E:L_OFF_E);
    m.emissiveIntensity = on?1.9:0.35;
  }
}
function armStart(){
  startPhase='armed'; startT=0; holdFor=0;
  carState.speed=0; carState.s=START_S; carState.n=0; carState.psi=0;
  steerIn=0; steerAng=0; clearDebris();
  setLights(0);
  lightsEl.classList.add('show');
  goEl.classList.remove('show');
}
function updateStart(dt){
  if(startPhase==='go') return;
  startT+=dt;
  if(startPhase==='armed'){
    if(startT>=1.6){ startPhase='lighting'; startT=0; setLights(1); }
    return;
  }
  if(startPhase==='lighting'){
    setLights(Math.min(5, Math.floor(startT/LIGHT_STEP)+1));
    // the fifth column lights at 4 s, not 5 -- the hold has to start there, or
    // the panel sits complete for a fixed extra second and the random window
    // becomes 2-6 s instead of the 1-5 s it is meant to be
    if(startT>=LIGHT_STEP*4){
      startPhase='hold'; startT=0;
      // deliberately Math.random, not the seeded generator the world uses --
      // a reproducible hold would defeat the whole point
      holdFor=HOLD_MIN+Math.random()*(HOLD_MAX-HOLD_MIN);
    }
    return;
  }
  if(startPhase==='hold' && startT>=holdFor){
    startPhase='go'; startT=0;
    setLights(0);
    lightsEl.classList.remove('show');
    goEl.classList.add('show');
    setTimeout(()=>goEl.classList.remove('show'),1100);
  }
}

/* ------------------------------------------------------------ drive model */
/* The car is no longer railed. It carries a full curvilinear state: s along
   the centreline, n laterally off it, and psi -- its heading relative to the
   track tangent. Everything else in this file already lives in track space
   (kerbs, barriers, boards, the corner map), so collisions and the reset stay
   trivial while the car moves completely freely:

     sdot = v cos(psi) / (1 - n k)
     ndot = v sin(psi)
     psidot = yawRate - k sdot

   The 1 - n k term is the Frenet stretch: a metre travelled on the inside of
   a corner covers less centreline than a metre on the outside. It only
   degenerates at n = 1/k, and the barriers stop us at 13.8 m while the
   tightest corner has a 25.8 m radius, so it is never close. */
/* s/n drive the generated circuit in track space; wx/wz/hdg drive free roam
   in world space. Only one pair is live at a time, chosen by FREEROAM. */
const carState={ s:START_S, n:0, psi:0, speed:0, wx:0, wz:0, hdg:0 };
let carPitch=0, carRoll=0, groundY=0, carVY=0;
const _rq=new THREE.Quaternion(), _re=new THREE.Euler(), _lv=new THREE.Vector3();
let spin=0;                       // accumulated wheel angle, radians
let steerIn=0, steerAng=0;        // player input -1..1, and the wheel angle
let lockF=1;                      // eased speed-dependent lock multiplier
let pitch=0, roll=0, headLean=0, spdPrev=0;   // body attitude + driver head lean
const STEER_LOCK=2.36;            // rad at full lock (~135 deg each way)
const STEER_RATIO=7.1;            // rack ratio: 135 deg of wheel -> ~19 deg of tyre

/* Available lock falls away with speed, like a real rack loading up. These
   used to be hard bands -- 0.60 below 55 kph, 0.50 below 100, and so on -- so
   the wheel visibly jumped the instant you crossed a threshold, and sitting
   exactly on one flickered between two values frame to frame. Same breakpoints,
   but now interpolated: the lock slides continuously from each value to the
   next across the whole band, so going 30 -> 55 kph tightens gradually the
   entire way rather than doing nothing and then stepping at the boundary.
   smoothstep rather than a straight lerp so the rate of change is also zero at
   each knot -- no step, and no kink where two bands meet either. */
const LOCK_KPH=[   0,   30,   55,  100,  150,  200,    300,  360];
const LOCK_VAL=[1.00, 1.00, 0.60, 0.50, 0.40, 0.30, 0.2667, 0.25];
function lockTable(kph){
  if(kph<=LOCK_KPH[0]) return LOCK_VAL[0];
  for(let i=1;i<LOCK_KPH.length;i++){
    if(kph<=LOCK_KPH[i]){
      const t=smoothstep(LOCK_KPH[i-1],LOCK_KPH[i],kph);
      return LOCK_VAL[i-1]+(LOCK_VAL[i]-LOCK_VAL[i-1])*t;
    }
  }
  return LOCK_VAL[LOCK_VAL.length-1];
}
/* Now that the rack actually steers the car, the table above is not the whole
   story: it was tuned when steering was cosmetic, so its values were never
   checked as control authority, and above about 130 kph it hands out far more
   lock than the tyres could ever use. Beyond the grip limit extra lock buys
   nothing but twitch.

   So the available lock is also capped at the angle that exactly reaches
   A_GRIP -- full lock then means "the tightest arc the car can hold", at every
   speed, and never more. Below ~130 kph the table is already inside that and
   wins unchanged, so the low-speed feel is untouched. */
function lockGrip(kph){
  const v=kph/3.6;
  if(v<1) return 1;
  return clamp(STEER_RATIO*Math.atan(WHEELBASE*A_GRIP/(v*v))/STEER_LOCK, 0, 1);
}
/* There was briefly a third limit here, capping lock to hold the car's yaw
   rate flat across the mid range. It is gone, because it could never give
   both things at once: a
   hairpin at 100 kph and a straight at 100 kph are the same speed, so no
   curve of yaw against speed can be generous for one and calm for the other.
   Capping the car was the wrong lever entirely.

   What actually made a tap twitchy was never the car's peak rotation, it was
   how much heading a tap banked. Displacement comes from the heading you keep
   afterwards, not the yaw rate while turning, so the fix belongs in the input:
   a slow application ramp makes a tap a small angle, and a quick return stops
   it dribbling on afterwards, while holding the key still walks all the way to
   full lock. Corners keep the whole of the grip; only the flick is quietened.
   See STEER_ON / STEER_OFF in drive(). */
function lockAt(kph){ return Math.min(lockTable(kph), lockGrip(kph)); }
const _qRoll=new THREE.Quaternion(), _qSteer=new THREE.Quaternion();
const _AXIS_X=new THREE.Vector3(1,0,0), _AXIS_Y=new THREE.Vector3(0,1,0);
/* Asymmetric on purpose. Slow on so a flick banks little heading; quick off so
   it stops steering the moment you release instead of trailing away. Holding
   still reaches full lock in about two seconds, which is what keeps the whole
   of the car's grip available in a corner. */
const STEER_ON=0.62, STEER_OFF=0.14;   // seconds, application and return
const CAR_HALF_W=1.0;             // half the car's width, for the wall test
let WALL_N=BARRIER_LAT-CAR_HALF_W;
const kmhEl=document.getElementById('kmh');

/* R puts the car back on the centreline where it stands, pointing down the
   road and stopped. Everything that could be left leaning or wound up from
   the shunt is zeroed with it. */
function resetToTrack(){
  carState.n=0; carState.psi=0; carState.speed=0;
  steerIn=0; steerAng=0; lockF=1;
  pitch=0; roll=0; headLean=0; spdPrev=0;
  clearDebris();
}

function drive(dt){
  // up/down arrows now trim the seat height, so they are no longer throttle
  // and brake -- W and S are the drive controls
  const thr = keys['w'];
  const brk = keys['s'];
  const lft = keys['a']||keys['arrowleft'];
  const rgt = keys['d']||keys['arrowright'];

  /* Two stages of easing on the player's input: it ramps toward the key state,
     then the wheel angle chases it.

     The ramp used to reach full lock in about a sixth of a second, which was
     harmless while steering was cosmetic. Now that it actually turns the car
     it is not: a key is all-or-nothing, so that made the shortest tap a huge
     input and full lock arrived long before you meant it. Applying over about
     four tenths of a second makes a tap a small angle and lets you hold a
     partial one, while it still snaps back quicker than it goes on. */
  const want = (lft?-1:0) + (rgt?1:0);
  const k = 1-Math.exp(-dt/(want?STEER_ON:STEER_OFF));
  steerIn += (want-steerIn)*k;

  const kph=carState.speed*3.6;
  lockF += (lockAt(kph)-lockF)*(1-Math.pow(0.02,dt));

  /* Pinned to the grid until the lights go out. The throttle is deliberately
     still read below for the engine note, so holding W on the line revs the
     car and you launch the instant the panel clears. */
  const gridded = startPhase!=='go';
  if(gridded){
    carState.speed=0;
  }
  else if(thr){
    // drag rises with v^2, so: hard launch, progressive knee, flat top end.
    // thrust and drag cancel at MAXSPEED, so it eases in instead of clamping.
    const v=carState.speed/MAXSPEED;
    carState.speed += 26.0*(1.0 - v*v)*dt;
  }
  else if(brk) carState.speed -= 46*dt;
  else carState.speed -= (0.8 + carState.speed*0.028)*dt;
  carState.speed=clamp(carState.speed,0,MAXSPEED);

  /* Steering is entirely yours now -- there is no longer any curvature term
     holding the car to the crown of the road. The speed-scaled lock does real
     work here rather than being decoration: it is what stops the rack being
     unusably twitchy at 300 kph. */
  const target=clamp(steerIn*STEER_LOCK*lockF, -STEER_LOCK, STEER_LOCK);
  steerAng += (target-steerAng)*(1-Math.pow(0.0009,dt));
  if(steer) steer.setRotationFromAxisAngle(STEER_AXIS, steerAng);

  let yawRate=0;
  if(!gridded){
    const v=carState.speed;
    /* Kinematic bicycle: no slip angle, the car goes where it points. Simple
       and stable on a keyboard. The geometric yaw rate alone would allow
       ~17 g at top speed, so it is capped at what the tyres could actually
       hold -- which is also what gives the car its understeer at speed. */
    const dTyre=-steerAng/STEER_RATIO;              // +ve = left
    yawRate=v*Math.tan(dTyre)/WHEELBASE;
    const yawMax = v>0.5 ? A_GRIP/v : 8;
    yawRate=clamp(yawRate,-yawMax,yawMax);

    if(FREEROAM){
      /* World-space integration. Nothing to be confined by and nothing to
         measure against, so heading is absolute and position is plain
         dead-reckoning across the ground. */
      carState.hdg += yawRate*dt;
      carState.wx  += Math.sin(carState.hdg)*v*dt;
      carState.wz  += Math.cos(carState.hdg)*v*dt;
    } else {
    const k=trackK(carState.s);
    const denom=Math.max(0.25, 1-carState.n*k);     // Frenet stretch, guarded
    const sdot=v*Math.cos(carState.psi)/denom;
    carState.psi += (yawRate - k*sdot)*dt;
    // capping psi keeps cos(psi) positive, so s can never run backwards and
    // the lap logic stays monotonic even in a big slide
    carState.psi=clamp(carState.psi,-1.15,1.15);
    carState.n += v*Math.sin(carState.psi)*dt;
    carState.s += sdot*dt;
    if(carState.s>=LAP) carState.s-=LAP;
    if(carState.s<0)    carState.s+=LAP;

    // off the asphalt: grass and gravel scrub speed off
    const off=Math.abs(carState.n)-ROAD_HALF;
    if(off>0) carState.speed=Math.max(0,carState.speed-Math.min(off,3.5)*2.4*dt);

    /* Barriers. n is measured from the centreline, so the wall test is one
       comparison -- the whole point of keeping the car in track space. */
    if(Math.abs(carState.n)>=WALL_N){
      const side=carState.n>0?1:-1;
      carState.n=side*WALL_N;
      const vIn=carState.speed*Math.sin(carState.psi)*side;   // +ve = into it
      if(vIn>0){
        if(vIn>1.2) hitBarrier(vIn);
        carState.psi=-carState.psi*0.28;                      // glance off
        carState.speed=Math.max(1.5, carState.speed*(1-clamp(vIn*0.05,0.02,0.5)));
      }
    }
    }
  }

  /* Body attitude. Pitch is dive/squat off actual longitudinal acceleration
     rather than the key state, so it eases off by itself near top speed. Roll
     is lateral load, v^2 * curvature, leaning the shell to the outside of the
     corner. Both clamped then damped, so it rocks on its springs. */
  const along=(carState.speed-spdPrev)/Math.max(dt,1e-4);
  spdPrev=carState.speed;
  const pitchT=clamp(-along*0.00045, -0.014, 0.021);   // -0.8 deg .. +1.2 deg
  pitch += (pitchT-pitch)*(1-Math.pow(0.01,dt));

  // lateral load is now the car's own, not the corner's: a = v * yaw rate
  const alat=carState.speed*yawRate;
  const rollT=clamp(alat*0.00085, -0.042, 0.042);      // up to ~2.4 deg
  roll += (rollT-roll)*(1-Math.pow(0.03,dt));
  if(carObj){ carObj.rotation.x=pitch; carObj.rotation.z=roll; }

  /* Head lean, taken off steerAng rather than off track curvature so it can
     never disagree with the rim the driver is looking at: steerAng<0 is a left
     turn (the front wheels get rotation.y = -steerAng/ratio, and +y rotation
     swings the car's forward toward its local +x, which is the driver's left).
     Positive camera roll tilts the view left, so the lean is -steerAng*k and
     the head always falls into the corner the wheels are pointing at.
     Curvature alone would leave the head dead level while you sawed at the
     wheel on a straight. */
  /* The lean already scales with speed for free, because steerAng is itself
     scaled by the speed-dependent lock -- so the same input leans the head
     hard through a slow corner and barely at all at 300 kph, exactly the way
     the rack behaves. What was throwing that away was the clamp: at 0.085 rad
     it saturated everywhere below about 150 kph, flattening the whole
     low-speed half to one value. Opening it up lets the progression show.

     Deliberately off steerAng and not off lateral load: cornering g rises with
     speed, so a g-based lean would tilt the head most at 300 kph, which is the
     opposite of what a driver does and of how this should feel. */
  const leanT=clamp(-steerAng*0.078, -0.155, 0.155);   // up to ~8.9 deg
  headLean += (leanT-headLean)*(1-Math.pow(0.02,dt));

  // Wheels roll at v/r -- faster car, faster spin, no slip.
  // Steer and roll are composed as quaternions on the axle node itself, in the
  // order steer-then-roll, so the roll axis follows the steered wheel the way a
  // real one does. Euler rotation.x/.y on one node would fight over axis order,
  // and rotating the child mesh would swing it in an arc -- its local origin is
  // ~2.8 m from the geometry. The node has no scale, so this stays rigid: no
  // stretch on the tyres, covers or discs at any angle.
  spin += (carState.speed/wheelR)*dt;
  if(spin>6.283185307) spin-=6.283185307;
  _qRoll.setFromAxisAngle(_AXIS_X, spin);
  _qSteer.setFromAxisAngle(_AXIS_Y, -steerAng/STEER_RATIO);
  for(let i=0;i<wheels.length;i++){
    const w=wheels[i];
    if(w.userData.steers) w.quaternion.copy(_qSteer).multiply(_qRoll);
    else                  w.quaternion.copy(_qRoll);
  }
  // winglets steer with the uprights but never roll
  if(wingL) wingL.quaternion.copy(_qSteer);
  if(wingR) wingR.quaternion.copy(_qSteer);

  /* engine bed: idle when stopped, otherwise brake > throttle > coast.
     Lifting off the brake back onto the throttle while still rolling means
     the engine is already spinning, so pick the accel loop up halfway in
     rather than replaying the rev sweep from nothing. */
  // on the grid the car is stationary but the engine is not: holding W there
  // has to rev it, or sitting on the lights is silent
  const st = gridded ? (thr?'accel':'idle')
           : carState.speed<0.6 ? 'idle' : brk ? 'brake' : thr ? 'accel' : 'coast';
  if(st!==sndCur){
    // resuming onto the throttle mid-clip: half way through the sounding part,
    // not half way through the file, which would land inside the dead air
    const rolling = (st==='accel' && sndCur==='brake' && carState.speed>0.6);
    setSound(st, rolling && sbufTrim.accel ? sbufTrim.accel.len*0.5 : 0);
  }

  kmhEl.textContent = Math.round(carState.speed*3.6);
}

/* ------------------------------------------------------------- main loop */
const tmp=new THREE.Vector3();
const _p2=new THREE.Vector2(), _d2=new THREE.Vector2(), _aim=new THREE.Vector3();
const _fwd=new THREE.Vector3(), _carP=new THREE.Vector3();
const _frustum=new THREE.Frustum(), _pmv=new THREE.Matrix4();
let last=performance.now(), t=0;

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05); last=now; t+=dt;

  // seat trim: integrated against dt while held, so the travel is smooth and
  // frame-rate independent instead of stepping on key auto-repeat
  if(keys['arrowup'])   fUp=clamp(fUp+EYE_RATE*dt, F_UP_MIN, F_UP_MAX);
  if(keys['arrowdown']) fUp=clamp(fUp-EYE_RATE*dt, F_UP_MIN, F_UP_MAX);
  // shift runs the eye forward, and turns round at each stop instead of
  // sticking there, so the one key walks the full travel both ways
  if(keys['shift']){
    fFwd += fwdDir*FWD_RATE*dt;
    if(fFwd>=F_FWD_MAX){ fFwd=F_FWD_MAX; fwdDir=-1; }
    else if(fFwd<=F_FWD_MIN){ fFwd=F_FWD_MIN; fwdDir=1; }
  }

  updateStart(dt);
  drive(dt);
  windU.value=t;

  // place the car at (s, n) with its own heading. Matrices must be current
  // before carPoint() reads mount positions off the bodywork.
  if(FREEROAM){
    /* Sit on whatever is underneath and take the car's attitude from the
       surface normal, so it leans into cambers and pitches up the climbs
       instead of sliding along at a fixed height. Resolved about the car's own
       heading, so pitch is the slope you are driving up and roll is the camber
       across you. Both eased, or every triangle edge would snap the body. */
    /* Suspension, rather than the two-stage placement that was here before.

       That scheme took the highest of eight low points and snapped the body up
       to it at once, then let gravity pull it back down. Snapping to a maximum
       is a spring of infinite stiffness: every bump in the sampled ground
       became a vertical impulse, and the faster you went the more ground you
       crossed per frame, so it bounced harder the quicker you drove. Four of
       those eight points were corners of the bounding box -- the nose tip held
       at the height of the floor, 2.8 m ahead of centre, where the car has no
       geometry at all -- so any rise under the nose demanded a large lift that
       was never real.

       What replaces it is what a car actually has: four wheels on springs.
       The ground is read under each wheel, the body is set on the plane
       through them, and it is carried there by a critically damped spring.
       Critical damping is the whole point -- it is the fastest approach that
       cannot overshoot, so there is no bounce to tune out. */
    const h=carState.hdg, fx=Math.sin(h), fz=Math.cos(h);
    const probe1=(lx,lz)=>{
      const g=groundAt(carState.wx + lx*fz + lz*fx,
                       carState.wz - lx*fx + lz*fz, groundY-RIDE);
      return g.hit?g.y:null;
    };
    /* Each wheel reads the mean of a patch, not a point. The road is 1683
       triangles over 7 km, so a single probe steps at every facet edge. */
    const probe=(lx,lz)=>{
      let sum=0,n=0;
      for(const d of [-0.5,-0.25,0,0.25,0.5]){
        const v=probe1(lx,lz+d); if(v!==null){sum+=v;n++;}
        const u=probe1(lx+d,lz); if(u!==null){sum+=u;n++;}
      }
      return n?sum/n:null;
    };
    let tp=carPitch, tr=carRoll, tgt=null;
    if(CARPTS.length===4){
      const y0=probe(CARPTS[0].x,CARPTS[0].z), y1=probe(CARPTS[1].x,CARPTS[1].z),
            y2=probe(CARPTS[2].x,CARPTS[2].z), y3=probe(CARPTS[3].x,CARPTS[3].z);
      if(y0!==null&&y1!==null&&y2!==null&&y3!==null){
        tp=Math.atan2(((y0+y1)-(y2+y3))*0.5, CAR_WB);   // front axle vs rear
        tr=Math.atan2(((y0+y2)-(y1+y3))*0.5, CAR_TR);   // left vs right
        tgt=(y0+y1+y2+y3)*0.25 + RIDE;                  // body sits on the plane
      }
    }
    if(tgt===null){ const g=groundAt(carState.wx,carState.wz,groundY-RIDE);
                    if(g.hit) tgt=g.y+RIDE; }
    carPitch += (tp-carPitch)*(1-Math.pow(2e-4,dt));
    carRoll  += (tr-carRoll )*(1-Math.pow(2e-4,dt));

    if(tgt!==null){
      /* w is the suspension frequency; 2*w damping is exactly critical, so the
         body settles as fast as it can without ever passing the target and
         having to come back. The spring may push up as hard as it likes but
         may never pull down harder than gravity, which is what lets the car go
         light over a crest and fly if it is thrown clear, instead of being
         sucked back onto the road. */
      const w=2*Math.PI*3.6;
      let a=w*w*(tgt-groundY) - 2*w*carVY;
      if(a<-9.81) a=-9.81;
      carVY += a*dt;
      groundY += carVY*dt;
      // a wheel may not go through the road: a floor, not a snap, so it only
      // ever acts on the last centimetre or two the spring has not caught
      if(groundY<tgt){ groundY=tgt; if(carVY<0) carVY=0; }
    }
    carGroup.position.set(carState.wx, groundY, carState.wz);
    /* carPitch is positive climbing, which is how the cameras read it. It has
       to be negated going into rotation.x: a positive rotation about +X takes
       +Z toward -Y, and the nose is at +z, so feeding it straight in pitched
       the car the wrong way -- nose down every climb, nose up every descent.
       Roll needs no flip: car-local +x is the left-hand side, and a positive
       rotation about +Z lifts +x, which is what a higher left wheel wants. */
    carGroup.rotation.order='YXZ';
    carGroup.rotation.set(-carPitch, h, carRoll);
  }else{
    trackPos(carState.s,carState.n,0.125,_carP);
    trackDir(carState.s,_d2);
    carGroup.position.copy(_carP);
    carGroup.rotation.y=Math.atan2(_d2.x,_d2.y)+carState.psi;
  }
  carGroup.updateMatrixWorld(true);
  updateDebris(dt);

  const sp=carState.speed/MAXSPEED;
  const C=CAMS[camMode];

  /* Every camera height below is measured from the car rather than from y=0.
     They were absolute, which was invisible while the track was flat and put
     them tens of metres underground the moment the car climbed -- at Spa the
     road reaches 66 m, so a chase camera pinned to y=3.15 sat inside the hill.
     On flat ground base is 0 and the framing is exactly what it was. */
  const camBase=FREEROAM?carGroup.position.y-RIDE:0;
  /* And a camera can still end up inside a slope even at the right height --
     behind the car on a descent, the ground behind is higher than the car. So
     lift it clear of whatever is under it. */
  const clearGround=(v,pad)=>{
    const g=groundAt(v.x,v.z,v.y);
    if(g.hit && v.y < g.y+pad) v.y=g.y+pad;
    return v;
  };

  if(orbit){
    const cx=carGroup.position.x, cz=carGroup.position.z;
    camera.position.set(
      cx+Math.sin(orbYaw)*Math.cos(orbPitch)*orbDist,
      camBase+1.0+Math.sin(orbPitch)*orbDist,
      cz+Math.cos(orbYaw)*Math.cos(orbPitch)*orbDist);
    clearGround(camera.position,1.0);
    camera.up.set(0,1,0);
    camera.lookAt(cx,camBase+0.9,cz);
    camera.fov=52;
  }else{
    /* Both of these used to be built off the centreline, which was fine while
       the car was welded to it. Now that it steers, they follow the car: the
       cockpit looks where the nose points, and the chase sits behind the car's
       own heading rather than behind a point on the track you may have left. */
    const LA=14+carState.speed*0.8;
    const h=carGroup.rotation.y, hx=Math.sin(h), hz=Math.cos(h);

    if(C.chase){
      /* Sits behind at the car's own height, lifted clear if the ground
         behind happens to be higher, and aims down the slope the car is on so
         a descent shows the road rather than the sky. */
      camera.position.set(carGroup.position.x-hx*C.back, camBase+C.up,
                          carGroup.position.z-hz*C.back);
      clearGround(camera.position,1.2);
      camera.up.set(0,1,0);
      camera.lookAt(carGroup.position.x+hx*8,
                    camBase+1.15+Math.sin(carPitch)*8*CAM_SLOPE,
                    carGroup.position.z+hz*8);
    }else if(freeLook){
      /* Head moved and aimed in the car's own space, so it rides the shell.
         The eye offset is clamped at source, and the aim is built from the
         eye rather than from the centreline -- otherwise looking sideways
         would still drag the view back to the road ahead. */
      const ex=C.p[0], ey=C.p[1]+fUp, ez=C.p[2]+fFwd;
      camera.position.copy(carPoint(ex,ey,ez));
      // aim: a model-space point 24 m ahead of the eye along the yawed and
      // pitched gaze, then taken to world -- a point, so localToWorld is valid
      const cy=Math.cos(fPitch), R=24;   // fPitch is the head; the body's own
      // pitch already rides in through carObj's transform
      _fwd.set(ex + Math.sin(fYaw)*cy*R,
               ey + Math.sin(fPitch)*R,
               ez + Math.cos(fYaw)*cy*R);
      if(carObj) carObj.localToWorld(_fwd);
      else _fwd.set(carGroup.position.x, ey, carGroup.position.z+R);
      camera.up.set(0,1,0);
      camera.lookAt(_fwd);
    }else{
      // mount point is a real feature on the model, so it tracks the bodywork.
      // the seat trim applies here too, not just in free look.
      const P=carPoint(C.p[0],C.p[1]+fUp,C.p[2]+fFwd);
      camera.position.copy(P);
      /* The aim was horizontal, so going downhill you looked at the horizon
         and could not see the road falling away underneath you. It now runs
         out along the slope the car is standing on, over-driven a little so a
         descent opens up properly rather than just clipping the nose. */
      const aimP=clamp(carPitch*CAM_SLOPE, -0.62, 0.52);
      _aim.set(P.x+hx*LA*Math.cos(aimP), P.y+0.06+Math.sin(aimP)*LA,
               P.z+hz*LA*Math.cos(aimP));
      camera.up.set(0,1,0);
      camera.lookAt(_aim);
    }

    /* Cockpit vibration. Short and hard rather than floaty: 11-19 Hz stacked
       buzz, kept under the 30 Hz Nyquist limit at 60 fps or it just aliases
       back into a slow wobble. Three incommensurate tones plus irregular road
       noise so it never settles into a pure tone. Most of the violence is
       rotational -- it reads far harder than sliding the camera, and it can't
       shove the lens through the bodywork. */
    const amp=(0.10 + sp*0.26 + sp*sp*0.68)*C.shake*0.66;
    const b1=Math.sin(t*119.4), b2=Math.sin(t*71.0+1.3), b3=Math.sin(t*94.2+2.7);
    const n1=vnoise(t*19.0,0.0)-0.5, n2=vnoise(t*27.0,7.3)-0.5;
    camera.position.x += (b2*0.50 + n2*1.40)*0.0030*amp;
    camera.position.y += (b1*0.50 + b3*0.32 + n1*1.50)*0.0042*amp;
    // lookAt zeroes the roll, so the body's lean and dive are folded back in
    // here rather than being inherited from the shell
    /* lookAt zeroes the roll, so the head lean and the body's dive are folded
       back in here rather than being inherited from the shell.

       These MUST go through rotateX/rotateZ, which post-multiply the
       quaternion about the camera's own axes. Adding to camera.rotation.x/.z
       instead edits an XYZ Euler, and that decomposition hits gimbal lock
       whenever the car heads near world +/-x: rotation.y pins to +/-90 deg,
       rotation.z stops meaning roll and swallows the yaw, and the head then
       tilts the wrong way -- or wildly -- on whichever parts of the lap point
       that way. On the old straight-only road the car never turned, so the
       bug could not show itself. */
    camera.rotateX(pitch*0.80 + (b1*0.50 + n2*1.30)*0.0090*amp);
    camera.rotateZ(headLean   + (b2*0.55 + n1*1.20)*0.0110*amp);
    camera.fov = C.fov + sp*C.zoom;
  }
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  skyDome.position.copy(camera.position);   // the dome is finite; keep it centred

  // cull the forest a cell at a time -- instanced meshes carry no usable
  // bounding sphere, so the test has to be ours
  // renderer.render() is what normally refreshes matrixWorldInverse, and that
  // runs after this loop -- so derive it here or the cull tests a stale (on the
  // first frame, identity) view matrix.
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  _pmv.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_pmv);
  for(let i=0;i<treeCells.length;i++){
    const b=treeCells[i];
    const dx=b.cx-camera.position.x, dz=b.cz-camera.position.z;
    const vis = (dx*dx+dz*dz < 1250*1250) && _frustum.intersectsSphere(b.sphere);
    if(b.vis!==vis){
      b.vis=vis;
      for(let m=0;m<b.meshes.length;m++) b.meshes[m].visible=vis;
    }
    /* The shadow camera only spans 144 m around the car, so a distant cell
       costs a full instanced draw in the shadow pass and contributes nothing.
       Visibility alone will not save us here — the shadow pass walks the same
       graph, it just ignores the view frustum. */
    // the shadow box reaches 72 m from the car and a cell centre can sit 354 m
    // from a tree inside it, so 480 m is the tightest radius that keeps every
    // cell that could actually drop a shadow on the road
    const near = (b.cx-carGroup.position.x)**2 + (b.cz-carGroup.position.z)**2 < 480*480;
    const cast = shadowsOn && near;
    if(b.cast!==cast){
      b.cast=cast;
      for(let m=0;m<b.meshes.length;m++){
        const mesh=b.meshes[m];
        mesh.castShadow = cast && mesh.userData.casts!==false;
      }
    }
  }

  // sun rig follows the car so the shadow map stays tight
  tmp.copy(carGroup.position);
  sun.target.position.copy(tmp);
  sun.position.copy(tmp).addScaledVector(SUN_DIR,190);

  renderer.render(scene,camera);
  if(!FREEROAM){ drawMap(); drawCornerMap(); }

}

/* ------------------------------------------------------------------ boot */
/* Two gates, because they finish in either order: the shared assets (textures,
   tree geometry, the car) load from the moment the page opens, while the world
   cannot be built until a track is chosen -- and for an imported one, not until
   its model has arrived and given up its centreline. */
let booted=false, assetsDone=false, worldDone=false;

function applyTrackConstants(t){
  TRACK=t; FREEROAM=!!t.freeRoam;
  ROAD_HALF=t.roadHalf; LANE_EDGE=t.laneEdge; KERB_W=t.kerbW;
  SHOULDER=t.shoulder;  TREE_CLEAR=t.treeClear;
  BARRIER_LAT=SHOULDER+t.barrierOut;
  WALL_N=BARRIER_LAT-CAR_HALF_W;
}

/* Everything with a dependency on the centreline, in order. Pinewood generates
   its own scenery; the imported circuit brings its own, so the terrain, road
   surface, kerbs, trees, mountains and distance boards are all skipped for it
   and only the pieces the model lacks -- barriers, racing line, grid lights --
   are generated on top. */
function buildWorld(){
  if(FREEROAM){
    /* Nothing here is available without a centreline: barriers, racing line,
       grid lights, boards and the lap itself are all measured along one. Free
       roam has no such line, so the world is just the model and the ground
       under it. Those come back when the barrier work lands. */
    document.getElementById('map').style.display='none';
    document.getElementById('cmap').style.display='none';
    worldDone=true; maybeStart(); return;
  }
  buildDistGrid();
  if(TRACK.scenery){
    buildTerrain();
    buildRoad();
    buildBoards();
    buildMountains();
  }
  buildBarriers();
  buildRacingLine();
  buildStartLine();
  buildStartLights();
  worldDone=true;
  maybeStart();
}

function maybeStart(){
  if(booted || !assetsDone || !worldDone) return;
  booted=true;
  if(TRACK.scenery) makeTrees();
  if(!FREEROAM){ buildMap(); armStart(); }
  else { startPhase='go'; }
  applyDetail();
  updateStatus();
  document.getElementById('tag').firstChild.textContent=TRACK.name;
  document.getElementById('tagsub').textContent =
    (FREEROAM?'Free roam':(LAP/1000).toFixed(3)+' km')+' · McLaren MCL39';
  document.getElementById('boot').classList.add('gone');
  requestAnimationFrame(frame);
}
function ready(){ assetsDone=true; maybeStart(); }

const bootEl=document.getElementById('boot');
const pickEl=document.getElementById('pick');
const bootMsg=document.getElementById('bootmsg');

function startTrack(id){
  const t=TRACKS[id];
  pickEl.style.display='none';
  applyTrackConstants(t);
  if(t.procedural){
    bootMsg.textContent='Building '+t.name;
    buildTrack(null,true);
    buildWorld();
    return;
  }
  bootMsg.textContent='Loading '+t.name;
  const loader=new THREE.GLTFLoader();
  if(self.MeshoptDecoder) loader.setMeshoptDecoder(self.MeshoptDecoder);
  loader.load(t.glb, gltf=>{
    const root=gltf.scene;
    bootMsg.textContent='Reading the ground';
    root.updateWorldMatrix(true,true);

    /* The model is already 1 unit = 1 metre, so it is placed rather than
       scaled -- only re-centred, and dropped so the spawn point sits at y=0.
       The loader has already applied the exporter's Z-up to Y-up rotation, so
       the spawn recorded in the model's own coordinates comes across as
       (x, -y) here. */
    /* Rather than guess how the exporter rotated the model, find the road by
       the material it carries and use its own geometry. The spawn was chosen
       offline in the model's untransformed coordinates, so match it against
       the raw attribute and then push that one vertex through the mesh's world
       matrix -- whatever the rotation turns out to be, this lands on tarmac. */
    let road=null;
    root.traverse(o=>{ if(road||!o.isMesh) return;
      const ms=Array.isArray(o.material)?o.material:[o.material];
      if(ms.some(m=>m&&m.name===t.roadMaterial)) road=o; });
    const start=new THREE.Vector3();
    if(road){
      const pos=road.geometry.attributes.position;
      let bi=0,bd=Infinity;
      for(let i=0;i<pos.count;i++){
        const d=(pos.getX(i)-t.spawn[0])**2+(pos.getY(i)-t.spawn[1])**2;
        if(d<bd){bd=d;bi=i;}
      }
      road.updateWorldMatrix(true,false);
      start.fromBufferAttribute(pos,bi).applyMatrix4(road.matrixWorld);
      console.log('spawn vertex %s m from the point picked offline', Math.sqrt(bd).toFixed(1));
    }else console.warn('road material '+t.roadMaterial+' not found; spawning at the origin');
    // put that point at the world origin so the car starts on it
    root.position.set(-start.x, -start.y, -start.z);
    root.traverse(o=>{ if(o.isMesh){ o.receiveShadow=true;
      if(o.material){ (Array.isArray(o.material)?o.material:[o.material])
        .forEach(m=>{ if(m&&m.map) m.map.anisotropy=MAXANISO; }); } } });
    scene.add(root);

    const stats=buildHeightField(root);
    console.log('height field: '+stats.tris+' triangles over '+stats.cells+' cells, '+stats.refs+' refs');
    const g=groundAt(0,0,1e9);
    carState.wx=0; carState.wz=0; carState.hdg=0; carState.speed=0;
    // groundY is the body's height, not the ground's -- the clearance guard
    // works in body space, so seed it the same way
    groundY = (g.hit?g.y:0)+RIDE; carVY=0;
    carGroup.position.set(0, groundY, 0);
    console.log('ground under the spawn: '+(g.hit?g.y.toFixed(3):'MISSING'));

    scene.fog.density=0.00035;         // a real valley circuit, long sightlines
    buildWorld();
  }, ev=>{
    if(ev.lengthComputable)
      bootMsg.textContent='Loading '+t.name+' '+Math.round(ev.loaded/ev.total*100)+'%';
  }, err=>{
    console.error('track load failed',err);
    bootMsg.textContent='Track failed to load';
  });
}

Array.prototype.slice.call(pickEl.querySelectorAll('button')).forEach(btn=>{
  btn.addEventListener('click',()=>startTrack(btn.dataset.track));
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
});
})();
</script>
</body>
</html>
