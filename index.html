<style>
  :root{

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
  canvas#c{display:block;width:100%;height:100%}
  #vignette{
    position:fixed;inset:0;pointer-events:none;

    mix-blend-mode:multiply;
  }
  .hud{position:fixed;pointer-events:none;font-family:var(--mono);color:var(--paper);
       text-shadow:0 1px 3px rgba(0,0,0,.55)}
  #tag{top:0;left:0;padding:16px 18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1.7}

  #map{position:fixed;right:16px;top:86px;width:186px;height:186px;pointer-events:none;opacity:.9}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="meshopt_decoder.js"></script>
<script src="GLTFLoader.js"></script>
<script>
const ASSETS = {
  geoManifest: null,                       // filled by boot() from trees.json
  geo:   "trees.bin",
  bark:  "bark.jpg",
  barkN: "barkn.jpg",
  leaf:  "leaf.png",
  road:  "road.jpg",
  rock:  "rock.jpg",
  car:   "car.glb",
  snd:   { accel:"accel.mp3", idle:"idle.mp3",
           brake:"brake.mp3", coast:"coast.mp3" }
};
</script>
<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- helpers */
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=>a+(b-a)*t;
const smoothstep = (e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const sRGB  = h=>new THREE.Color(h).convertSRGBToLinear();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n);}
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y,oct){
  let s=0,amp=1,f=1,tot=0;
  for(let i=0;i<(oct||4);i++){ s+=vnoise(x*f,y*f)*amp; tot+=amp; amp*=0.5; f*=2.03; }
  return s/tot;
}

/* road cross-section (metres, lateral offset from the centreline) */
const ROAD_HALF   = 7.6;    // asphalt half width — 15.2 m, wide modern F1 spec
const LANE_EDGE   = 6.75;   // white edge line offset
const KERB_W      = 2.0;    // kerb width, outboard of the edge line
const SHOULDER    = 11.4;   // gravel outer edge
const TREE_CLEAR  = 22.0;   // nearest trunk to the centreline
const LAP_TARGET  = 5000;   // circuit length, metres

const shadowCasters=[];
const treeCells=[];

/* ================================================================= TRACK ==
   The circuit is authored as a closed polyline in the units of the layout
   sketch, run through a centripetal Catmull-Rom, then uniformly scaled so the
   lap comes out at LAP_TARGET metres. Everything downstream — road ribbon,
   kerbs, posts, trees, terrain flattening, the car itself — is placed in
   (s, lateral) track space rather than world x/z, which is what lets the
   straight road become a circuit at all.

   Index 0 is the start of the main straight; index 4 is its far end.        */
/* A Catmull-Rom segment is exactly a straight line only when all four points
   it reads -- the two ends plus one either side -- are collinear. Eight
   collinear points therefore buy an exactly straight run from index 1 to
   index 6; the bends live entirely in the 0->1 and 6->7 segments, outside
   the part of the straight you actually drive down. */
const TRACK_PX=[
  [ 430,735],[ 513,735],[ 596,735],[ 679,735],                // main straight,
  [ 762,735],[ 845,735],[ 928,735],[1010,735],                // exactly collinear
  [1103,716],[1152,660],                                      // sweep up the right end
  [1125,600],[1062,563],[1022,527],                           // in to the tight notch
  [1058,484],[1118,442],[1151,412],                           // back out to the far right
  [1130,366],[1050,327],[ 957,311],                           // over the top-right crest
  [ 866,332],[ 776,369],[ 688,399],[ 639,413],                // long top sweep to the saddle
  [ 599,398],[ 557,351],[ 519,299],[ 457,281],                // rise to the top-left crest
  [ 399,317],[ 378,389],                                      // down the left flank
  [ 401,439],[ 452,489],                                      // the inward kink
  [ 423,537],[ 389,591],[ 381,647],[ 399,701]                 // final left onto the straight
];
const STRAIGHT_BEG_I = 1;
const STRAIGHT_END_I = 6;

let LAP=0, NSAMP=0, DS=1;
let sx=null, sz=null, tanx=null, tanz=null, kap=null;
let START_S=6, FINISH_S=0, STRAIGHT_S0=0, STRAIGHT_S1=0;
let TRK_MINX=0, TRK_MAXX=0, TRK_MINZ=0, TRK_MAXZ=0;

(function buildTrack(){
  const pts=TRACK_PX.map(p=>new THREE.Vector3(p[0],0,p[1]));
  let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;
  pts.forEach(p=>{mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mnz=Math.min(mnz,p.z);mxz=Math.max(mxz,p.z);});
  const cx=(mnx+mxx)/2, cz=(mnz+mxz)/2;
  pts.forEach(p=>{p.x-=cx;p.z-=cz;});

  // centripetal parameterisation: the tight kinks on the left flank and the
  // right-hand loop would cusp or loop back under the uniform variant.
  const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal',0.5);

  const D=24000;
  const px=new Float64Array(D+1), pz=new Float64Array(D+1), cum=new Float64Array(D+1);
  const v=new THREE.Vector3();
  for(let i=0;i<=D;i++){ curve.getPoint(i/D,v); px[i]=v.x; pz[i]=v.z; }
  for(let i=0;i<D;i++) cum[i+1]=cum[i]+Math.hypot(px[i+1]-px[i],pz[i+1]-pz[i]);

  // one uniform scale takes the sketch to metres; the lap is then exact
  const SC=LAP_TARGET/cum[D];
  for(let i=0;i<=D;i++){ px[i]*=SC; pz[i]*=SC; cum[i]*=SC; }
  LAP=LAP_TARGET; NSAMP=Math.round(LAP); DS=LAP/NSAMP;

  sx=new Float32Array(NSAMP); sz=new Float32Array(NSAMP);
  let j=0;
  for(let i=0;i<NSAMP;i++){
    const t=i*DS;
    while(j<D-1 && cum[j+1]<t) j++;
    const f=(t-cum[j])/Math.max(cum[j+1]-cum[j],1e-9);
    sx[i]=px[j]+(px[j+1]-px[j])*f;
    sz[i]=pz[j]+(pz[j+1]-pz[j])*f;
  }

  // tangents by central difference on the arclength-uniform samples
  tanx=new Float32Array(NSAMP); tanz=new Float32Array(NSAMP);
  for(let i=0;i<NSAMP;i++){
    const a=(i-1+NSAMP)%NSAMP, b=(i+1)%NSAMP;
    let dx=sx[b]-sx[a], dz=sz[b]-sz[a];
    const L=Math.hypot(dx,dz)||1;
    tanx[i]=dx/L; tanz[i]=dz/L;
  }
  /* Signed curvature, +ve = turning left. theta = atan2(tx,tz) is the yaw about
     +y, and increasing it swings +z toward +x — which is the driver's left,
     because with forward = +z and up = +y the car's local +x points left.   */
  const raw=new Float32Array(NSAMP);
  for(let i=0;i<NSAMP;i++){
    const b=(i+1)%NSAMP;
    let d=Math.atan2(tanx[b],tanz[b])-Math.atan2(tanx[i],tanz[i]);
    while(d> Math.PI) d-=Math.PI*2;
    while(d<-Math.PI) d+=Math.PI*2;
    raw[i]=d/DS;
  }
  // box-filter it: the raw signal is noisy enough to make the kerbs stutter
  // and the steering wheel jitter on a straight.
  kap=new Float32Array(NSAMP);
  const R=7;
  for(let i=0;i<NSAMP;i++){
    let a=0;
    for(let k=-R;k<=R;k++) a+=raw[(i+k+NSAMP)%NSAMP];
    kap[i]=a/(R*2+1);
  }

  for(let i=0;i<NSAMP;i++){
    if(sx[i]<TRK_MINX||i===0)TRK_MINX=sx[i];
    if(sx[i]>TRK_MAXX||i===0)TRK_MAXX=sx[i];
    if(sz[i]<TRK_MINZ||i===0)TRK_MINZ=sz[i];
    if(sz[i]>TRK_MAXZ||i===0)TRK_MAXZ=sz[i];
  }

  // s of a control point, found by matching its scaled position to a sample
  const sOfPoint=i=>{
    const ex=(TRACK_PX[i][0]-cx)*SC, ez=(TRACK_PX[i][1]-cz)*SC;
    let best=1e18, bi=0;
    for(let k=0;k<NSAMP;k++){
      const d=(sx[k]-ex)*(sx[k]-ex)+(sz[k]-ez)*(sz[k]-ez);
      if(d<best){best=d;bi=k;}
    }
    return bi*DS;
  };
  STRAIGHT_S0=sOfPoint(STRAIGHT_BEG_I);
  STRAIGHT_S1=sOfPoint(STRAIGHT_END_I);
  // start/finish sits about seven tenths down the straight — past the middle,
  // with enough road left to still be braking for turn one after it.
  FINISH_S = STRAIGHT_S0 + (STRAIGHT_S1-STRAIGHT_S0)*0.70;
  START_S  = STRAIGHT_S0;            // lights out at the start of the dead-straight run
})();

const _ta=new THREE.Vector2(), _td=new THREE.Vector2();
function trackAt(s,out){
  let u=s/DS; u%=NSAMP; if(u<0)u+=NSAMP;
  const i=u|0, f=u-i, j=(i+1)%NSAMP;
  out.x=sx[i]+(sx[j]-sx[i])*f;
  out.y=sz[i]+(sz[j]-sz[i])*f;
  return out;
}
/* tangent lerped as a vector then renormalised — interpolating the angle
   instead would need wrap handling and still misbehave through pi. */
function trackDir(s,out){
  let u=s/DS; u%=NSAMP; if(u<0)u+=NSAMP;
  const i=u|0, f=u-i, j=(i+1)%NSAMP;
  let x=tanx[i]+(tanx[j]-tanx[i])*f, z=tanz[i]+(tanz[j]-tanz[i])*f;
  const L=Math.hypot(x,z)||1;
  out.x=x/L; out.y=z/L;
  return out;
}
function trackK(s){
  let u=s/DS; u%=NSAMP; if(u<0)u+=NSAMP;
  const i=u|0, f=u-i, j=(i+1)%NSAMP;
  return kap[i]+(kap[j]-kap[i])*f;
}
/* world point at (s, lateral) — +lateral is the driver's left */
function trackPos(s,lat,y,out){
  trackAt(s,_ta); trackDir(s,_td);
  out.set(_ta.x+_td.y*lat, y, _ta.y-_td.x*lat);
  return out;
}

/* ---- distance-to-centreline field -------------------------------------
   Terrain flattening and tree rejection both need "how far is this world
   point from the track", tens of thousands of times. A uniform bucket grid
   over decimated centreline samples answers it in a fixed 7x7 cell scan,
   which is exact out to 3 cells (120 m) and saturates beyond — and 120 m is
   further than anything downstream cares about.                           */
const DCELL=40, DRING=3;
let dgX0=0, dgZ0=0, dgNX=0, dgNZ=0, dgBins=null;
(function buildDistGrid(){
  const pad=DCELL*(DRING+1);
  dgX0=TRK_MINX-pad; dgZ0=TRK_MINZ-pad;
  dgNX=Math.ceil((TRK_MAXX-TRK_MINX+pad*2)/DCELL);
  dgNZ=Math.ceil((TRK_MAXZ-TRK_MINZ+pad*2)/DCELL);
  dgBins=new Array(dgNX*dgNZ);
  for(let i=0;i<NSAMP;i+=4){
    const cx=Math.floor((sx[i]-dgX0)/DCELL), cz=Math.floor((sz[i]-dgZ0)/DCELL);
    if(cx<0||cz<0||cx>=dgNX||cz>=dgNZ) continue;
    const k=cz*dgNX+cx;
    (dgBins[k]||(dgBins[k]=[])).push(i);
  }
})();
const DFAR=1e6;
function distToTrack(x,z){
  const cx=Math.floor((x-dgX0)/DCELL), cz=Math.floor((z-dgZ0)/DCELL);
  let best=DFAR;
  for(let a=-DRING;a<=DRING;a++){
    const gz=cz+a; if(gz<0||gz>=dgNZ) continue;
    for(let b=-DRING;b<=DRING;b++){
      const gx=cx+b; if(gx<0||gx>=dgNX) continue;
      const bin=dgBins[gz*dgNX+gx]; if(!bin) continue;
      for(let n=0;n<bin.length;n++){
        const i=bin[n], dx=sx[i]-x, dz=sz[i]-z;
        const d=dx*dx+dz*dz;
        if(d<best) best=d;
      }
    }
  }
  return best===DFAR?DFAR:Math.sqrt(best);
}

/* terrain: dead flat across the whole circuit and its run-off, rolling only
   once you are well clear of the track. The track surface itself is flat. */
function terrainH(x,z){
  const k=smoothstep(34,115,distToTrack(x,z));
  if(k<=0) return 0;
  const big=(fbm(x*0.0022,z*0.0022,4)-0.5)*46;
  const mid=(fbm(x*0.011, z*0.011, 3)-0.5)*7;
  return (big+mid)*k;
}

/* ------------------------------------------------------------- decode geo */
let GEO_BUF=null;      // trees.bin, fetched before the trees are built
function buildGeometry(rec, buf){
  const n=rec.count;
  const qp=new Int16Array(buf, rec.pos, n*3);
  const qn=new Int8Array (buf, rec.nrm, n*3);
  const qu=new Uint16Array(buf, rec.uv,  n*2);
  const pos=new Float32Array(n*3), nrm=new Float32Array(n*3), uv=new Float32Array(n*2);
  const pmin=rec.pmin, prng=rec.prng, umin=rec.umin, urng=rec.urng;
  for(let i=0;i<n;i++){
    for(let a=0;a<3;a++){
      const t=(qp[i*3+a]+32767)/65534;
      pos[i*3+a]=pmin[a]+t*prng[a];
      nrm[i*3+a]=qn[i*3+a]/127;
    }
    uv[i*2  ]=umin[0]+(qu[i*2  ]/65535)*urng[0];
    uv[i*2+1]=umin[1]+(qu[i*2+1]/65535)*urng[1];
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  // r128 only multiplies vColor into the fragment when USE_COLOR is defined --
  // instanceColor alone is written in the vertex stage and then dropped. A
  // neutral white colour attribute turns USE_COLOR on so the per-tree tint
  // actually survives to the fragment. Without it every tree renders identical;
  // with vertexColors but no attribute, every tree renders black.
  const white=new Float32Array(n*3); white.fill(1);
  g.setAttribute('color',   new THREE.BufferAttribute(white,3));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(buf, rec.idx, rec.icount),1));
  g.computeBoundingSphere();
  return g;
}

/* ------------------------------------------------------- procedural maps */
function wrapDrawRect(ctx,W,H,x,y,pad,fn){
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
    if(dx&&Math.min(x,W-x)>pad) continue;
    if(dy&&Math.min(y,H-y)>pad) continue;
    ctx.save(); ctx.translate(x+dx*W, y+dy*H); fn(ctx); ctx.restore();
  }
}
function wrapDraw(ctx,size,x,y,fn){ wrapDrawRect(ctx,size,size,x,y,24,fn); }
function groundTexture(){
  const S=512, c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d');
  g.fillStyle='#545c30'; g.fillRect(0,0,S,S);
  const rand=mulberry32(7);
  const blotch=['#4a5329','#5d6634','#494f2a','#6a6f3c','#5b5330','#41482a'];
  for(let i=0;i<520;i++){
    const x=rand()*S,y=rand()*S,r=8+rand()*46;
    g.globalAlpha=.16+rand()*.22; g.fillStyle=blotch[(rand()*blotch.length)|0];
    wrapDraw(g,S,x,y,ctx=>{ctx.beginPath();ctx.ellipse(0,0,r,r*(.5+rand()*.8),rand()*6.28,0,6.28);ctx.fill();});
  }
  const blade=['#6e7a3c','#7d8846','#5a6430','#465027','#8a8f4e','#6b5f34'];
  g.lineCap='round';
  for(let i=0;i<9000;i++){
    const x=rand()*S,y=rand()*S,a=rand()*6.283,len=2+rand()*6;
    g.globalAlpha=.34+rand()*.5; g.strokeStyle=blade[(rand()*blade.length)|0];
    g.lineWidth=.8+rand()*1.3;
    wrapDraw(g,S,x,y,ctx=>{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.stroke();});
  }
  g.globalAlpha=1;
  const id=g.getImageData(0,0,S,S), d=id.data;
  for(let i=0;i<d.length;i+=4){
    const n=(rand()-.5)*26; d[i]+=n; d[i+1]+=n*1.05; d[i+2]+=n*.7;
  }
  g.putImageData(id,0,0);
  return c;
}
/* multiplied over the asphalt: wheel polish, patch repairs, hairline cracks */
function wearTexture(){
  const W=256,H=1024, c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);
  const rand=mulberry32(21);
  const uOf = x => (x/(ROAD_HALF*2)+0.5)*W;  // metres from centre -> px
  // polished wheel paths (lighter, worn smooth)
  [-2.6,-0.85,0.85,2.6].forEach(m=>{
    const gr=g.createLinearGradient(uOf(m-0.95),0,uOf(m+0.95),0);
    gr.addColorStop(0,'rgba(255,255,255,0)');
    gr.addColorStop(.5,'rgba(255,255,255,.85)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.globalCompositeOperation='lighten';
    g.fillRect(uOf(m-0.95),0,uOf(m+0.95)-uOf(m-0.95),H);
  });
  g.globalCompositeOperation='source-over';
  // dark centre grime + edge grime
  [[0,0.55,.20],[-ROAD_HALF+0.4,0.9,.26],[ROAD_HALF-0.4,0.9,.26]].forEach(([m,w,a])=>{
    const gr=g.createLinearGradient(uOf(m-w),0,uOf(m+w),0);
    gr.addColorStop(0,'rgba(0,0,0,0)');
    gr.addColorStop(.5,'rgba(0,0,0,'+a+')');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(uOf(m-w),0,uOf(m+w)-uOf(m-w),H);
  });
  // patch repairs — drawn wrapped so the strip tiles end-to-end
  for(let i=0;i<9;i++){
    const x=rand()*W, y=rand()*H, w=30+rand()*90, h=40+rand()*160;
    const al=.10+rand()*.13, fill=rand()>.5?'#000':'#fff';
    wrapDrawRect(g,W,H,x,y,180,ctx=>{
      ctx.globalAlpha=al; ctx.fillStyle=fill; ctx.fillRect(-w/2,-h/2,w,h);
    });
  }
  // hairline cracks
  g.globalAlpha=1;
  for(let i=0;i<34;i++){
    const x0=rand()*W, y0=rand()*H, lw=.6+rand()*1.1;
    const steps=6+(rand()*10|0), pts=[[0,0]];
    let px=0,py=0;
    for(let s=0;s<steps;s++){ px+=(rand()-.5)*34; py+=(rand()-.35)*40; pts.push([px,py]); }
    wrapDrawRect(g,W,H,x0,y0,420,ctx=>{
      ctx.strokeStyle='rgba(0,0,0,.30)'; ctx.lineWidth=lw;
      ctx.beginPath(); ctx.moveTo(0,0);
      for(const p of pts) ctx.lineTo(p[0],p[1]);
      ctx.stroke();
    });
  }
  // longitudinal seam where the two paving lanes meet
  g.globalAlpha=1;
  g.strokeStyle='rgba(0,0,0,.34)'; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(uOf(0),0); g.lineTo(uOf(0),H); g.stroke();
  return c;
}

/* Kerb stripes. Generated rather than photographed: every texture host in
   reach is blocked here, and a procedural map tiles exactly along the kerb
   (which a photo would not) so the stripes cannot drift or seam at the joins.
   v runs along the kerb, u across it. */
function kerbTexture(){
  const W=128, H=256, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  const rand=mulberry32(4242);
  // two stripes per tile, so one tile = one red + one white block
  const red='#b4291a', white='#e9e6dc';
  for(let i=0;i<2;i++){
    g.fillStyle = i?white:red;
    g.fillRect(0, i*H/2, W, H/2);
  }
  // shade the outer third darker: that edge sits lower once the ramp tilts it
  const gr=g.createLinearGradient(0,0,W,0);
  gr.addColorStop(0,'rgba(0,0,0,0)');
  gr.addColorStop(0.62,'rgba(0,0,0,0.05)');
  gr.addColorStop(1,'rgba(0,0,0,0.30)');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // rubber scrub along the inner edge, where the cars actually clip it
  const gr2=g.createLinearGradient(0,0,W*0.34,0);
  gr2.addColorStop(0,'rgba(24,20,20,0.44)');
  gr2.addColorStop(1,'rgba(24,20,20,0)');
  g.fillStyle=gr2; g.fillRect(0,0,W*0.34,H);
  // grime and chipping, wrapped so the tile stays seamless
  for(let i=0;i<260;i++){
    const x=rand()*W, y=rand()*H, r=1+rand()*4.5;
    g.globalAlpha=0.05+rand()*0.17;
    g.fillStyle=rand()>0.45?'#000':'#fff';
    wrapDrawRect(g,W,H,x,y,10,ctx=>{ctx.beginPath();ctx.arc(0,0,r,0,6.2832);ctx.fill();});
  }
  // crisp dark seam between the blocks so they read as separate slabs
  g.globalAlpha=1; g.fillStyle='rgba(0,0,0,.34)';
  g.fillRect(0,H/2-1.5,W,3); g.fillRect(0,0,W,1.5); g.fillRect(0,H-1.5,W,1.5);
  return c;
}

/* Barrier facing. u runs along the barrier, v up it. One tile is a white
   panel plus a red one, so the stripes count off distance as they go by. */
function barrierTexture(){
  const W=256,H=64,c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#e9e7df'; g.fillRect(0,0,W,H);
  g.fillStyle='#bf2a1b'; g.fillRect(W/2,0,W/2,H);
  // armco corrugation: a bright waist with shaded lips top and bottom
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0.00,'rgba(0,0,0,.34)');
  gr.addColorStop(0.20,'rgba(255,255,255,.14)');
  gr.addColorStop(0.50,'rgba(0,0,0,.22)');
  gr.addColorStop(0.80,'rgba(255,255,255,.10)');
  gr.addColorStop(1.00,'rgba(0,0,0,.46)');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // support posts, one per half panel
  g.fillStyle='rgba(0,0,0,.28)';
  for(let i=0;i<4;i++) g.fillRect(i*W/4+W/8-3,0,6,H);
  const rand=mulberry32(31);
  for(let i=0;i<220;i++){
    g.globalAlpha=.04+rand()*.10;
    g.fillStyle=rand()>.5?'#000':'#fff';
    const x=rand()*W,y=rand()*H,r=1+rand()*5;
    wrapDrawRect(g,W,H,x,y,8,ctx=>{ctx.beginPath();ctx.arc(0,0,r,0,6.2832);ctx.fill();});
  }
  return c;
}
/* Distance board. Drawn once per number and used as its own material. */

let pending=0, loaded=0;
const bar=document.querySelector('#bar i');
function texture(src, srgb, rw, rh){
  pending++;
  const t=new THREE.Texture();
  t.userData={clones:[]};   // r128 does not create userData on Texture
  const img=new Image();
  img.onload=()=>{
    t.image=img; t.needsUpdate=true;
    // clones made before the image arrived are still empty -- fill them now
    for(const c of (t.userData.clones||[])){ c.image=img; c.needsUpdate=true; }
    loaded++;
    bar.style.width=Math.round(loaded/pending*100)+'%';
    if(loaded>=pending) ready();
  };
  img.src=src;
  t.wrapS = rw||THREE.RepeatWrapping;
  t.wrapT = rh||THREE.RepeatWrapping;
  t.anisotropy = MAXANISO;
  if(srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}
/* Texture.clone() copies .image by reference, so a clone taken before the
   image has decoded stays permanently blank. Register it instead. */
function cloneTex(t){
  const c=t.clone();
  c.needsUpdate=true;
  if(t.image){ c.image=t.image; return c; }
  if(!t.userData) t.userData={};
  if(!t.userData.clones) t.userData.clones=[];
  t.userData.clones.push(c);
  return c;
}

(function buildTerrain(){

  const dirt=new THREE.Color(0.50,0.44,0.33);

  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i);
    const d=distToTrack(x,z);
    const k=smoothstep(34,115,d);
    let h=0;
    if(k>0){
      h=((fbm(x*0.0022,z*0.0022,4)-0.5)*46 + (fbm(x*0.011,z*0.011,3)-0.5)*7)*k;
    }
    p.setY(i,h);
    const t=fbm(x*0.006,z*0.006,3);
    c.copy(green).lerp(dry, clamp(t*1.5-0.25,0,1));
    const verge=1-smoothstep(7,32,d);            // scuffed dirt beside the tarmac
    c.lerp(dirt, verge*0.75);

/* ------------------------------------------------------------------- road */
const roadGroup=new THREE.Group(); scene.add(roadGroup);

/* Every texture that runs along the track has to close on itself at the
   start/finish, so each nominal tile length is rounded to the nearest whole
   number of repeats per lap. Same idea as the old 180 m road snap, but now
   the constraint is one lap instead of one recycle step. */
const fitTile = L => LAP/Math.round(LAP/L);
const ASPH_TILE = fitTile(3.0);
const GRAV_TILE = fitTile(2.4);
const WEAR_TILE = fitTile(60);

const RSTEP = 2;                       // metres between ribbon rings
const RN    = Math.round(LAP/RSTEP);

/* A flat ribbon swept along the centreline between two lateral offsets.
   la is the left edge, lb the right; winding is set so the face points up. */
function ribbonGeo(la, lb, y, ua, ub, vTile, wear){
  const n=RN+1;                        // the closing ring repeats ring 0 at s=LAP
  const pos=new Float32Array(n*2*3), nrm=new Float32Array(n*2*3),
        uv =new Float32Array(n*2*2);
  const aw = wear ? new Float32Array(n*2*2) : null;
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  for(let i=0;i<n;i++){
    const s=i*RSTEP;
    trackAt(s,p); trackDir(s,d);
    const nx=d.y, nz=-d.x;             // unit left normal
    const v=s/vTile;
    for(let k=0;k<2;k++){
      const lat=k?lb:la, o=(i*2+k);
      pos[o*3  ]=p.x+nx*lat;
      pos[o*3+1]=y;
      pos[o*3+2]=p.y+nz*lat;
      nrm[o*3+1]=1;
      uv[o*2  ]=k?ub:ua;
      uv[o*2+1]=v;
      if(aw){ aw[o*2]=k?0:1; aw[o*2+1]=s/WEAR_TILE; }
    }
  }
  // n*2 vertices; stay on 16-bit indices while that fits, so the ribbon does
  // not silently depend on OES_element_index_uint
  const idx=(n*2<=65536)?new Uint16Array(RN*6):new Uint32Array(RN*6);
  for(let i=0;i<RN;i++){
    const a=i*2, b=a+1, cc=a+2, dd=a+3;
    idx[i*6  ]=a; idx[i*6+1]=b; idx[i*6+2]=cc;
    idx[i*6+3]=b; idx[i*6+4]=dd; idx[i*6+5]=cc;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  if(aw) g.setAttribute('aWear',new THREE.BufferAttribute(aw,2));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeBoundingSphere();
  return g;
}

(function buildRoad(){
  texRoad.repeat.set(1,1);             // tiling is baked into the ribbon UVs

  const asphalt=new THREE.MeshStandardMaterial({
    map:texRoad, bumpMap:texRoad, bumpScale:0.035,
    roughnessMap:texRoad, roughness:0.97, metalness:0,
    color:sRGB(0xa8a8a8)
  });
  /* The wear strip needs its own 0..1 cross-track coordinate (the asphalt uv.x
     runs 0..3 for tiling) and its own much longer v period, so it rides on a
     dedicated attribute rather than being derived from uv. */
  asphalt.onBeforeCompile=sh=>{
    sh.uniforms.uWear={value:texWear};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nattribute vec2 aWear;\nvarying vec2 vWear;')
      .replace('#include <uv_vertex>','#include <uv_vertex>\nvWear=aWear;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform sampler2D uWear;\nvarying vec2 vWear;')
      .replace('#include <map_fragment>',
        '#include <map_fragment>\nvec3 wr=texture2D(uWear,vWear).rgb;\ndiffuseColor.rgb*=mix(vec3(1.0),wr,0.85);');
  };
  const road=new THREE.Mesh(
    ribbonGeo(ROAD_HALF,-ROAD_HALF, 0.12, 0,3, ASPH_TILE, true), asphalt);
  road.receiveShadow=true; road.frustumCulled=false;
  roadGroup.add(road);

  // gravel shoulders
  const gravel=new THREE.MeshStandardMaterial({map:cloneTex(texRock),roughness:1,metalness:0,color:sRGB(0x8d8578)});
  gravel.map.wrapS=gravel.map.wrapT=THREE.RepeatWrapping;
  gravel.map.repeat.set(1,1); gravel.map.encoding=THREE.sRGBEncoding;
  gravel.map.anisotropy=MAXANISO;
  [[SHOULDER,ROAD_HALF],[-ROAD_HALF,-SHOULDER]].forEach(([a,b])=>{
    const m=new THREE.Mesh(ribbonGeo(a,b,0.10,0,1.1,GRAV_TILE,false),gravel);
    m.receiveShadow=true; m.frustumCulled=false;
    roadGroup.add(m);
  });

  // edge lines
  const paint=new THREE.MeshStandardMaterial({
    color:sRGB(0xdedbd0), roughness:0.7, metalness:0,
    polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4
  });
  [[LANE_EDGE+0.075,LANE_EDGE-0.075],[-LANE_EDGE+0.075,-LANE_EDGE-0.075]].forEach(([a,b])=>{
    const m=new THREE.Mesh(ribbonGeo(a,b,0.14,0,1,ASPH_TILE,false),paint);
    m.frustumCulled=false;
    roadGroup.add(m);
  });

  /* Kerbs. Laid on the inside of anything tighter than a 170 m radius. The
     inside of a turn is the +lateral side when the signed curvature is
     positive, which is exactly how kap is defined.

     Built as a swept ramp rather than a row of slabs: three lateral stations
     (flush with the asphalt, raised mid, raised outer lip) so the profile
     catches the light and reads as a real kerb from inside the cockpit. Each
     corner run gets its stripe period rounded to a whole number of blocks so
     the pattern starts and ends on a block edge instead of mid-stripe. */
  const KERB_TH=1/170, KBLOCK=1.35;              // nominal red/white block length
  const kerbRuns=[];
  {
    let cur=null;
    for(let s=0;s<LAP;s+=1){
      const k=trackK(s);
      const on=Math.abs(k)>KERB_TH;
      if(on){
        const side=k>0?1:-1;
        if(cur && cur.side!==side){ kerbRuns.push(cur); cur=null; }
        if(!cur) cur={s0:s, side};
        cur.s1=s;
      } else if(cur){ kerbRuns.push(cur); cur=null; }
    }
    if(cur) kerbRuns.push(cur);
  }
  const KP=[                                     // lateral offset, height, u
    [LANE_EDGE+0.02,        0.125, 0.00],
    [LANE_EDGE+KERB_W*0.5,  0.215, 0.50],
    [LANE_EDGE+KERB_W,      0.245, 1.00]
  ];
  {
    const pos=[], nrm=[], uv=[], idx=[];
    const p2=new THREE.Vector2(), d2=new THREE.Vector2();
    let base=0;
    kerbRuns.forEach(run=>{
      const len=run.s1-run.s0;
      if(len<6) return;                          // too short to read as a kerb
      const blocks=Math.max(2,Math.round(len/KBLOCK));
      const rings=blocks*3;                      // 3 rings per block keeps curves smooth
      const stripes=blocks/2;                    // one texture tile = red + white
      for(let i=0;i<=rings;i++){
        const t=i/rings, s=run.s0+t*len;
        trackAt(s,p2); trackDir(s,d2);
        const nx=d2.y, nz=-d2.x;                 // unit left normal
        for(let k=0;k<3;k++){
          // mirror the profile for a right-hand kerb, and walk the stations in
          // left-to-right order either way so the winding still faces up
          const st=KP[run.side>0 ? 2-k : k];
          const lat=run.side*st[0];
          pos.push(p2.x+nx*lat, st[1], p2.y+nz*lat);
          nrm.push(0,1,0);
          // u follows the station, never the emission order: u=0 is the
          // rubber-scrubbed track edge on both hands of kerb
          uv.push(st[2], t*stripes);
        }
      }
      for(let i=0;i<rings;i++) for(let k=0;k<2;k++){
        const a=base+i*3+k, b=a+1, c=a+3, d=a+4;
        idx.push(a,b,c, b,d,c);
      }
      base+=(rings+1)*3;
    });
    if(idx.length){
      const G=new THREE.BufferGeometry();
      G.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      G.setAttribute('normal',  new THREE.Float32BufferAttribute(nrm,3));
      G.setAttribute('uv',      new THREE.Float32BufferAttribute(uv,2));
      G.setIndex(pos.length/3>65000 ? new THREE.Uint32BufferAttribute(idx,1)
                                    : new THREE.Uint16BufferAttribute(idx,1));
      G.computeVertexNormals();                  // the ramp faces need real normals
      const kerbMat=new THREE.MeshStandardMaterial({
        map:texKerb, roughness:0.58, metalness:0
      });
      const kerbMesh=new THREE.Mesh(G,kerbMat);
      kerbMesh.frustumCulled=false; kerbMesh.receiveShadow=true;
      roadGroup.add(kerbMesh);
    }
  }

  // reflective marker posts, outside the gravel on both sides
  const mtx=new THREE.Matrix4(), q=new THREE.Quaternion(),
        v3=new THREE.Vector3(), one=new THREE.Vector3(1,1,1),
        p2=new THREE.Vector2(), d2=new THREE.Vector2();
  const postGeo=new THREE.BoxGeometry(0.11,1.05,0.07); postGeo.translate(0,0.525,0);
  const postMat=new THREE.MeshStandardMaterial({color:sRGB(0xe8e5da),roughness:0.6});
  const capMat =new THREE.MeshStandardMaterial({color:sRGB(0xb52d1c),roughness:0.45,
                                                emissive:sRGB(0x521008),emissiveIntensity:.5});
  const capGeo=new THREE.BoxGeometry(0.09,0.16,0.075); capGeo.translate(0,0.86,0);
  const cnt=Math.floor(LAP/45)*2;
  const posts=new THREE.InstancedMesh(postGeo,postMat,cnt);
  const caps =new THREE.InstancedMesh(capGeo, capMat, cnt);
  posts.castShadow=true;
  let k=0;
  for(let i=0;i<cnt/2;i++) for(const sgn of [-1,1]){
    const s=i*45;
    trackAt(s,p2); trackDir(s,d2);
    const lat=sgn*(SHOULDER+0.5);
    v3.set(p2.x+d2.y*lat, 0.02, p2.y-d2.x*lat);
    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(d2.x,d2.y));
    mtx.compose(v3,q,one);
    posts.setMatrixAt(k,mtx); caps.setMatrixAt(k,mtx); k++;
  }
  posts.instanceMatrix.needsUpdate=true; caps.instanceMatrix.needsUpdate=true;
  posts.frustumCulled=false; caps.frustumCulled=false;
  posts.userData.casts=true; shadowCasters.push(posts);
  roadGroup.add(posts,caps);
})();

/* --------------------------------------------------------------- barriers */
/* The point of these is visibility, not safety. The track is dead flat, so at
   an eye height of 0.85 m a point 200 m away sits a quarter of a degree below
   the horizon -- the whole 100-300 m braking zone collapses into about four
   pixels, and every flat cue (tarmac, kerbs, painted lines) collapses with it.
   Anything with height does not: a waist-high wall following the track edge
   draws the corner as a line in the air long after the road surface has gone,
   which is what lets you read how sharp the next corner is from the cockpit. */
const BARRIER_LAT=SHOULDER+2.4, BARRIER_Y0=0.28, BARRIER_Y1=1.08;
const BARRIER_TILE=fitTile(8);

/* A vertical ribbon: fixed lateral offset, swept between two heights. The
   horizontal ribbonGeo above sweeps between two lateral offsets at one height,
   which is the other half of the same idea. */
function wallGeo(lat,y0,y1,uTile){
  const n=RN+1;
  const pos=new Float32Array(n*2*3), uv=new Float32Array(n*2*2);
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  for(let i=0;i<n;i++){
    const s=i*RSTEP;
    trackAt(s,p); trackDir(s,d);
    const X=p.x+d.y*lat, Z=p.y-d.x*lat, u=s/uTile;
    for(let k=0;k<2;k++){
      const o=i*2+k;
      pos[o*3]=X; pos[o*3+1]=k?y1:y0; pos[o*3+2]=Z;
      uv[o*2]=u;  uv[o*2+1]=k?1:0;
    }
  }
  const idx=(n*2<=65536)?new Uint16Array(RN*6):new Uint32Array(RN*6);
  for(let i=0;i<RN;i++){
    const a=i*2,b=a+1,c=a+2,d2=a+3;
    idx[i*6  ]=a; idx[i*6+1]=c; idx[i*6+2]=b;
    idx[i*6+3]=b; idx[i*6+4]=c; idx[i*6+5]=d2;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

(function buildBarriers(){
  // DoubleSide so the winding never matters and the far barrier still reads
  // through a corner from either hand
  const mat=new THREE.MeshStandardMaterial({
    map:texBarrier, side:THREE.DoubleSide, roughness:0.62, metalness:0.15
  });
  [-1,1].forEach(sg=>{
    const m=new THREE.Mesh(wallGeo(sg*BARRIER_LAT,BARRIER_Y0,BARRIER_Y1,BARRIER_TILE),mat);
    m.frustumCulled=false; m.receiveShadow=true;
    m.castShadow=true; m.userData.casts=true; shadowCasters.push(m);
    roadGroup.add(m);
  });
})();

/* ------------------------------------------------------- distance boards */
/* Corner entries, and the 200/150/100/50 m boards on the approach to each.
   Boards stand clear of the ground so they keep their angular height at
   distance, which is the same reason the barriers work. */
const CORNER_TH=1/260;                 // anything tighter than 260 m counts
function cornerEntries(){
  const out=[]; let inC=false, startS=0, peak=0;
  for(let s=0;s<LAP;s+=2){
    const k=trackK(s), on=Math.abs(k)>CORNER_TH;
    if(on&&!inC){ inC=true; startS=s; peak=k; }
    else if(on){ if(Math.abs(k)>Math.abs(peak)) peak=k; }
    else if(inC){ inC=false; out.push({s:startS,peak}); }
  }
  if(inC) out.push({s:startS,peak});
  return out;
}

(function buildBoards(){
  const ENTRIES=cornerEntries();
  const DISTS=[200,150,100,50];
  const BW=1.7, BH=1.25, POST_H=0.95;
  const slots=DISTS.map(()=>[]);
  const posts=[];
  ENTRIES.forEach(c=>{
    // outside of the corner: the inside is +lateral when curvature is positive
    const side=c.peak>0?-1:1;
    DISTS.forEach((d,di)=>{
      let s=c.s-d; if(s<0) s+=LAP;
      // a board only makes sense on the approach, not buried inside the
      // previous corner, where it would be behind you before it was readable
      if(Math.abs(trackK(s))>CORNER_TH) return;
      slots[di].push({s,side});
      posts.push({s,side});
    });
  });

  const mtx=new THREE.Matrix4(), q=new THREE.Quaternion(),
        v3=new THREE.Vector3(), one=new THREE.Vector3(1,1,1),
        p2=new THREE.Vector2(), d2=new THREE.Vector2(),
        AXIS=new THREE.Vector3(0,1,0);
  const place=(s,side,y)=>{
    trackAt(s,p2); trackDir(s,d2);
    const lat=side*(SHOULDER+1.9);
    v3.set(p2.x+d2.y*lat, y, p2.y-d2.x*lat);
    // face back down the track so it is readable on the approach
    q.setFromAxisAngle(AXIS, Math.atan2(-d2.x,-d2.y));
    mtx.compose(v3,q,one);
    return mtx;
  };

  const boardGeo=new THREE.PlaneGeometry(BW,BH);
  DISTS.forEach((d,di)=>{
    const list=slots[di];
    if(!list.length) return;
    const tex=new THREE.CanvasTexture(boardTexture(d));
    tex.anisotropy=MAXANISO; tex.encoding=THREE.sRGBEncoding;
    const mat=new THREE.MeshStandardMaterial({map:tex,side:THREE.DoubleSide,roughness:0.7});
    const im=new THREE.InstancedMesh(boardGeo,mat,list.length);
    list.forEach((b,i)=>im.setMatrixAt(i,place(b.s,b.side,POST_H+BH/2)));
    im.instanceMatrix.needsUpdate=true;
    im.frustumCulled=false;
    im.castShadow=true; im.userData.casts=true; shadowCasters.push(im);
    roadGroup.add(im);
  });

  if(posts.length){
    const pg=new THREE.BoxGeometry(0.1,POST_H,0.1); pg.translate(0,POST_H/2,0);
    const pm=new THREE.MeshStandardMaterial({color:sRGB(0x2a2e32),roughness:0.6});
    const im=new THREE.InstancedMesh(pg,pm,posts.length);
    posts.forEach((b,i)=>im.setMatrixAt(i,place(b.s,b.side,0)));
    im.instanceMatrix.needsUpdate=true;
    im.frustumCulled=false;
    roadGroup.add(im);
  }
})();

/* ---------------------------------------------------- start / finish line */
(function buildStartLine(){
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  trackAt(FINISH_S,p); trackDir(FINISH_S,d);
  const yaw=Math.atan2(d.x,d.y);

  const g=new THREE.Group();
  g.position.set(p.x,0,p.y);
  g.rotation.y=yaw;
  scene.add(g);
  // inside the group, +z is along the track and +x is the driver's left

  const white=sRGB(0xf2f0e8), dark=sRGB(0x121417);
  const flat=(col,off)=>new THREE.MeshStandardMaterial({
    color:col, roughness:0.62, metalness:0,
    polygonOffset:true, polygonOffsetFactor:off, polygonOffsetUnits:off
  });

  /* A single painted stripe vanishes at racing speed, so the line is a broad
     chequered band: a solid bar either side of a two-row chequer, run right
     across the asphalt. Drawn as one instanced mesh of squares. */
  const BAND=2.6, SQ=0.65, ROWS=2;
  const cols=Math.floor(ROAD_HALF*2/SQ);
  const sqGeo=new THREE.PlaneGeometry(SQ,SQ); sqGeo.rotateX(-Math.PI/2);
  const darkSq=new THREE.InstancedMesh(sqGeo,flat(dark,-8),cols*ROWS);
  const liteSq=new THREE.InstancedMesh(sqGeo,flat(white,-8),cols*ROWS);
  const m4=new THREE.Matrix4(), qq=new THREE.Quaternion(), one=new THREE.Vector3(1,1,1);
  const vv=new THREE.Vector3();
  let di=0, li=0;
  for(let r=0;r<ROWS;r++) for(let cI=0;cI<cols;cI++){
    vv.set(-ROAD_HALF+SQ*0.5+cI*SQ, 0.150, (r-(ROWS-1)/2)*SQ);
    m4.compose(vv,qq,one);
    if((r+cI)&1) liteSq.setMatrixAt(li++,m4); else darkSq.setMatrixAt(di++,m4);
  }
  m4.compose(vv.set(0,-500,0),qq,one);
  for(let i=di;i<darkSq.count;i++) darkSq.setMatrixAt(i,m4);
  for(let i=li;i<liteSq.count;i++) liteSq.setMatrixAt(i,m4);
  darkSq.instanceMatrix.needsUpdate=liteSq.instanceMatrix.needsUpdate=true;
  darkSq.frustumCulled=liteSq.frustumCulled=false;
  g.add(darkSq,liteSq);
  // solid bars bracketing the chequer
  [-1,1].forEach(s=>{
    const bar=new THREE.Mesh(new THREE.PlaneGeometry(ROAD_HALF*2,0.42),flat(white,-8));
    bar.rotation.x=-Math.PI/2;
    bar.position.set(0,0.150,s*(BAND*0.5-0.21));
    g.add(bar);
  });

  // gantry: two uprights outside the gravel and a deep beam over the road
  const steel=new THREE.MeshStandardMaterial({color:sRGB(0x24282c),roughness:0.5,metalness:0.6});
  const H=7.6, LEGX=SHOULDER+1.4, SPAN=LEGX*2+0.9;
  [-1,1].forEach(s=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.46,H,0.46),steel);
    leg.position.set(s*LEGX,H/2,0);
    leg.castShadow=true; leg.userData.casts=true; shadowCasters.push(leg);
    g.add(leg);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.35,1.5),steel);
    foot.position.set(s*LEGX,0.175,0); g.add(foot);
  });
  const beam=new THREE.Mesh(new THREE.BoxGeometry(SPAN,1.5,0.62),steel);
  beam.position.y=H-0.75;
  beam.castShadow=true; beam.userData.casts=true; shadowCasters.push(beam);
  g.add(beam);
  // chequered facing on the beam, on the approach side, so it reads head-on
  const bcols=Math.floor(SPAN/0.75);
  const face=new THREE.PlaneGeometry(0.75,0.5);
  const fD=new THREE.InstancedMesh(face,new THREE.MeshStandardMaterial({color:dark,roughness:.6}),bcols*2);
  const fL=new THREE.InstancedMesh(face,new THREE.MeshStandardMaterial({color:white,roughness:.6}),bcols*2);
  let ai=0,bi=0;
  for(let r=0;r<2;r++) for(let cI=0;cI<bcols;cI++){
    vv.set(-SPAN/2+0.375+cI*0.75, H-0.35-r*0.5, -0.32);
    m4.compose(vv,qq,one);
    if((r+cI)&1) fL.setMatrixAt(bi++,m4); else fD.setMatrixAt(ai++,m4);
  }
  m4.compose(vv.set(0,-500,0),qq,one);
  for(let i=ai;i<fD.count;i++) fD.setMatrixAt(i,m4);
  for(let i=bi;i<fL.count;i++) fL.setMatrixAt(i,m4);
  fD.instanceMatrix.needsUpdate=fL.instanceMatrix.needsUpdate=true;
  fD.frustumCulled=fL.frustumCulled=false;
  g.add(fD,fL);

  // five start lights, dark — decoration, not a sequence
  const bulbGeo=new THREE.SphereGeometry(0.26,12,8);
  const bulbMat=new THREE.MeshStandardMaterial({color:sRGB(0x2a0705),roughness:0.35,
                                                emissive:sRGB(0x3d0b06),emissiveIntensity:0.6});
  for(let i=0;i<5;i++){
    const b=new THREE.Mesh(bulbGeo,bulbMat);
    b.position.set((i-2)*0.95, H-1.75, -0.42);
    g.add(b);
  }

  /* Boards either side of the line. Deliberately tall and close to the
     asphalt: from the cockpit these flick past at the exact moment you cross,
     which is what actually makes the line obvious at 300 kph. */
  [-1,1].forEach(s=>{
    const post=new THREE.Mesh(new THREE.BoxGeometry(0.18,2.7,0.18),steel);
    post.position.set(s*(ROAD_HALF+1.5),1.35,0); g.add(post);
    const board=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.25),
      new THREE.MeshStandardMaterial({color:white,roughness:0.6,side:THREE.DoubleSide}));
    board.position.set(s*(ROAD_HALF+1.5),2.6,0);
    board.rotation.y=Math.PI/2;
    board.castShadow=true; board.userData.casts=true; shadowCasters.push(board);
    g.add(board);
    const stripe=new THREE.Mesh(new THREE.PlaneGeometry(2.4,0.32),
      new THREE.MeshStandardMaterial({color:sRGB(0xb4291a),roughness:0.6,side:THREE.DoubleSide}));
    stripe.position.set(s*(ROAD_HALF+1.5)+0.02*s,2.6,0);
    stripe.rotation.y=Math.PI/2;
    g.add(stripe);
  });
})();

/* ------------------------------------------------------- start-light rig */
/* The start/finish gantry is 580 m up the road from the grid, far too distant
   to read a light sequence off, so the lights get their own gantry just ahead
   of the car -- which is also where they sit on a real grid. Five columns of
   two, matching the real panel. Each column owns its material so it can be
   lit independently. */
const bulbMats=[];
const L_ON_C =sRGB(0xff5a22), L_ON_E =sRGB(0xff2f0a);
const L_OFF_C=sRGB(0x300d08), L_OFF_E=sRGB(0x120302);
const LIGHTS_AHEAD=40;   // close enough that the halo strut does not hide the panel

(function buildStartLights(){
  const s=START_S+LIGHTS_AHEAD;
  const p=new THREE.Vector2(), d=new THREE.Vector2();
  trackAt(s,p); trackDir(s,d);
  const g=new THREE.Group();
  g.position.set(p.x,0,p.y);
  g.rotation.y=Math.atan2(d.x,d.y);
  scene.add(g);
  // in group space +z is the direction of travel, so the car sits at -z and
  // the panel has to face back toward it
  const steel=new THREE.MeshStandardMaterial({color:sRGB(0x24282c),roughness:0.5,metalness:0.6});
  const H=7.2, LEGX=SHOULDER+1.4;
  [-1,1].forEach(sg=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.4,H,0.4),steel);
    leg.position.set(sg*LEGX,H/2,0);
